<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movyza | موفيزا — منصة الأفلام والمسلسلات العربية</title>
    <meta name="description" content="منصة أفلام ومسلسلات عربية حديثة مصممة بأسلوب عالي الأداء مع تجربة سينمائية عربية أصيلة." />
    <meta property="og:title" content="Movyza | موفيزا — منصة الأفلام والمسلسلات العربية" />
    <meta property="og:description" content="منصة أفلام ومسلسلات عربية حديثة مصممة بأسلوب عالي الأداء مع تجربة سينمائية عربية أصيلة." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#050507" />
    <meta name="movyz-build" content="%VITE_MOVYZ_BUILD_ID%" />
    <meta name="movyz-player" content="vidsrc" />
    <meta name="movyz-subtitles" content="vidsrc-locale-subtitles-v1" />
    <link rel="preconnect" href="https://quge5.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=El+Messiri:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#050507] text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200 min-h-screen">
    <div id="root"></div>
    <script>
      (async () => {
        try {
          const meta = document.querySelector('meta[name="movyz-build"]');
          const buildId = meta?.getAttribute('content') || '';
          const isStamped = buildId && !buildId.includes('%VITE_');
          const resetKey = isStamped ? 'movyz:frontend-reset:' + buildId : '';
          const resetDone = resetKey ? sessionStorage.getItem(resetKey) === '1' : true;

          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations
                .filter((registration) => !registration.active?.scriptURL.endsWith('/sw.js'))
                .map((registration) => registration.unregister()),
            );
          }

          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map((name) => caches.delete(name)));
          }

          if (isStamped && !resetDone) {
            sessionStorage.setItem(resetKey, '1');
            const next = new URL(window.location.href);
            next.searchParams.set('__movyz_build', buildId);
            window.location.replace(next.toString());
            return;
          }
        } catch {
          // Cache cleanup must never block the application.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
