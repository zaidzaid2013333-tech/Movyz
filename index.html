<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movyza | موفيزا — منصة الأفلام والمسلسلات العربية</title>
    <meta name="description" content="اكتشف الأفلام والمسلسلات العالمية في Movyza، مع صفحات تفصيلية للقصص والطاقم والتقييمات وتجربة تصفح سينمائية متعددة اللغات." />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:site_name" content="Movyza" />
    <meta name="theme-color" content="#050507" />
    <meta name="movyz-build" content="%VITE_MOVYZ_BUILD_ID%" />
    <meta name="movyz-player" content="vidsrc" />
    <meta name="movyz-subtitles" content="vidsrc-locale-subtitles-v1" />
    <link rel="preconnect" href="https://quge5.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=El+Messiri:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#050507] text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200 min-h-screen">
    <div id="root">
      <div id="movyza-boot-fallback" role="status" aria-live="polite" dir="rtl" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#050507;color:#f8fafc;text-align:center;font-family:system-ui,sans-serif">
        <div>
          <div style="width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#ffe6a0,#f2b84b,#b87920);color:#111;font-size:34px;font-weight:900">M</div>
          <p style="margin:0;color:#e5e7eb">جارٍ تشغيل موفيزا...</p>
          <p id="movyza-boot-hint" hidden style="max-width:320px;line-height:1.8;color:#a1a1aa">يبدو أن الواجهة تأخرت في التحميل.</p>
          <button id="movyza-boot-reload" type="button" hidden onclick="window.location.reload()" style="margin-top:12px;padding:12px 20px;border:0;border-radius:12px;background:#f2b84b;color:#111;font-weight:800">إعادة تحميل الصفحة</button>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(() => {
        const root = document.getElementById('root');
        const fallback = document.getElementById('movyza-boot-fallback');
        if (!root || !fallback || !root.contains(fallback)) return;
        const hint = document.getElementById('movyza-boot-hint');
        const reload = document.getElementById('movyza-boot-reload');
        if (hint) hint.hidden = false;
        if (reload) reload.hidden = false;
        const message = fallback.querySelector('p');
        if (message) message.textContent = 'لم تكتمل عملية تحميل الواجهة.';
      }, 9000);
    </script>
    <script>
      (async () => {
        try {
          const meta = document.querySelector('meta[name="movyz-build"]');
          const buildId = meta?.getAttribute('content') || '';
          const isStamped = buildId && !buildId.includes('%VITE_');
          const resetKey = isStamped ? 'movyz:frontend-reset:' + buildId : '';
          const resetDone = resetKey ? sessionStorage.getItem(resetKey) === '1' : true;

          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations
                .filter((registration) => !registration.active?.scriptURL.endsWith('/sw.js'))
                .map((registration) => registration.unregister()),
            );
          }

          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map((name) => caches.delete(name)));
          }

          if (isStamped && !resetDone) {
            sessionStorage.setItem(resetKey, '1');
            const next = new URL(window.location.href);
            next.searchParams.set('__movyz_build', buildId);
            window.location.replace(next.toString());
            return;
          }
        } catch {
          // Cache cleanup must never block the application.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
