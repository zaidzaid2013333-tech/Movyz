plugins { id 'com.android.application' }

def tmdbToken = System.getenv("TMDB_API_READ_ACCESS_TOKEN") ?: ""
def supabaseUrl = System.getenv("SUPABASE_URL") ?: ""
def supabaseAnon = System.getenv("SUPABASE_ANON_KEY") ?: ""

android {
    namespace 'sbs.movyza.app'
    compileSdk 35

    defaultConfig {
        applicationId 'sbs.movyza.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
                buildConfigField "String", "TMDB_READ_TOKEN", "\"" + tmdbToken.replace("\\","\\\\").replace(""","\\"") + "\"""
                buildConfigField "String", "SUPABASE_URL", "\"" + supabaseUrl.replace("\\","\\\\").replace(""","\\"") + "\"""
                buildConfigField "String", "SUPABASE_ANON_KEY", "\"" + supabaseAnon.replace("\\","\\\\").replace(""","\\"") + "\"""
    }

    buildFeatures { buildConfig = true }

    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug'; minifyEnabled false }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
}