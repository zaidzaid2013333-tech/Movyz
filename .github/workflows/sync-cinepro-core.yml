name: Sync CinePro Core

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-cinepro-core.yml"
      - "cinepro-core-sync.trigger"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name != 'issues' || contains(github.event.issue.title, 'Sync CinePro Core')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Movyz
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync official CinePro Core
        run: |
          rm -rf cinepro-core
          git clone --depth 1 https://github.com/cinepro-org/core.git cinepro-core
          rm -rf cinepro-core/.git
          rm -f cinepro-core-sync.trigger

      - name: Commit synced Core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cinepro-core cinepro-core-sync.trigger
          if git diff --cached --quiet; then
            echo "No CinePro Core changes."
            exit 0
          fi
          git commit -m "chore: sync official CinePro Core"
          git push
