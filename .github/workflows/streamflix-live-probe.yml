name: StreamFlix live probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public StreamFlix integration
        run: |
          node <<'NODE'
          const ids = [550, 278, 603, 969681, 1084244];
          const headers = {
            'User-Agent': 'Mozilla/5.0 (compatible; Movyz-Provider-Probe/1.0)',
            'Accept': 'application/json, */*',
          };

          const fetchJson = async (url) => {
            const r = await fetch(url, {headers, signal: AbortSignal.timeout(15000)});
            if (!r.ok) throw new Error(`${url} -> HTTP ${r.status}`);
            return r.json();
          };

          const data = await fetchJson('https://api.streamflix.app/data.json');
          const config = await fetchJson('https://api.streamflix.app/config/config-streamflixapp.json');
          const items = Array.isArray(data?.data) ? data.data : [];
          const bases = [...new Set((Array.isArray(config?.download) ? config.download : []).filter(v => typeof v === 'string' && v.startsWith('https://')))];

          console.log(`DATA_ITEMS=${items.length}`);
          console.log(`DOWNLOAD_BASES=${bases.length}`);
          if (!items.length || !bases.length) throw new Error('StreamFlix public catalog/config is empty');

          let found = null;
          for (const id of ids) {
            const match = items.find(item => String(item?.tmdb) === String(id));
            if (match?.movielink) {
              found = { id, name: match.moviename, url: `${bases[0]}${match.movielink}` };
              break;
            }
          }

          if (!found) throw new Error(`No test TMDB id matched in StreamFlix catalog: ${ids.join(',')}`);
          console.log(`MATCH=${found.id} ${found.name}`);
          console.log(`URL=${found.url}`);

          const probe = await fetch(found.url, {
            method: 'GET',
            headers: {...headers, Range: 'bytes=0-0'},
            redirect: 'follow',
            signal: AbortSignal.timeout(15000),
          });
          console.log(`STREAM_HTTP=${probe.status}`);
          console.log(`CONTENT_TYPE=${probe.headers.get('content-type') || ''}`);
          if (!((probe.status >= 200 && probe.status < 400) || probe.status === 206)) {
            throw new Error(`Stream URL is not reachable: HTTP ${probe.status}`);
          }
          await probe.body?.cancel();
          NODE