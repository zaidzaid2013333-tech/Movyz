name: Movyz Akwam Queue Seed

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/enqueue-akwam-catalog.ts"
      - ".github/workflows/akwam-queue-seed.yml"

permissions:
  contents: read

concurrency:
  group: movyz-akwam-queue-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/enqueue-akwam-catalog.ts
