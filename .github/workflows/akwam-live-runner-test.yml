name: Akwam Live Runner Test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/akwam-live-runner-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-akwam-live-runner-test
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check worker
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30             https://movyz-akwam-prefill.sameranede.workers.dev/
      - name: Process five real movie jobs
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 360             -X POST             -H "x-movyz-prefill-key: $SUPABASE_SERVICE_ROLE_KEY"             -H "x-movyz-prefill-mode: live-test"             https://movyz-akwam-prefill.sameranede.workers.dev/
