name: Akwam Live Runner Test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/akwam-live-runner-test.yml"
      - "workers/akwam-prefill/src/index.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-akwam-live-runner-test
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check worker
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            body=$(curl --fail-with-body --silent --show-error --max-time 20               https://movyz-akwam-prefill.sameranede.workers.dev/)
            echo "$body"
            if echo "$body" | grep -Fq '"build":"akwam-prefill-media-v1"'; then
              exit 0
            fi
            sleep 5
          done
          echo "Expected build was not observed"
          exit 1
      - name: Inspect one failing Akwam movie page
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          movie='https://akwam.ss/movie/10762/cocktail'
          curl -L --fail-with-body --silent --show-error --max-time 30 -A "$ua" -H 'Accept: text/html' "$movie" -o /tmp/movie.html
          echo "movie_bytes=$(wc -c < /tmp/movie.html | tr -d ' ')"
          echo '=== download/link markers ==='
          grep -Ein 'btn-loader|/download/|/link/|m3u8|mp4|mpd|webm|data-file|data-video|data-url|download' /tmp/movie.html | head -200 || true
          download='https://akwam.ss/download/170586/10762/cocktail'
          curl -L --fail-with-body --silent --show-error --max-time 30 -A "$ua" -H "Referer: $movie" -H 'Accept: text/html' "$download" -o /tmp/download.html
          echo "download_bytes=$(wc -c < /tmp/download.html | tr -d ' ')"
          echo '=== download page markers ==='
          grep -Ein 'btn-loader|link-download|download|href=|src=|data-file|data-video|data-url|m3u8|mp4|mpd|webm|iframe|player|stream|file' /tmp/download.html | head -250 || true
          echo '=== download page urls ==='
          grep -Eoi 'https?://[^"'"'"' <>]+' /tmp/download.html | grep -Ei 'm3u8|mp4|mpd|webm|stream|video|download|link' | head -100 || true

          media='https://s303d1.downet.net/download/1791241862/6ac2dd06f1897/Cocktail.2012720p.WEB-DL.AKWAM.mp4'
          echo '=== media response ==='
          curl -k -L --silent --show-error --max-time 30 -A "$ua" -H "Referer: $download" -H 'Range: bytes=0-8191' -o /tmp/media.bin \
            -D /tmp/media.headers -w 'status=%{http_code} type=%{content_type} length=%{content_length_download} bytes=%{size_download}
' "$media" || true
          cat /tmp/media.headers | grep -Ei '^(content-type|content-length|content-range|content-disposition|location):' || true
          wc -c /tmp/media.bin

          echo '=== hrefs ==='
          grep -Eoi 'href=["'"'"'][^"'"'"']+["'"'"']' /tmp/movie.html | grep -Ei 'download|link|watch|movie' | head -100 || true

      - name: Probe direct Akwam CDN media
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          media='https://s303d1.downet.net/download/1791241862/6ac2dd06f1897/Cocktail.2012720p.WEB-DL.AKWAM.mp4'
          referer='https://akwam.ss/download/170586/10762/cocktail'
          rm -f /tmp/media.bin /tmp/media.headers
          curl -k -L --silent --show-error --max-time 30 \
            -A "$ua" -H "Referer: $referer" -H 'Accept: */*' -H 'Range: bytes=0-8191' \
            -o /tmp/media.bin -D /tmp/media.headers \
            -w 'status=%{http_code} type=%{content_type} bytes=%{size_download} redirect=%{num_redirects}\n' \
            "$media"
          echo '=== selected headers ==='
          grep -Ei '^(content-type|content-length|content-range|content-disposition|location|server|accept-ranges):' /tmp/media.headers || true
          echo '=== first bytes ==='
          xxd -l 64 /tmp/media.bin || true
          wc -c /tmp/media.bin

      - name: Process five real movie jobs
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 360             -X POST             -H "x-movyz-prefill-key: $SUPABASE_SERVICE_ROLE_KEY"             -H "x-movyz-prefill-mode: live-test"             https://movyz-akwam-prefill.sameranede.workers.dev/
