name: MediaMash Worker Smoke

on:
  push:
    branches: ["main"]
    paths:
      - "integrations/mediamash/**"
      - ".github/workflows/mediamash-worker-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy MediaMash Worker
        run: |
          npx wrangler deploy --config integrations/mediamash/wrangler.json
          printf '%s' "$TMDB_API_READ_ACCESS_TOKEN" | npx wrangler secret put TMDB_API_READ_ACCESS_TOKEN --config integrations/mediamash/wrangler.json

      - name: Health
        run: |
          curl -fsS --max-time 30 "https://movyz-media-core.sameranede.workers.dev/v1/health"

      - name: Interstellar sources
        run: |
          curl -sS --max-time 90 "https://movyz-media-core.sameranede.workers.dev/v1/movies/157336" > /tmp/interstellar.json
          cat /tmp/interstellar.json
          python - <<'PY'
          import json, sys
          p=json.load(open('/tmp/interstellar.json'))
          print(json.dumps({
            "sources": len(p.get("sources", [])),
            "providers": sorted({s.get("provider", {}).get("name") for s in p.get("sources", [])}),
            "first": p.get("sources", [])[:2],
            "diagnostics": p.get("diagnostics", []),
          }, ensure_ascii=False, indent=2))
          if not p.get("sources"):
              raise SystemExit("MediaMash Worker returned zero Interstellar sources")
          PY

      - name: Breaking Bad S01E01 sources
        run: |
          curl -fsS --max-time 90 "https://movyz-media-core.sameranede.workers.dev/v1/tv/1399/seasons/1/episodes/1" > /tmp/breakingbad.json
          python - <<'PY'
          import json, sys
          p=json.load(open('/tmp/breakingbad.json'))
          print(json.dumps({
            "sources": len(p.get("sources", [])),
            "providers": sorted({s.get("provider", {}).get("name") for s in p.get("sources", [])}),
            "first": p.get("sources", [])[:2],
            "diagnostics": p.get("diagnostics", []),
          }, ensure_ascii=False, indent=2))
          if not p.get("sources"):
              raise SystemExit("MediaMash Worker returned zero Breaking Bad sources")
          PY

      - name: Probe HLS playlist and first media segment
        run: |
          python - <<'PY'
          import json, subprocess
          p=json.load(open('/tmp/interstellar.json'))
          working=None
          playlist_body=None

          for idx, source in enumerate(p.get('sources', [])[:6]):
              url=source.get('url')
              if not url: continue
              probe=subprocess.run(
                ['curl','-L','-sS','--max-time','30','-o',f'/tmp/playlist-{idx}.txt','-w','%{http_code} %{content_type} %{size_download}',url],
                text=True,capture_output=True
              )
              body=open(f'/tmp/playlist-{idx}.txt','r',errors='replace').read(16384)
              print("PROXY_PROBE", idx, source.get('provider',{}).get('name'), probe.stdout, "EXTM3U=", "#EXTM3U" in body)
              if probe.returncode == 0 and probe.stdout.startswith('200 ') and '#EXTM3U' in body:
                  working=source
                  playlist_body=body
                  break

          if not working:
              raise SystemExit("MediaMash Worker proxy did not return a valid HLS playlist")

          print("WORKING_PLAYBACK_SOURCE", json.dumps(working, ensure_ascii=False)[:12000])

          import re
          segment = None
          for line in playlist_body.splitlines():
              line=line.strip()
              if line and not line.startswith('#'):
                  segment=line
                  break

          if not segment:
              raise SystemExit("No media segment found in HLS playlist")

          from urllib.parse import urljoin
          upstream_playlist=working['url']
          segment_url=urljoin(upstream_playlist, segment)

          segprobe=subprocess.run(
            ['curl','-L','-sS','--max-time','30','-o','/tmp/segment.bin','-w','%{http_code} %{content_type} %{size_download}',segment_url],
            text=True,capture_output=True
          )
          print("SEGMENT_PROBE", segprobe.stdout, "bytes=", len(open('/tmp/segment.bin','rb').read()))
          if segprobe.returncode != 0 or not segprobe.stdout.startswith(('200 ','206 ')) or len(open('/tmp/segment.bin','rb').read()) < 32:
              raise SystemExit("Media segment probe failed")
          PY
