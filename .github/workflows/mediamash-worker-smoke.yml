name: MediaMash Worker Smoke

on:
  push:
    branches: ["main"]
    paths:
      - "integrations/mediamash/**"
      - ".github/workflows/mediamash-worker-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy MediaMash Worker
        run: |
          npx wrangler deploy --config integrations/mediamash/wrangler.json
          printf '%s' "$TMDB_API_READ_ACCESS_TOKEN" | npx wrangler secret put TMDB_API_READ_ACCESS_TOKEN --config integrations/mediamash/wrangler.json

      - name: Health
        run: |
          curl -fsS --max-time 30 "https://movyz-media-core.sameranede.workers.dev/v1/health"

      - name: Interstellar sources
        run: |
          curl -fsS --max-time 90 "https://movyz-media-core.sameranede.workers.dev/v1/movies/157336" > /tmp/interstellar.json
          python - <<'PY'
          import json, sys
          p=json.load(open('/tmp/interstellar.json'))
          print(json.dumps({
            "sources": len(p.get("sources", [])),
            "providers": sorted({s.get("provider", {}).get("name") for s in p.get("sources", [])}),
            "first": p.get("sources", [])[:2],
            "diagnostics": p.get("diagnostics", []),
          }, ensure_ascii=False, indent=2))
          if not p.get("sources"):
              raise SystemExit("MediaMash Worker returned zero Interstellar sources")
          PY

      - name: Breaking Bad S01E01 sources
        run: |
          curl -fsS --max-time 90 "https://movyz-media-core.sameranede.workers.dev/v1/tv/1399/seasons/1/episodes/1" > /tmp/breakingbad.json
          python - <<'PY'
          import json, sys
          p=json.load(open('/tmp/breakingbad.json'))
          print(json.dumps({
            "sources": len(p.get("sources", [])),
            "providers": sorted({s.get("provider", {}).get("name") for s in p.get("sources", [])}),
            "first": p.get("sources", [])[:2],
            "diagnostics": p.get("diagnostics", []),
          }, ensure_ascii=False, indent=2))
          if not p.get("sources"):
              raise SystemExit("MediaMash Worker returned zero Breaking Bad sources")
          PY

      - name: Probe first HLS playlist
        run: |
          python - <<'PY'
          import json, subprocess, sys
          p=json.load(open('/tmp/interstellar.json'))
          url=p['sources'][0]['url']
          probe=subprocess.run(
            ['curl','-L','-sS','--max-time','45','-o','/tmp/playlist.txt','-w','%{http_code} %{content_type} %{size_download}',url],
            text=True,capture_output=True
          )
          print("PROXY_PROBE", probe.stdout)
          body=open('/tmp/playlist.txt','r',errors='replace').read(8192)
          print(body[:2000])
          if probe.returncode or not probe.stdout.startswith('200 ') or '#EXTM3U' not in body:
              raise SystemExit("MediaMash Worker proxy did not return a valid HLS playlist")
          PY
