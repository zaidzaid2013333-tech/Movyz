name: Provider smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test VidZee direct stream API
        run: |
          node <<'NODE'
          const headers = {
            'User-Agent': 'Mozilla/5.0 (compatible; Movyz-Smoke/1.0)',
            'Accept': 'application/json, */*',
            'Referer': 'https://player.vidzee.wtf/'
          };

          const get = async (url) => {
            const r = await fetch(url, {
              headers,
              redirect: 'follow',
              signal: AbortSignal.timeout(20000)
            });
            const body = await r.text();
            console.log('API', url, 'HTTP', r.status, 'TYPE', r.headers.get('content-type') || '');
            if (!r.ok) throw new Error(url + ' -> HTTP ' + r.status + ' ' + body.slice(0,300));
            try { return JSON.parse(body); } catch { return body; }
          };

          const servers = ['dcloud','tik','ipcloud','v6:Hindi'];
          let data = null;
          for (const server of servers) {
            try {
              const candidate = await get('https://core.vidzee.wtf/streams/movie/550?s=' + encodeURIComponent(server) + '&e=0');
              if (candidate && typeof candidate.url === 'string' && /^https?:\/\//i.test(candidate.url)) { data = candidate; console.log('SELECTED_SERVER', server); break; }
            } catch (error) { console.log('SERVER_FAILED', server, String(error)); }
          }
          if (!data) throw new Error('VidZee did not return a direct stream URL from any configured server');

          const r = await fetch(data.url, {
            headers: {...headers, Range:'bytes=0-1023'},
            redirect: 'follow',
            signal: AbortSignal.timeout(20000)
          });

          console.log('STREAM', 'HTTP', r.status, 'FINAL_URL', r.url, 'TYPE', r.headers.get('content-type') || '', 'LENGTH', r.headers.get('content-length') || '');

          const type = (r.headers.get('content-type') || '').toLowerCase();
          const playable = type.includes('mpegurl') || type.includes('video/') || /\.m3u8(?:$|\?)/i.test(r.url) || r.status === 206 || r.status === 416;

          if (!r.ok && r.status !== 206 && r.status !== 416) throw new Error('VidZee stream URL returned HTTP ' + r.status);
          if (!playable) throw new Error('VidZee returned a non-playable response');

          console.log('VIDZEE_SMOKE=PASS');
          NODE
