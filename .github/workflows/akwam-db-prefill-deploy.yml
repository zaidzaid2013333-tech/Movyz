name: Deploy Movyz Akwam DB Prefill

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "workers/akwam-prefill/**"
      - "workers/akwam-launcher/**"
      - "scripts/run-akwam-prefill.ts"
      - ".github/workflows/akwam-db-prefill-deploy.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: movyz-akwam-prefill-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Runner heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          payload=$(printf '%s' "{\"job_key\":\"akwam-github-prefill\",\"lease_until\":\"$now\",\"last_run_at\":\"$now\",\"stats\":{\"state\":\"started\",\"executor\":\"github-actions\",\"run\":\"$GITHUB_RUN_ID\"},\"updated_at\":\"$now\"}")
          curl --fail-with-body --max-time 20 -sS -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data "$payload" \
            "$SUPABASE_URL/rest/v1/maintenance_state?on_conflict=job_key"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install wrangler@4.140.0 --no-save --ignore-scripts --no-audit --no-fund

      - name: Prepare Worker secrets
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" > .env.akwam-prefill

      - name: Probe Akwam access from GitHub Actions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          headers=/tmp/akwam-probe.headers
          body=/tmp/akwam-probe.html
          status=$(curl -L --max-time 25 -sS -D "$headers" -o "$body" -w '%{http_code}' \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            -H 'Accept-Language: ar,en;q=0.9' \
            'https://akwam.ss/search?q=Interstellar')
          bytes=$(wc -c < "$body" | tr -d ' ')
          server=$(awk -F': ' 'tolower($1)=="server"{print $2}' "$headers" | tr -d '\r' | tail -1 || true)
          has_search=$(grep -Eio 'Interstellar|movie/|series/' "$body" | head -1 || true)
          echo "AKWAM_GHA_STATUS=$status BYTES=$bytes SERVER=${server:-unknown} MATCH=${has_search:-none}"

          payload=$(node -e '
            const fs=require("fs");
            const [status,bytes,server,match]=process.argv.slice(1);
            console.log(JSON.stringify({
              job_key:"akwam-github-actions-probe",
              lease_until:new Date(Date.now()+60*60*1000).toISOString(),
              last_run_at:new Date().toISOString(),
              last_success_at:Number(status)>=200 && Number(status)<400 ? new Date().toISOString() : null,
              last_error:Number(status)>=200 && Number(status)<400 ? null : "Akwam HTTP "+status,
              stats:{state:"probe",executor:"github-actions",status:Number(status),bytes:Number(bytes),server:server||null,match:match||null,at:new Date().toISOString()},
              updated_at:new Date().toISOString()
            }));
          ' "$status" "$bytes" "$server" "$has_search")

          curl --fail-with-body --max-time 20 -sS -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data "$payload" \
            "$SUPABASE_URL/rest/v1/maintenance_state?on_conflict=job_key"

      - name: Stop legacy 20-worker Akwam/CinePro runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --limit 100 --json databaseId,status,workflowName --jq '.[] | select(.workflowName=="Movyz Akwam Persistent Prefill" and (.status=="in_progress" or .status=="queued")) | .databaseId')
          for id in $ids; do
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

      - name: Deploy Akwam DB prefill worker
        run: npx wrangler deploy -c workers/akwam-prefill/wrangler.toml --secrets-file .env.akwam-prefill

      - name: Deploy three Akwam launcher workers into existing Cron slots
        run: |
          for name in movyz-akwam-launcher-1 chachty chachty-content-sync; do
            npx wrangler deploy -c workers/akwam-launcher/wrangler.toml --name "$name" --secrets-file .env.akwam-prefill
          done

      - name: Inventory existing Cloudflare Cron triggers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            > /tmp/cf-workers.json
          echo "=== Workers with Cron triggers ==="
          for id in $(jq -r '.result[].id' /tmp/cf-workers.json); do
            schedules=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$id/schedules")
            count=$(printf '%s' "$schedules" | jq '.result.schedules | length')
            if [ "$count" -gt 0 ]; then
              crons=$(printf '%s' "$schedules" | jq -r '[.result.schedules[].cron] | join(",")')
              echo "$id => $crons"
            fi
          done

      - name: Smoke one Akwam prefill batch
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          response=$(curl --fail-with-body --max-time 120 -sS -X POST \
            -H "x-movyz-prefill-key: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "x-movyz-prefill-mode: batch" \
            https://movyz-akwam-prefill.sameranede.workers.dev/)
          echo "$response"
          printf '%s' "$response" | node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            if (!data.ok || Number(data.saved || 0) < 1 || Number(data.failed || 0) > 0) {
              console.error("Akwam smoke did not prepare a source:", JSON.stringify(data));
              process.exit(1);
            }
          '

      - if: always()
        run: rm -f .env.akwam-prefill

  prefill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAX_JOBS_PER_RUN: "50"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run deterministic Akwam prefill from GitHub Actions
        run: npx tsx scripts/run-akwam-prefill.ts
