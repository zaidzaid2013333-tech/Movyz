name: MediaMash Provider Smoke

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mediamash-smoke.yml"
      - "worker.ts"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TMDB_READ_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone MediaMash
        run: git clone --depth 1 https://github.com/Mediamash-org/backend.git .mediamash

      - name: Install MediaMash
        working-directory: .mediamash
        run: npm install --no-audit --no-fund

      - name: Build MediaMash
        working-directory: .mediamash
        run: npm run build

      - name: Configure TMDB bearer bridge
        working-directory: .mediamash
        run: |
          cat > tmdb-bearer.mjs <<'EOF'
          const nativeFetch = globalThis.fetch
          const token = process.env.TMDB_READ_TOKEN

          globalThis.fetch = async (input, init = {}) => {
            const url = new URL(
              typeof input === 'string'
                ? input
                : input instanceof URL
                  ? input.href
                  : input.url,
            )

            if (url.hostname === 'api.themoviedb.org' && token) {
              url.searchParams.delete('api_key')
              const headers = new Headers(
                init.headers || (input instanceof Request ? input.headers : undefined),
              )
              headers.set('Authorization', 'Bearer ' + token)
              return nativeFetch(url, { ...init, headers })
            }

            return nativeFetch(input, init)
          }
          EOF

      - name: Start MediaMash
        working-directory: .mediamash
        run: |
          cat > .env <<'EOF'
          PORT=3000
          HOST=127.0.0.1
          PUBLIC_URL=http://127.0.0.1:3000
          TMDB_API_KEY=placeholder
          CACHE_TYPE=memory
          INTERNAL_DEBUG=true
          NODE_ENV=production
          EOF
          node --import ./tmdb-bearer.mjs dist/server.js > /tmp/mediamash.log 2>&1 &
          echo $! > /tmp/mediamash.pid

      - name: Wait for MediaMash
        working-directory: .mediamash
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mediamash.log
          exit 1

      - name: Test Interstellar
        run: |
          curl -fsS --max-time 120 "http://127.0.0.1:3000/v1/movies/157336?platform=web" > /tmp/interstellar.json
          python - <<'PY'
          import json, subprocess
          p=json.load(open('/tmp/interstellar.json'))
          print(json.dumps({
            "sources": len(p.get("sources", [])),
            "providers": sorted({s.get("provider", {}).get("name") for s in p.get("sources", []) if s.get("provider")}),
            "diagnostics": p.get("diagnostics", []),
          }, ensure_ascii=False, indent=2))

          candidates=[
            s for s in p.get("sources", [])
            if s.get("provider",{}).get("name") != "Example Provider" and s.get("url")
          ]
          if not candidates:
              raise SystemExit("No non-example MediaMash source to probe")

          working=[]
          for idx,s in enumerate(candidates):
              probe=subprocess.run(
                ["curl","-L","-sS","--max-time","30","-o",f"/tmp/probe-{idx}.txt","-w","%{http_code} %{content_type} %{size_download}",s["url"]],
                text=True,capture_output=True
              )
              body=open(f"/tmp/probe-{idx}.txt","r",errors="replace").read(8192)
              print("SOURCE_PROBE", idx, s.get("provider",{}).get("name"), probe.stdout, "EXTM3U=", "#EXTM3U" in body)
              if probe.returncode == 0 and probe.stdout.startswith("200 "):
                  working.append((idx,s))
                  if "#EXTM3U" in body:
                      break

          if not working:
              raise SystemExit("No non-example MediaMash source was reachable through the Node proxy")
          print("WORKING_SOURCE", json.dumps(working[0][1], ensure_ascii=False)[:12000])
          PY

      - name: Test Breaking Bad S01E01
        run: |
          curl -fsS --max-time 120 "http://127.0.0.1:3000/v1/tv/1399/seasons/1/episodes/1?platform=web" > /tmp/breakingbad.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/breakingbad.json'))
          print(json.dumps({
            "sources": len(p.get("sources", [])),
            "diagnostics": p.get("diagnostics", []),
            "providers": sorted({s.get("provider", {}).get("name") for s in p.get("sources", []) if s.get("provider")}),
          }, ensure_ascii=False, indent=2))
          if not p.get("sources"):
              raise SystemExit("MediaMash returned zero sources for Breaking Bad S01E01")
          PY

      - name: Dump MediaMash logs on failure
        if: failure()
        working-directory: .mediamash
        run: cat /tmp/mediamash.log
