name: Verify OmegaTech title-year matching
on:
  push:
    branches: [fix/omegatech-title-year-matching]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run lint
      - name: Test The Office and regression cases
        run: |
          cat > scripts/probe-title-year.ts <<'TS'
          import { resolveRemotePlayback } from '../server/providers/remote-resolver.ts';

          const cases = [
            { type: 'movie' as const, tmdbId: 27205 },
            { type: 'series' as const, tmdbId: 1396, season: 1, episode: 1 },
            { type: 'series' as const, tmdbId: 2316, season: 1, episode: 1 },
          ];

          (async () => {
            let failed = false;
            for (const request of cases) {
              try {
                const sources = await resolveRemotePlayback(request);
                console.log(JSON.stringify({
                  request,
                  count: sources.length,
                  refs: sources.map((source) => source.providerReference),
                  files: sources.map((source) => source.url.split('/').pop()),
                }, null, 2));
                if (!sources.length) failed = true;
              } catch (error) {
                failed = true;
                console.error(JSON.stringify({
                  request,
                  error: error instanceof Error ? error.stack : String(error),
                }, null, 2));
              }
            }
            if (failed) process.exit(1);
          })();
          TS
          npx tsx scripts/probe-title-year.ts
