name: Movyz full movie source prewarm

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/full-movie-source-prewarm.yml"
      - "scripts/rebind-selected-playback.ts"
      - "server/providers/re3arabi.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-full-movie-source-prewarm
  cancel-in-progress: false

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      REBIND_MODE: movies
      REBIND_LIMIT: "500"
      REBIND_CONCURRENCY: "8"
      RE3ARABI_TIMEOUT_MS: "7000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Rebuild every movie source mapping
        run: npx tsx scripts/rebind-selected-playback.ts

      - name: Verify catalog integrity
        run: npx tsx scripts/verify-tmdb-sync.ts
