name: Movyz Akwam legacy download POST diagnostic

on:
  push:
    paths:
      - ".github/workflows/debug-interstellar-resolver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Test legacy download POST
        run: |
          npx tsx -e "
          (async () => {
            const urls = [
              'https://akwam.ss/old/download/8b8a42e56071/Inception-720p-BluRay-akoam-net-mkv',
              'https://akwam.ss/old/download/24b6c7c86025/Fight-Club-1999-1080p-BluRay-akoam-net-mkv'
            ];
            for (const url of urls) {
              for (const method of ['POST']) {
                const response = await fetch(url, {
                  method,
                  headers: {
                    'User-Agent': 'Movyz-Diagnostics/1.0',
                    'Accept': 'application/json, text/plain, */*',
                    'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                    'X-Requested-With': 'XMLHttpRequest',
                    'Referer': url,
                  },
                  body: '',
                });
                const text = await response.text();
                console.log('RESULT', JSON.stringify({
                  url, method, status: response.status,
                  contentType: response.headers.get('content-type'),
                  body: text.slice(0, 12000),
                }, null, 2));
              }
            }
          })();
          "
