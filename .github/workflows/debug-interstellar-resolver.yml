name: Movyz Akwam direct-link universal diagnostic

on:
  push:
    paths:
      - ".github/workflows/debug-interstellar-resolver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Inspect direct link and universal resolver
        run: |
          npx tsx -e "
          (async () => {
            const { resolveUniversalSource } = await import('./server/providers/universal-resolver');
            const { inferPlaybackType } = await import('./server/providers/http');
            const { fetchWithTimeout } = await import('./server/providers/http');
            const target='https://akwam.ss/old/download/8b8a42e56071/Inception-720p-BluRay-akoam-net-mkv';
            const response=await fetchWithTimeout(target,{
              method:'POST',
              timeoutMs:10000,
              headers:{
                Accept:'application/json, text/plain, */*',
                'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8',
                'User-Agent':'Movyza/1.0',
                'X-Requested-With':'XMLHttpRequest',
                Referer:'https://akwam.ss/old/54108/فيلم-Inception-2010-مترجم',
              },
              body:''
            });
            const body=await response.text();
            let parsed={};
            try{parsed=JSON.parse(body)}catch{}
            const raw=String(parsed.direct_link||'');
            const httpsRaw=raw.replace(/^http:\/\//i,'https://');
            const universal=httpsRaw?await resolveUniversalSource(httpsRaw,{timeoutMs:10000,maxDepth:2,maxHtmlBytes:1000000}):null;
            console.log(JSON.stringify({
              status:response.status,
              contentType:response.headers.get('content-type'),
              rawDirectLink:raw,
              httpsDirectLink:httpsRaw,
              inferredType:httpsRaw?inferPlaybackType(httpsRaw):null,
              universal
            },null,2));
          })();
          "
