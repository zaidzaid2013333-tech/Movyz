name: Movyz Akwam movie download trace

on:
  push:
    paths:
      - ".github/workflows/debug-interstellar-resolver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Trace Inception movie download resolution
        run: |
          npx tsx -e "
          (async () => {
            const { debugAkwamMovie } = await import('./server/providers/arprov-akwam');
            const trace = await debugAkwamMovie({
              tmdbId:27205,
              title:'Inception',
              originalTitle:'Inception',
              releaseYear:2010,
            }, { tmdbApiToken:process.env.TMDB_API_READ_ACCESS_TOKEN });
            console.log(JSON.stringify(trace,null,2));
          })();
          "

