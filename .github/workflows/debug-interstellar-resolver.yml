name: Movyz Akwam session fix diagnostic

on:
  push:
    paths:
      - ".github/workflows/debug-interstellar-resolver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Resolve Inception after session-cookie fix
        run: |
          npx tsx -e "
          (async () => {
            const { resolveAkwamPlayback } = await import('./server/providers/arprov-akwam');
            const result = await resolveAkwamPlayback({
              tmdbId: 27205,
              title: 'Inception',
              originalTitle: 'Inception',
              releaseYear: 2010,
            }, {});
            console.log(JSON.stringify({count: result.length, sources: result}, null, 2));
          })();
          "
