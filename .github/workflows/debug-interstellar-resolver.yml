name: Movyz Akwam watching-link diagnostic

on:
  push:
    paths:
      - ".github/workflows/debug-interstellar-resolver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Inspect legacy watching variables
        run: |
          npx tsx -e "
          (async () => {
            const url = 'https://akwam.ss/old/download/8b8a42e56071/Inception-720p-BluRay-akoam-net-mkv';
            const response = await fetch(url, { headers: { 'User-Agent': 'Movyz-Diagnostics/1.0', 'Accept': 'text/html' } });
            const html = await response.text();
            const needles = ['hash_data','watch_title','watch_label','downloadalt','watching/','btn-loader'];
            for (const needle of needles) {
              const index = html.toLowerCase().indexOf(needle.toLowerCase());
              console.log('NEEDLE', needle, 'INDEX', index);
              if (index >= 0) console.log(html.slice(Math.max(0,index-1800), Math.min(html.length,index+3500)));
            }
          })();
          "
