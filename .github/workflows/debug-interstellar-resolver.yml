name: Movyz Akwam old-page parser diagnostic

on:
  push:
    paths:
      - ".github/workflows/debug-interstellar-resolver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Inspect legacy movie page anchors
        run: |
          npx tsx -e "
          (async () => {
            const urls = [
              'https://akwam.ss/old/54108/%D9%81%D9%8A%D9%84%D9%85-Inception-2010-%D9%85%D8%AA%D8%B1%D8%AC%D9%85',
              'https://akwam.ss/old/57273/%D9%81%D9%8A%D9%84%D9%85-Fight-Club-1999-%D9%85%D8%AA%D8%B1%D8%AC%D9%85'
            ];
            for (const url of urls) {
              const response = await fetch(url, { headers: { 'User-Agent': 'Movyz-Diagnostics/1.0', 'Accept': 'text/html' } });
              const html = await response.text();
              console.log('PAGE', url, 'STATUS', response.status, 'BYTES', html.length);
              const matches = [...html.matchAll(/<a\b[^>]*href=[\"']([^\"']+)[\"'][^>]*>([\\s\\S]*?)<\\/a>/gi)];
              const interesting = matches
                .map(m => ({ href: m[1], html: m[0].slice(0, 800) }))
                .filter(x => /(تحميل|download|link|مشاهدة|watch|جودة|quality)/i.test(x.href + ' ' + x.html))
                .slice(0, 80);
              console.log(JSON.stringify({interesting}, null, 2));
              const media = [...html.matchAll(/<(?:video|source|iframe|embed)\b[^>]*(?:src|data-src)=[\"']([^\"']+)[\"'][^>]*>/gi)]
                .map(m => ({url: m[1], tag: m[0].slice(0, 500)}))
                .slice(0, 40);
              console.log('MEDIA', JSON.stringify(media, null, 2));
            }
          })();
          "
