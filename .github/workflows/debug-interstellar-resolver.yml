name: Movyz Interstellar resolver diagnostic

on:
  push:
    paths:
      - ".github/workflows/debug-interstellar-resolver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Resolve Interstellar without persisting
        run: |
          npx tsx -e "
          import { resolveAkwamPlayback } from './server/providers/arprov-akwam';
          const context = {
            tmdbId: 157336,
            title: 'Interstellar',
            originalTitle: 'Interstellar',
            releaseYear: 2014,
          };
          const started = Date.now();
          const sources = await resolveAkwamPlayback(context, {
            tmdbApiToken: process.env.TMDB_API_READ_ACCESS_TOKEN,
          });
          console.log(JSON.stringify({
            elapsedMs: Date.now() - started,
            count: sources.length,
            sources,
          }, null, 2));
          "
