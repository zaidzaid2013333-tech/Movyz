name: Movyz Akwam download-page diagnostic

on:
  push:
    paths:
      - ".github/workflows/debug-interstellar-resolver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Inspect Akwam download pages
        run: |
          npx tsx -e "
          (async () => {
            const urls = [
              'https://akwam.ss/old/download/8b8a42e56071/Inception-720p-BluRay-akoam-net-mkv',
              'https://akwam.ss/old/download/24b6c7c86025/Fight-Club-1999-1080p-BluRay-akoam-net-mkv'
            ];
            for (const url of urls) {
              const response = await fetch(url, { headers: { 'User-Agent': 'Movyz-Diagnostics/1.0', 'Accept': 'text/html' } });
              const html = await response.text();
              console.log('PAGE', url, 'STATUS', response.status, 'FINAL', response.url, 'BYTES', html.length);
              const anchors = [...html.matchAll(/<a\b[^>]*href=[\"']([^\"']+)[\"'][^>]*>([\\s\\S]*?)<\\/a>/gi)]
                .map(m => ({href:m[1], html:m[0].slice(0,1200)}))
                .filter(x => /(?:download|btn-loader|تحميل|mp4|mkv|downet|stream|watch)/i.test(x.href + ' ' + x.html))
                .slice(0,120);
              console.log(JSON.stringify({anchors}, null, 2));
              const scripts = [...html.matchAll(/<(?:script|input|video|source)\b[^>]*(?:src|value|data-src|href)=[\"']([^\"']+)[\"'][^>]*>/gi)]
                .map(m => m[1]).filter(v=>/(?:mp4|mkv|downet|stream|download|file|source)/i.test(v)).slice(0,120);
              console.log('VALUES', JSON.stringify(scripts, null, 2));
            }
          })();
          "
