name: Movyza CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: movyza-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: movyz-dist
          path: dist

  deploy-cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: movyz-dist
          path: dist
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Smoke test production
        run: curl -fsSL https://movyz-api.sameranede.workers.dev/ar/ -o /dev/null
