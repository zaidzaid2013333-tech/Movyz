name: Movyza CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: movyza-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build