name: Movyz CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: movyz-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm resilience
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate Movyz TypeScript
        run: npm run lint
      - name: Run core smoke test
        run: npm test

      - name: Start TMDB Embed API 1.3.0
        run: |
          docker pull inside4ndroid/tmdb-embed-api:1.3.0
          docker run -d --name tmdb-embed-smoke -p 8787:8787 \
            -e API_PORT=8787 -e BIND_HOST=0.0.0.0 -e DEFAULT_PROVIDERS=vidlink \
            inside4ndroid/tmdb-embed-api:1.3.0

      - name: Wait for TMDB Embed health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs tmdb-embed-smoke || true
          exit 1

      - name: Smoke Fight Club through Movyz adapter
        run: |
          npx tsx <<'EOF'
          import { resolveTmdbEmbed } from "./providers/tmdb-embed.ts";
          const sources = await resolveTmdbEmbed({ contentType: "movie", tmdbId: 550 });
          if (!sources.length) throw new Error("No Fight Club sources");
          for (const s of sources) {
            console.log(JSON.stringify({
              provider: s.provider,
              providerKey: s.providerKey,
              quality: s.quality ?? null,
              type: s.type,
              host: new URL(s.url).hostname
            }));
          }
          if (!/^https:\/\//i.test(sources[0].url)) throw new Error("Non-HTTPS source");
          console.log("TMDB_EMBED_FIGHT_CLUB_OK", sources.length);
          EOF

      - name: Cleanup TMDB Embed container
        if: always()
        run: docker rm -f tmdb-embed-smoke || true

      - name: Build frontend
        run: npm run build
      - name: Build CinePro Core
        working-directory: cinepro-core
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build
