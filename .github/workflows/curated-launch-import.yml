name: Movyz curated launch catalog import

on:
  push:
    branches: ["ui/watch-player-responsive-20261005"]
    paths:
      - "server/tmdb.ts"
      - "server/curatedCatalog.ts"
      - "scripts/import-curated-catalog.ts"
      - ".github/workflows/curated-launch-import.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: movyz-curated-launch-import
  cancel-in-progress: false

jobs:
  import-curated:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - media: movie
            batch: 0
            size: 36
          - media: movie
            batch: 1
            size: 36
          - media: movie
            batch: 2
            size: 36
          - media: series
            batch: 0
            size: 20
          - media: series
            batch: 1
            size: 20
          - media: series
            batch: 2
            size: 20
          - media: series
            batch: 3
            size: 20
          - media: series
            batch: 4
            size: 20
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      TMDB_REQUEST_TIMEOUT_MS: "15000"
      CURATED_MEDIA_TYPE: ${{ matrix.media }}
      CURATED_BATCH: ${{ matrix.batch }}
      CURATED_BATCH_SIZE: ${{ matrix.size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure npm resilience
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate Movyz TypeScript
        run: npx tsc --noEmit
      - name: Import curated batch
        run: npx tsx scripts/import-curated-catalog.ts
