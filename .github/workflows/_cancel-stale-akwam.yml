name: Cancel stale Akwam robot run

on:
  push:
    branches: ["main"]

permissions:
  actions: write
  contents: read

concurrency:
  group: movyz-stale-akwam-cancellation-carrier
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-slim
    steps:
      - name: Cancel Run #55 directly
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "37141503367"
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/zaidzaid2013333-tech/Movyz/actions/runs/$RUN_ID/cancel"
          echo "Cancellation requested for Run #55."
