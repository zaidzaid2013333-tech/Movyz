name: Movyz Curated Content Seed + Playback Verification

on:
  push:
    branches:
      - ops/seed-curated-playback-verification

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYBACK_BASE_URL: https://movyz-api.sameranede.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect Breaking Bad OmegaTech payload
        run: |
          node --input-type=module - <<'NODE'
          const base='https://api.omegatech.app';
          const searchUrl=new URL('/api/movie/Akwam',base);
          searchUrl.searchParams.set('action','search');
          searchUrl.searchParams.set('query','Breaking Bad');
          const search=await fetch(searchUrl);
          const searchBody=await search.text();
          console.log('SEARCH', search.status, searchBody.slice(0,12000));
          const parsed=JSON.parse(searchBody);
          const results=parsed?.data?.results || [];
          for (const item of results.slice(0,5)) {
            const u=new URL('/api/movie/Akwam',base);
            u.searchParams.set('action','content');
            u.searchParams.set('url',item.url);
            const r=await fetch(u);
            const b=await r.text();
            console.log('CONTENT', item.title, item.url, r.status, b.slice(0,16000));
          }
          const prod=[
            'https://movyz-api.sameranede.workers.dev/api/v1/playback/resolve?type=series&tmdbId=1396&season=1&episode=1',
            'https://movyz-api.sameranede.workers.dev/api/v1/playback/resolve?type=series&tmdbId=1396&season=5&episode=16'
          ];
          for(const url of prod){
            const r=await fetch(url);
            console.log('PROD', url, r.status, (await r.text()).slice(0,5000));
          }
          NODE
