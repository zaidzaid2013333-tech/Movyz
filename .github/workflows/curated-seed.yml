name: Inspect OmegaTech episode resolution
on:
  push:
    branches: [ops/seed-curated-playback-verification]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Direct episode flow
        run: |
          node --input-type=module - <<'NODE'
          const base='https://api.omegatech.app';
          async function call(params){
            const u=new URL('/api/movie/Akwam',base);
            for(const [k,v] of Object.entries(params)) u.searchParams.set(k,v);
            const r=await fetch(u);
            const b=await r.text();
            console.log('\nREQ',u.toString(),'STATUS',r.status,'BODY',b.slice(0,10000));
            try{return JSON.parse(b)}catch{return null}
          }
          const c=await call({action:'content',url:'https://akwam.ss/series/59/breaking-bad-الموسم-الاول'});
          const eps=c?.data?.episodes||c?.episodes||[];
          const ep=eps.find(e=>Number(e?.number)===1);
          console.log('EP_PICK',JSON.stringify(ep));
          const e=await call({action:'episode',episode:ep?.url||''});
          const downloads=[];
          const visit=(v,d=0)=>{if(d>8||v==null)return;if(typeof v==='string'){if(v.startsWith('http'))downloads.push(v);return}if(Array.isArray(v)){v.forEach(x=>visit(x,d+1));return}if(typeof v==='object')Object.values(v).forEach(x=>visit(x,d+1))};
          visit(e);
          console.log('URLS',JSON.stringify([...new Set(downloads)].slice(0,30)));
          for(const u of [...new Set(downloads)].filter(x=>x.includes('/download/')).slice(0,5)){
            await call({action:'resolve',download:u});
          }
          NODE
