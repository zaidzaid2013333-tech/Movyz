name: Debug Movyz resolver in Node
on:
  push:
    branches: [ops/seed-curated-playback-verification]
permissions: {contents: read}
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Call resolver directly
        run: |
          npx tsx -e "import { resolveRemotePlayback } from './server/providers/remote-resolver.ts'; for (const x of [{type:'series',tmdbId:1396,season:1,episode:1},{type:'series',tmdbId:1396,season:5,episode:16}]) { try { const s=await resolveRemotePlayback(x); console.log(JSON.stringify({x,count:s.length,sources:s},null,2)); } catch(e) { console.error(JSON.stringify({x,error:e instanceof Error?e.stack:String(e)},null,2)); process.exitCode=1; } }"
