name: Movyz Curated Content Seed + Playback Verification

on:
  push:
    branches:
      - ops/seed-curated-playback-verification

permissions:
  contents: read

concurrency:
  group: movyz-curated-probe
  cancel-in-progress: false

jobs:
  seed-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      PLAYBACK_BASE_URL: https://movyz-api.sameranede.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe live gateways
        run: |
          node --input-type=module - <<'NODE'
          const bases = ['https://api.omegatech.app','https://omegatech-api.dixonomega.tech'];
          for (const base of bases) {
            for (const params of [
              {action:'search',query:'Inception'},
              {action:'search',query:'Breaking Bad'},
              {action:'content',url:'https://akwam.ss/movie/562/inception-1'}
            ]) {
              const u = new URL('/api/movie/Akwam', base);
              for (const [k,v] of Object.entries(params)) u.searchParams.set(k,v);
              try {
                const r = await fetch(u);
                const b = await r.text();
                console.log(JSON.stringify({base,status:r.status,url:u.toString(),body:b.slice(0,6000)}));
              } catch (e) {
                console.log(JSON.stringify({base,url:u.toString(),error:String(e)}));
              }
            }
          }
          const production = [
            'https://movyz-api.sameranede.workers.dev/api/v1/diagnostics/playback',
            'https://movyz-api.sameranede.workers.dev/api/v1/playback/resolve?type=movie&tmdbId=27205',
            'https://movyz-api.sameranede.workers.dev/api/v1/playback/resolve?type=series&tmdbId=1396&season=1&episode=1'
          ];
          for (const url of production) {
            try {
              const r = await fetch(url);
              console.log(JSON.stringify({url,status:r.status,body:(await r.text()).slice(0,4000)}));
            } catch (e) {
              console.log(JSON.stringify({url,error:String(e)}));
            }
          }
          NODE

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate code
        run: npm run lint

      - name: Seed and verify
        run: npx tsx scripts/seed-curated-content.ts
