name: Movyz full episode source prewarm
# Resumable sweep: stale UUID state is validated by rebind-selected-playback.ts

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: movyz-full-episode-source-prewarm
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      REBIND_MODE: episodes
      REBIND_PROVIDER: primary
      REBIND_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.episode_limit || '1500' }}
      REBIND_CONCURRENCY: "16"
      RE3ARABI_TIMEOUT_MS: "12000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Rebuild the next complete episode-source batch
        run: npx tsx scripts/rebind-selected-playback.ts

      - name: Verify catalog integrity
        run: npx tsx scripts/verify-tmdb-sync.ts

      - name: Check remaining episode source work
        id: remaining
        run: |
          remaining=$(npx tsx scripts/episode-rebind-status.ts)
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"

      - name: Queue the next episode batch
        if: steps.remaining.outputs.remaining != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run full-episode-source-prewarm.yml --ref main -f episode_limit=1000
