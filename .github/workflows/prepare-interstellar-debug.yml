name: Movyz Interstellar playback preparation debug

on:
  push:
    paths:
      - ".github/workflows/prepare-interstellar-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      PREPARE_MODE: "movies"
      PREPARE_ONLY_MISSING: "true"
      PREPARE_OFFSET: "147"
      PREPARE_LIMIT: "1"
      PREPARE_CONCURRENCY: "1"
      PREPARE_SHARD_INDEX: "0"
      PREPARE_SHARD_COUNT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Prepare Interstellar source
        run: npx tsx scripts/prepare-arprov-sources.ts
