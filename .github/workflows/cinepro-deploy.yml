name: Movyz CinePro Core Deploy

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cinepro-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-cinepro-core
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDB_API_READ_ACCESS_TOKEN }}
      CINEPRO_URL: https://movyz-cinepro.sameranede.workers.dev

    steps:
      - name: Clone official CinePro Core
        run: git clone --depth 1 https://github.com/cinepro-org/core.git cinepro-core

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cinepro-core/package-lock.json

      - name: Install CinePro Core
        working-directory: cinepro-core
        run: npm install --no-audit --no-fund

      - name: Build CinePro Core
        working-directory: cinepro-core
        run: npm run build

      - name: Validate official CinePro configuration
        working-directory: cinepro-core
        run: |
          test -f wrangler.json
          test -f dist/server.js
          node -e "const c=require('./wrangler.json'); if(c.main!=='dist/server.js') process.exit(1); console.log('CinePro official wrangler main =', c.main)"

      - name: Prepare CinePro Core secrets
        working-directory: cinepro-core
        run: |
          umask 077
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > .cinepro-secrets

      - name: Dry-run official CinePro deployment
        working-directory: cinepro-core
        run: npx wrangler deploy --dry-run --config wrangler.json --name movyz-cinepro

      - name: Deploy official CinePro Core
        working-directory: cinepro-core
        run: |
          npx wrangler deploy             --config wrangler.json             --name movyz-cinepro             --secrets-file .cinepro-secrets             --var PUBLIC_URL:$CINEPRO_URL

      - name: Smoke test official CinePro Core
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from urllib.error import HTTPError

          base = "https://movyz-cinepro.sameranede.workers.dev"

          checks = [
              ("/v1/health", "health"),
              ("/v1/movies/27205", "Inception"),
              ("/v1/movies/550", "Fight Club"),
              ("/v1/movies/278", "The Shawshank Redemption"),
              ("/v1/tv/1399/seasons/1/episodes/1", "Breaking Bad S01E01"),
          ]

          for path, label in checks:
              req = urllib.request.Request(
                  base + path,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "Movyz-CinePro-Core-CI/1.0",
                      "Cache-Control": "no-cache",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      payload = json.load(response)
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"{label}: HTTP {exc.code}: {body[:4000]}") from exc

              if label == "health":
                  if response.status != 200 or payload.get("status") not in ("ok", "operational"):
                      raise SystemExit(f"health failed: {payload}")
                  print("CinePro Core health OK")
                  continue

              sources = payload.get("sources") if isinstance(payload, dict) else None
              if not isinstance(sources, list) or not sources:
                  raise SystemExit(f"{label}: no CinePro Core sources")
              valid = [x for x in sources if isinstance(x, dict) and str(x.get("url") or "").startswith("https://")]
              if not valid:
                  raise SystemExit(f"{label}: no usable HTTPS source")
              print(f"CinePro Core OK: {label} sources={len(valid)}")

          print("Official CinePro Core deployment: ALL SMOKE TESTS PASSED")
          PY

      - name: Remove temporary secret file
        if: always()
        working-directory: cinepro-core
        run: rm -f .cinepro-secrets
