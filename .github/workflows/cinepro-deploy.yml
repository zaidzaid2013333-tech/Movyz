name: Movyz CinePro Core Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "cinepro-worker/**"
      - ".github/workflows/cinepro-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-cinepro-core
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDB_API_READ_ACCESS_TOKEN }}
      CINEPRO_URL: https://movyz-cinepro.sameranede.workers.dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloudflare adapter dependencies
        working-directory: cinepro-worker
        run: npm install --no-audit --no-fund

      - name: Clone official CinePro Core
        working-directory: cinepro-worker
        run: |
          rm -rf core
          git clone --depth 1 https://github.com/cinepro-org/core.git core

      - name: Install official CinePro Core dependencies
        working-directory: cinepro-worker/core
        run: npm install --no-audit --no-fund

      - name: Generate provider registry from CinePro Core
        working-directory: cinepro-worker
        run: node generate-core-providers.mjs

      - name: Validate CinePro Cloudflare adapter
        working-directory: cinepro-worker
        run: npx wrangler deploy --dry-run

      - name: Validate Wrangler bundle
        working-directory: cinepro-worker
        run: npx wrangler deploy --dry-run

      - name: Validate CinePro TMDB API key
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          key = os.environ.get("TMDB_API_KEY", "").strip()
          if not key:
              raise SystemExit("TMDB_API_KEY secret is empty")
          url = "https://api.themoviedb.org/3/movie/27205?api_key=" + urllib.parse.quote(key)
          req = urllib.request.Request(url, headers={
              "Accept": "application/json",
              "User-Agent": "Movyz-CinePro-TMDB-Check/1.0",
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
                  print("TMDB API key HTTP =", response.status, "title =", payload.get("title"))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"TMDB API key rejected: HTTP {exc.code}: {body[:500]}") from exc
          PY

      - name: Prepare CinePro secrets
        working-directory: cinepro-worker
        run: |
          umask 077
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > .cinepro-secrets

      - name: Deploy CinePro backend
        working-directory: cinepro-worker
        run: |
          npx wrangler deploy             --secrets-file .cinepro-secrets             --var PUBLIC_URL:$CINEPRO_URL

      - name: Smoke test CinePro Core
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from urllib.error import HTTPError

          base = "https://movyz-cinepro.sameranede.workers.dev"
          checks = [
              ("/v1/health", "health"),
              ("/v1/movies/27205", "Inception"),
              ("/v1/movies/550", "Fight Club"),
              ("/v1/movies/278", "The Shawshank Redemption"),
              ("/v1/tv/1399/seasons/1/episodes/1", "Breaking Bad S01E01"),
          ]

          for path, label in checks:
              req = urllib.request.Request(
                  base + path,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "Movyz-CinePro-Core-CI/1.0",
                      "Cache-Control": "no-cache",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      payload = json.load(response)
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"{label}: HTTP {exc.code}: {body[:4000]}") from exc

              if label == "health":
                  if response.status != 200 or payload.get("status") not in ("ok", "operational"):
                      raise SystemExit(f"health failed: {payload}")
                  print("CinePro health OK")
                  continue

              sources = payload.get("sources") if isinstance(payload, dict) else None
              valid = [x for x in sources or [] if isinstance(x, dict) and str(x.get("url") or "").startswith("https://")]
              if not valid:
                  raise SystemExit(f"{label}: no usable CinePro sources")
              print(f"CinePro OK: {label} sources={len(valid)}")

          print("CinePro Core backend smoke: ALL OK")
          PY

      - name: Remove temporary secret file
        if: always()
        working-directory: cinepro-worker
        run: rm -f .cinepro-secrets
