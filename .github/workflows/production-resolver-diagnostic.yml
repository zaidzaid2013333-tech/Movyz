name: Diagnose production resolver

on:
  push:
    branches: ["ops/diagnose-production-resolver"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production resolver
        run: |
          node <<'NODE'
          const base = 'https://movyz-api.sameranede.workers.dev';

          const checks = [
            '/api/v1/diagnostics/playback',
            '/api/v1/playback/resolve?type=movie&tmdbId=27205',
            '/api/v1/playback/resolve?type=series&tmdbId=1396&season=1&episode=1',
            '/api/v1/playback/resolve?type=series&tmdbId=1396&season=2&episode=1',
            '/api/v1/playback/resolve?type=series&tmdbId=1396&season=5&episode=1',
          ];

          for (const path of checks) {
            const response = await fetch(base + path, {
              headers: { Accept: 'application/json', 'User-Agent': 'Movyz-Diagnostic/1.0' },
              signal: AbortSignal.timeout(60000),
            });
            const body = await response.text();
            console.log('\nPATH', path);
            console.log('HTTP', response.status);
            console.log(body.slice(0, 16000));
          }
          NODE

# rerun after upstream-host diagnostics

# rerun after error aggregation
