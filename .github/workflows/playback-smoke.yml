name: Playback Smoke Test

on:
  push:
    paths:
      - ".github/workflows/playback-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        run: |
          set -e
          curl -fsS --retry 2 --max-time 20 https://movyz-api.sameranede.workers.dev/health
          echo

      - name: Resolve one movie from API
        run: |
          set -e
          MOVIE_ID=$(curl -fsS --retry 2 --max-time 20 "https://movyz-api.sameranede.workers.dev/api/v1/movies?page=1&limit=1"             | python -c "import json,sys; d=json.load(sys.stdin); print(d['data'][0]['id'])")
          echo "MOVIE_ID=$MOVIE_ID"
          RESPONSE=$(curl -fsS --retry 2 --max-time 30 "https://movyz-api.sameranede.workers.dev/api/v1/watch/$MOVIE_ID")
          echo "$RESPONSE" > response.json
          python - <<'PY'
          import json
          d=json.load(open("response.json"))
          sources=d.get("data",{}).get("sources",[])
          print("SOURCE_COUNT=", len(sources))
          for s in sources:
              print(s.get("provider"), s.get("type"), s.get("quality"), s.get("url"))
          raise SystemExit(0 if sources else 1)
          PY

      - name: Check FaselHD directly
        run: |
          set -e
          curl -fsS --retry 2 --max-time 30 "https://faselhdapi.onrender.com/discover/movies?page=1&pageSize=1"             -o fasel.json
          python - <<'PY'
          import json
          d=json.load(open("fasel.json"))
          print("FaselHD discover response received:", type(d).__name__)
          print(str(d)[:1000])
          PY
