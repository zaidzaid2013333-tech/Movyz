name: Movyz Watch API Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "moviebox-worker/**"
      - ".github/workflows/watch-api-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-watch-api-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Watch Worker
        continue-on-error: true
        run: |
          node --check moviebox-worker/src/index.js

      - name: Capture Watch Worker syntax output
        if: always()
        run: |
          node --check moviebox-worker/src/index.js > watch-syntax.log 2>&1 || true

      - name: Upload Watch Worker syntax output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-worker-syntax
          path: watch-syntax.log

      - name: Install Watch API dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Cloudflare dry run
        run: npx --yes wrangler@4 deploy --config moviebox-worker/wrangler.toml --dry-run

      - name: Deploy Watch API
        run: npx --yes wrangler@4 deploy --config moviebox-worker/wrangler.toml

      - name: Smoke test
        run: |
          node .github/scripts/verify-abdobest-playback.mjs
