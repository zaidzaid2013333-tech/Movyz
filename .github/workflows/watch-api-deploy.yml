name: Movyz Watch API Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "moviebox-worker/**"
      - ".github/workflows/watch-api-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-watch-api-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Watch Worker
        run: |
          node --check moviebox-worker/src/index.js

      - name: Cloudflare dry run
        run: npx --yes wrangler@4 deploy --config moviebox-worker/wrangler.toml --dry-run

      - name: Deploy Watch API
        run: npx --yes wrangler@4 deploy --config moviebox-worker/wrangler.toml

      - name: Smoke test
        run: |
          node <<'NODE'
          const base = 'https://movyz-moviebox.sameranede.workers.dev';

          async function check(path) {
            const response = await fetch(base + path, {
              headers: { Accept: 'application/json' },
              redirect: 'follow',
              signal: AbortSignal.timeout(30000),
            });
            const body = await response.text();
            console.log(path, response.status, body.slice(0, 1500));
            return { response, body };
          }

          const root = await check('/');
          if (!root.response.ok) throw new Error('Watch API root failed');

          const meta = JSON.parse(root.body);
          if (meta?.api !== 'Movyz Watch API') {
            throw new Error('Unexpected Watch API identity');
          }

          const health = await check('/health');
          if (!health.response.ok) {
            throw new Error('Watch API health failed');
          }

          const playbackResponse = await fetch(base + '/watch/movie', {
            method: 'POST',
            headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ tmdb_id: 278, title: 'The Shawshank Redemption', year: 1994 }),
            redirect: 'follow',
            signal: AbortSignal.timeout(120000),
          });
          const playbackBody = await playbackResponse.text();
          console.log('/watch/movie', playbackResponse.status, playbackBody.slice(0, 5000));
          if (!playbackResponse.ok) throw new Error('Watch API movie playback failed');
          const playback = JSON.parse(playbackBody);
          const streamUrl = playback?.stream?.url || playback?.stream?.sources?.[0]?.url;
          if (!playback?.ok || !streamUrl) throw new Error('Watch API returned no playable stream URL');
          console.log('WATCH_API_PLAYBACK=PASS', JSON.stringify({
            type: playback?.stream?.type,
            urlScheme: String(streamUrl).split(':')[0],
            host: (() => { try { return new URL(streamUrl).host; } catch { return ''; } })(),
          }));

          console.log('WATCH_API_DEPLOY=PASS');
          NODE
