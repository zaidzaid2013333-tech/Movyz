name: Inventory Cloudflare Cron Workers

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cf-cron-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List Workers with Cron triggers
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer \$CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/\$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            > /tmp/cf-workers.json
          echo "=== Workers with schedules ==="
          jq -r '.result[] | select((.schedules // []) | length > 0) | "\(.id) => \([.schedules[].cron] | join(","))"' /tmp/cf-workers.json
