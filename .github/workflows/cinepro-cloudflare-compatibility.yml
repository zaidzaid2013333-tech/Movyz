name: CinePro Cloudflare Compatibility

on:
  push:
    branches: ["main"]
    paths:
      - "cinepro-compatibility.txt"
      - ".github/workflows/cinepro-cloudflare-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: cinepro-org/core
          path: .cinepro
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .cinepro/package-lock.json

      - name: Install CinePro
        working-directory: .cinepro
        run: npm ci --no-audit --no-fund

      - name: Build CinePro
        working-directory: .cinepro
        run: npm run build

      - name: Wrangler dry run
        working-directory: .cinepro
        run: npx wrangler deploy --dry-run --outdir .worker-build
