name: Akwam Player Probe

on:
  push:
    branches:
      - "debug/akwam-player-only"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Akwam page
        run: |
          python - <<'PY'
          import re
          import urllib.request

          url = "https://akwam.ss/movie/562/inception-1"
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml",
              },
          )

          with urllib.request.urlopen(request, timeout=45) as response:
              html = response.read().decode("utf-8", "replace")
              print("STATUS:", response.status)
              print("CONTENT_TYPE:", response.headers.get("content-type"))
              print("BYTES:", len(html))

          iframe_re = re.compile(r"""<(?:iframe|embed|frame)[^>]+(?:src|data-src|data-url|data-embed|data-player)=[\"'][^\"']+[\"']""", re.I)
          iframe_matches = iframe_re.findall(html)
          print("IFRAME_TAGS:", len(iframe_matches))
          for item in iframe_matches[:10]:
              print("IFRAME:", item[:1200])

          patterns = [
              "iframe", "player", "jwplayer", "videojs", "video",
              "source", "m3u8", "mp4", "embed", "stream", "file",
              "data-player", "data-src", "data-url"
          ]

          for pattern in patterns:
              hits = [m.start() for m in re.finditer(re.escape(pattern), html, re.I)]
              print(f"PATTERN {pattern}: {len(hits)}")
              for pos in hits[:3]:
                  start = max(0, pos - 220)
                  end = min(len(html), pos + 750)
                  snippet = re.sub(r"\s+", " ", html[start:end])
                  print("  ", snippet[:950])
          PY
