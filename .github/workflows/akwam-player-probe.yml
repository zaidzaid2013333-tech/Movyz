name: Akwam Player Probe

on:
  push:
    branches:
      - "debug/akwam-player-only"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Akwam page
        run: |
          python - <<'PY'
          import re
          import urllib.request

          url = "https://akwam.ss/movie/562/inception-1"
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml",
              },
          )

          with urllib.request.urlopen(request, timeout=45) as response:
              html = response.read().decode("utf-8", "replace")
              print("MOVIE_STATUS:", response.status)
              print("MOVIE_BYTES:", len(html))

          def clean(value):
              return re.sub(r"\\s+", " ", value).strip()

          watch_urls = re.findall(r"""https://akwam\\.ss/watch/[^\\s"<>]+""", html, re.I)
          watch_urls = list(dict.fromkeys(watch_urls))
          print("WATCH_URLS:", len(watch_urls))
          for value in watch_urls[:10]:
              print(" WATCH:", value)

          for watch_url in watch_urls[:3]:
              try:
                  watch_request = urllib.request.Request(
                      watch_url,
                      headers={
                          "User-Agent": "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36",
                          "Accept": "text/html,application/xhtml+xml",
                          "Referer": url,
                      },
                  )
                  with urllib.request.urlopen(watch_request, timeout=45) as response:
                      watch_html = response.read().decode("utf-8", "replace")
                      print("\nWATCH_PAGE:", watch_url)
                      print(" WATCH_STATUS:", response.status)
                      print(" WATCH_TYPE:", response.headers.get("content-type"))
                      print(" WATCH_BYTES:", len(watch_html))
                      print(" WATCH_XFO:", response.headers.get("x-frame-options"))
                      print(" WATCH_CSP:", response.headers.get("content-security-policy"))

                      for marker in ["<iframe", "<embed", "<video", "<source", "m3u8", ".mp4", "player", "jwplayer", "videojs", "stream"]:
                          print(f" WATCH_PATTERN {marker}: {len(re.findall(re.escape(marker), watch_html, re.I))}")

                      print(" WATCH_SCRIPT_SRC:")
                      for src in re.findall(r"""<script[^>]+src=["'][^"']+["']""", watch_html, re.I):
                          print("  ", clean(src)[:1200])

                      print(" WATCH_PLAYER_CONTEXT:")
                      for marker in ["<iframe", "<video", "player", "m3u8", ".mp4", "stream"]:
                          pos = watch_html.lower().find(marker.lower())
                          if pos >= 0:
                              print("  ", marker, clean(watch_html[max(0,pos-500):pos+1800])[:2200])
              except Exception as error:
                  print(" WATCH_ERROR:", watch_url, error)
          PY
