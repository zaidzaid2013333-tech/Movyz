name: Akwam Player Probe

on:
  push:
    branches:
      - "debug/akwam-player-only"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Akwam page
        run: |
          python - <<'PY'
          import re
          import urllib.request

          url = "https://akwam.ss/movie/562/inception-1"
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml",
              },
          )

          with urllib.request.urlopen(request, timeout=45) as response:
              html = response.read().decode("utf-8", "replace")
              print("STATUS:", response.status)
              print("CONTENT_TYPE:", response.headers.get("content-type"))
              print("BYTES:", len(html))

          def clean(value):
              return re.sub(r"\\s+", " ", value).strip()

          print("SCRIPT_SRC:")
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, re.I):
              print(" ", src)

          print("LINK_HREFS:")
          for href in re.findall(r'<a[^>]+href=["\']([^"\']+)["\']', html, re.I):
              if re.search(r'watch|view|play|download|episode|quality|movie|file|stream', href, re.I):
                  print(" ", href)

          print("PLAYER_LIKE_TAGS:")
          for tag in re.findall(r'<[^>]+>', html, re.I):
              if re.search(r'(?:id|class)=["\'][^"\']*(?:player|watch|video|media|quality|stream|download)[^"\']*["\']', tag, re.I):
                  print(" ", clean(tag)[:1200])

          print("INLINE_URLS:")
          for url_value in re.findall(r'https?://[^\s"\'<>]+|/(?:api|ajax|assets|player|watch|view|stream|video|download)/[^\s"\'<>]+', html, re.I):
              print(" ", url_value[:1000])

          for label, pattern in [
              ("PAGE_ID", r'id=["\']page_id["\'][^>]*value=["\']([^"\']+)'),
              ("PAGE_APP", r'id=["\']page_app["\'][^>]*value=["\']([^"\']+)'),
              ("AJAX", r'(?:\\$\\.ajax|\\$\\.get|\\$\\.post|fetch\\(|axios\\.)'),
              ("API_TEXT", r'/(?:api|ajax)/[^"\'\\s<]+'),
              ("WATCH_TEXT", r'/(?:watch|view|player|stream|video)/[^"\'\\s<]+'),
          ]:
              matches = re.findall(pattern, html, re.I)
              print(f"{label}: {len(matches)}")
              for value in matches[:20]:
                  print("  ", clean(value)[:1200])

          pos = html.lower().find('id="page_id"')
          if pos >= 0:
              print("PAGE_CONTEXT:")
              print(clean(html[max(0,pos-2500):pos+5000])[:7500])
          PY
