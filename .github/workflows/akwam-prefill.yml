name: Movyz Akwam Smoke

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/prefill-akwam.ts"
      - ".github/workflows/akwam-prefill.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Smoke mode only"
        required: true
        default: "smoke"
        type: choice
        options: ["smoke"]
      tmdb_id:
        description: "Movie TMDB ID for the smoke test"
        required: true
        default: "27205"
        type: string

permissions:
  contents: read

concurrency:
  group: movyz-akwam-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CINEPRO_BASE_URL: "https://cinepro-core-production-8b58.up.railway.app"
      PREFILL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}
      TARGET_TMDB_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.tmdb_id || '27205' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL"; exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY"; exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1)

      - name: Run Akwam smoke
        run: npx tsx scripts/prefill-akwam.ts
