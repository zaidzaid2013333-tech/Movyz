name: Akwam Media Probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/akwam-media-probe.yml"
      - "workers/akwam-prefill/src/index.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Worker runtime
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30             https://movyz-akwam-prefill.sameranede.workers.dev/__diagnostic/cocktail
