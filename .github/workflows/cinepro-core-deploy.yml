name: CinePro Core Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cinepro-core-deploy.yml"
      - "cinepro/**"
      - "server/index.ts"
      - "package.json"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CinePro Core
        run: git clone --depth 1 https://github.com/cinepro-org/core.git cinepro

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build CinePro
        working-directory: cinepro
        run: npm install --no-audit --no-fund && npm run build

      - name: Configure CinePro TMDB secret
        working-directory: cinepro
        run: |
          test -n "$TMDB_API_KEY" || { echo "TMDB_API_KEY GitHub secret is missing"; exit 1; }
          printf '%s' "$TMDB_API_KEY" | npx wrangler secret put TMDB_API_KEY

      - name: Deploy CinePro Core
        working-directory: cinepro
        run: npx wrangler deploy

      - name: Verify CinePro endpoint
        run: |
          python - <<'PY'
          import json
          import urllib.request
          url = "https://movyz-cinepro.sameranede.workers.dev/v1/movies/157336"
          req = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"Movyz-CI/1.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              payload = json.load(r)
          sources = payload.get("sources") if isinstance(payload, dict) else None
          if not isinstance(sources, list) or not sources:
              raise SystemExit("CinePro returned no playable sources for Interstellar")
          print("CinePro OK: Interstellar sources=", len(sources))
          PY
