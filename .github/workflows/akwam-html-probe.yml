name: Probe Akwam HTML

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/akwam-html-probe.yml"
      - "workers/akwam-prefill/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch current Akwam episode and watch page
        run: |
          set -euo pipefail
          episode='https://akwam.ss/episode/102106/one-piece/%D8%A7%D9%84%D8%AD%D9%84%D9%82%D8%A9-1168'
          watch='https://akwam.ss/watch/181010/102106/one-piece/%D8%A7%D9%84%D8%AD%D9%84%D9%82%D8%A9-1168'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl -L --fail-with-body --silent --show-error --max-time 30 -A "$ua" -H 'Accept: text/html' "$episode" -o /tmp/episode.html
          curl -L --fail-with-body --silent --show-error --max-time 30 -A "$ua" -H "Referer: $episode" -H 'Accept: text/html' "$watch" -o /tmp/watch.html
          echo '=== watch bytes ==='
          wc -c /tmp/watch.html
          echo '=== obvious media URLs ==='
          grep -Eio "https?://[^\"' <>]+\.(m3u8|mp4)(\?[^\"' <>]+)?" /tmp/watch.html | head -100 || true
          echo '=== player-related lines ==='
          grep -Ein 'iframe|video|source|m3u8|mp4|player|watch|download|stream|file|videoUrl|video_url|data-src|data-url|data-href|jwplayer|plyr|hls|dash' /tmp/watch.html | head -250 || true
          echo '=== relevant href/src/data attrs ==='
          grep -Eio "(href|src|data-src|data-url|data-href|data-file|data-video)=[\"'][^\"']+[\"']" /tmp/watch.html | grep -Ei 'watch|download|link|m3u8|mp4|stream|player' | head -200 || true

          echo '=== legacy Free Solo page probe ==='
          curl -L --fail-with-body --silent --show-error --max-time 30 -A "$ua" -H 'Accept: text/html'             'https://akwam.ss/old/155349/%D8%A7%D9%84%D9%81%D9%8A%D9%84%D9%85-%D8%A7%D9%84%D9%88%D8%AB%D8%A7%D8%A6%D9%82%D9%8A-Free-Solo-2018-%D9%85%D8%AF%D8%A8%D9%84%D8%AC-HD' -o /tmp/free-solo-old.html
          echo '=== legacy page bytes ==='
          wc -c /tmp/free-solo-old.html
          echo '=== legacy media/download candidates ==='
          grep -Eio 'https?://[^"'"'"'<> ]+|href=["'"'"'][^"'"'"']+["'"'"']|src=["'"'"'][^"'"'"']+["'"'"']|download[^< ]*|mp4|m3u8|1080|720|480' /tmp/free-solo-old.html | head -300 || true
          echo '=== legacy scripts around download ==='
          grep -Ein 'download|تحميل|video|file|source|player|stream|mp4|m3u8|downet|location\.hash|href.*old/download|hash' /tmp/free-solo-old.html | head -350 || true
          echo '=== exact legacy download anchors and hash fragments ==='
          python - <<'PY'
          import re
          html = open('/tmp/free-solo-old.html', encoding='utf-8', errors='ignore').read()
          for m in re.finditer(r'<a\\b[^>]*href=["\']([^"\']*old/download[^"\']*)["\'][^>]*>', html, flags=re.I):
              start=max(0,m.start()-1800); end=min(len(html),m.end()+3000)
              print('--- ANCHOR ---')
              print(html[start:end])
          print('--- HASH-LIKE STRINGS ---')
          for pat in [r'location\\.hash[^;]{0,300}', r'href=["\'][^"\']*#[^"\']+["\']', r'["\']#[^"\']+["\']']:
              for m in re.finditer(pat, html, flags=re.I):
                  print(m.group(0))
          PY

          echo '=== legacy Free Solo download probe ==='
          old_download='https://akwam.ss/old/download/d25b122d795c/Free-Solo-2018-Ar-HD720p-akoam-net-mkv'
          echo '--- headers / redirect ---'
          curl -k -I -L --max-redirs 5 --max-time 30 -A "$ua" -H 'Accept: */*' "$old_download" || true
          echo '--- body bytes / content signals ---'
          curl -k -L --fail-with-body --silent --show-error --max-time 30 -A "$ua" -H 'Accept: */*' "$old_download" -o /tmp/free-solo-old-download.bin
          wc -c /tmp/free-solo-old-download.bin
          file /tmp/free-solo-old-download.bin || true
          grep -Eaio 'https?://[^"'"'"'<> ]+\.(m3u8|mp4|mpd|webm)(\?[^"'"'"'<> ]+)?|https?://[^"'"'"'<> ]+downet[^"'"'"'<> ]+' /tmp/free-solo-old-download.bin | head -100 || true
          strings -n 12 /tmp/free-solo-old-download.bin | grep -Ei 'location|redirect|downet|mp4|m3u8|video|file|source|download' | head -120 || true
          echo '=== legacy download javascript/API markers ==='
          grep -Ein 'direct_link|hash_data|downloadUrl|download_button|\$\.ajax|\$\.get|\$\.post|XMLHttpRequest|fetch\(|ajax|api|downloadalt|url:' /tmp/free-solo-old-download.bin | head -180 || true
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/free-solo-old-download.bin').read_text('utf-8','ignore')
          keys=['direct_link','hash_data','downloadUrl','download_button','downloadalt','$.ajax','$.get','$.post','XMLHttpRequest','fetch(']
          for k in keys:
              i=s.find(k)
              if i>=0:
                  print(f'--- {k} ---')
                  print(s[max(0,i-2500):i+6000])
          PY

          echo '=== movie search probe: Free Solo ==='
          curl -L --fail-with-body --silent --show-error --max-time 30 -A "$ua" -H 'Accept: text/html'             'https://akwam.ss/search?q=Free%20Solo' -o /tmp/movie-search.html
          echo '=== Free Solo search status/bytes ==='
          wc -c /tmp/movie-search.html
          grep -Eio 'href=["'"'"'][^"'"'"']*(/movie/|/series/)[^"'"'"']+["'"'"']' /tmp/movie-search.html | head -50 || true
          echo '=== Free Solo search relevant lines ==='
          grep -Ein 'Free Solo|فيلم|movie|search' /tmp/movie-search.html | head -120 || true

          echo '=== download candidates from episode ==='
          python - <<'PY'
          import re
          html = open('/tmp/episode.html', encoding='utf-8', errors='ignore').read()
          hrefs = re.findall(r'href=["\']([^"\']+)["\']', html, flags=re.I)
          candidates = [x for x in hrefs if '/download/' in x or '/link/' in x]
          print('\n'.join(candidates[:20]))
          open('/tmp/download-url.txt', 'w', encoding='utf-8').write(candidates[0] if candidates else '')
          PY
          download=$(cat /tmp/download-url.txt)
          test -n "$download"
          case "$download" in
            http*) ;;
            /*) download="https://akwam.ss$download" ;;
            *) download="https://akwam.ss/$download" ;;
          esac
          curl -L --fail-with-body --silent --show-error --max-time 30 -A "$ua" -H "Referer: $episode" -H 'Accept: text/html' "$download" -o /tmp/download.html
          echo '=== download page extraction markers ==='
          grep -Ein 'btn-loader|download-link|m3u8|mp4|mpd|webm|data-file|data-video|data-url|href=' /tmp/download.html | head -200 || true
          grep -Eiq 'btn-loader|download-link|m3u8|mp4|mpd|webm|data-file|data-video|data-url' /tmp/download.html

          echo '=== final media validation ==='
          media_url=$(python - <<'PY'
          import re
          html = open('/tmp/download.html', encoding='utf-8', errors='ignore').read()
          urls = re.findall(r'(?:href|src|data-src|data-file|data-video|data-url)=["\']([^"\']+)["\']', html, flags=re.I)
          for u in urls:
              if re.search(r'\.(?:m3u8|mp4|mpd|webm)(?:\?|$)', u, flags=re.I):
                  print(u)
                  break
          PY
          )
          test -n "$media_url"
          curl -k -L --fail-with-body --silent --show-error --max-time 20             -A "$ua" -H "Referer: $download" -H 'Range: bytes=0-8191'             -o /tmp/media.bin -w 'media_status=%{http_code} media_type=%{content_type} media_bytes=%{size_download}\n'             "$media_url"
          test "$(wc -c < /tmp/media.bin | tr -d ' ')" -gt 0
          if grep -aEiq '<html|<!doctype|captcha|cloudflare' /tmp/media.bin; then
            echo 'Media validation failed: HTML/challenge body returned'
            exit 1
          fi

