name: Probe Akwam HTML

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/akwam-html-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch current Akwam episode
        run: |
          url='https://akwam.ss/episode/102106/one-piece/%D8%A7%D9%84%D8%AD%D9%84%D9%82%D8%A9-1168'
          curl -L --fail-with-body --silent --show-error --max-time 30             -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'             -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'             "$url" -o /tmp/akwam.html
          echo '=== bytes ==='
          wc -c /tmp/akwam.html
          echo '=== media markers ==='
          grep -Eoi 'https?://[^"'' <>()]+\.(m3u8|mp4)(\?[^"'' <>()]+)?' /tmp/akwam.html | head -80 || true
          echo '=== player markers ==='
          grep -Ein 'iframe|video|source|m3u8|mp4|player|watch|download|stream|file|videoUrl|data-src|data-url|data-href' /tmp/akwam.html | head -160 || true
