name: Prepare ArProv Playback Sources

on:
  workflow_dispatch:

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[episode-fill-only]') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    concurrency:
      group: movyz-arprov-movies-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      PREPARE_MODE: ${{ github.event.inputs.mode || 'movies' }}
      PREPARE_LIMIT: ${{ github.event.inputs.limit || '500' }}
      PREPARE_OFFSET: ${{ github.event.inputs.offset || '0' }}
      PREPARE_SHARD_INDEX: ${{ matrix.shard }}
      PREPARE_SHARD_COUNT: "4"
      PREPARE_CONCURRENCY: "1"
      PREPARE_ONLY_MISSING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Prepare ready playback sources
        run: npm run bot:once

# Missing-only, high-concurrency preparation keeps the fill focused on content without ready sources.
