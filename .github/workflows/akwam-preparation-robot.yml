name: Movyz Akwam Preparation Robot
# [akwam-robot] parallel bulk preparation
# [akwam-robot] movies + series preparation

on:
  push:
    branches: ["main"]
    paths:
      - "bot/akwam-preparation-robot.ts"
      - "server/providers/arprov-akwam.ts"
      - "scripts/debug-breaking-bad-akwam.ts"
      - "scripts/prepare-arprov-sources.ts"
      - "scripts/prepare-arprov-episodes-fast.ts"
      - "scripts/validate-prepared-source.ts"
      - "bot/groq-akwam-agent.ts"
      - "scripts/train-akwam-agent.ts"
      - "docs/AKWAM-EXTRACTION-PLAYBOOK.md"
      - "package.json"
      - ".github/workflows/akwam-preparation-robot.yml"
  schedule:
    - cron: "17 03 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preparation lane"
        required: false
        default: "both"
        type: choice
        options: [both]
permissions:
  contents: read

concurrency:
  group: movyz-akwam-robot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  groq-agent:
    if: ${{ false }}
    needs: [movies, episodes]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: "openai/gpt-oss-120b"
      GROQ_AGENT_MAX_TURNS: "1"
      GROQ_AGENT_MAX_ACTIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund --ignore-scripts
      - name: Train Akwam robot + Groq continual memory
        run: npx tsx scripts/train-akwam-agent.ts

      - name: Run Movyz Groq preparation agent
        continue-on-error: true
        run: npm run bot:groq-agent

  movies:
    if: ${{ false }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      AKWAM_ROBOT_MODE: "movies"
      AKWAM_MOVIE_SHARD_INDEX: ${{ matrix.shard }}
      AKWAM_MOVIE_SHARD_COUNT: "4"
      PREPARE_LIMIT: "500"
      PREPARE_CONCURRENCY: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund --ignore-scripts
      - name: Run Movyz Akwam movie robot
        run: npm run bot:akwam

  episodes:
    if: ${{ false }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      EPISODE_SHARD_INDEX: ${{ matrix.shard }}
      EPISODE_SHARD_COUNT: "8"
      SEASON_CONCURRENCY: "2"
      EPISODE_CONCURRENCY: "8"
      VALIDATION_CONCURRENCY: "12"
      DELETE_CONCURRENCY: "6"
      EPISODE_SEASON_LIMIT: "160"
      AKWAM_PRIORITY_TMDB_IDS: "1396"
      PREPARE_ONLY_MISSING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund --ignore-scripts
      - name: Run Movyz Akwam episode robot
        run: npm run bot:episodes-fast
  debug-breaking-bad:
    if: ${{ false }}
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-
      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund --ignore-scripts
      - name: Diagnose Breaking Bad S01E01
        run: npx tsx scripts/debug-breaking-bad-akwam.ts
