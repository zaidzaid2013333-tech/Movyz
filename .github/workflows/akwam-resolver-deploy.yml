name: Deploy Akwam Resolver

on:
  workflow_dispatch:
  push:
    paths:
      - "akwam-resolver-worker/**"
      - ".github/workflows/akwam-resolver-deploy.yml"
      - ".github/scripts/verify-akwam-iframe.mjs"

permissions:
  contents: read

concurrency:
  group: movyz-akwam-resolver-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AKWAM_RESOLVER_BASE: https://movyz-akwam-resolver.sameranede.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Wrangler only
        run: npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.140.0

      - name: Deploy resolver worker
        run: npx wrangler deploy --config akwam-resolver-worker/wrangler.toml

      - name: Smoke test resolver contract
        run: node .github/scripts/verify-akwam-iframe.mjs
