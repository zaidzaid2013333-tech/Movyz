name: Movyz TMDB Sync — Hardened

on:
  schedule:
    # Daily catalog + episode synchronization. GitHub Actions is the scheduler;
    # the database remains the source of truth.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "TMDB catalog pages to sync (1-3)"
        required: true
        default: "1"
        type: choice
        options: ["1","2","3"]
      sync_episodes:
        description: "Sync episodes after catalog"
        required: true
        default: true
        type: boolean
      series_limit:
        description: "Maximum series to expand into episodes (1-25)"
        required: true
        default: "10"
        type: choice
        options: ["5","10","15","20","25","30"]

permissions:
  contents: read

concurrency:
  group: movyz-tmdb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      MOVYZA_PROVIDER_TIMEOUT_MS: "8000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repository currently has no package-lock.json, so npm ci/cache cannot be used.
      - name: Configure npm resilience
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL"; exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY"; exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1)
          test -n "$TMDB_API_READ_ACCESS_TOKEN" || (echo "Missing TMDB_API_READ_ACCESS_TOKEN"; exit 1)

      - name: Sync TMDB catalog
        env:
          TMDB_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.pages || '1' }}
        run: |
          for attempt in 1 2 3; do
            echo "Catalog sync attempt $attempt/3"
            npx tsx scripts/run-tmdb-sync.ts catalog "$TMDB_PAGES" && exit 0
            test "$attempt" -lt 3 && sleep 15
          done
          exit 1

      - name: Sync TMDB episodes
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.sync_episodes }}
        env:
          SERIES_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.series_limit || '30' }}
        run: |
          for attempt in 1 2 3; do
            echo "Episode sync attempt $attempt/3"
            npx tsx scripts/run-tmdb-sync.ts episodes "$SERIES_LIMIT" && exit 0
            test "$attempt" -lt 3 && sleep 15
          done
          exit 1

      - name: Verify OmegaTech playback coverage
        continue-on-error: true
        env:
          PLAYBACK_BASE_URL: "https://movyz-api.sameranede.workers.dev"
        run: |
          node <<'NODE'
          const base = process.env.PLAYBACK_BASE_URL;
          const checks = [
            ["movie", 27205],
            ["movie", 550],
            ["movie", 155],
            ["series", 1396, 1, 1],
            ["series", 1396, 2, 1],
            ["series", 1396, 5, 1],
            ["series", 60059, 1, 1],
            ["series", 60059, 3, 1],
            ["series", 70523, 1, 1],
            ["series", 2316, 1, 1],
            ["series", 5920, 1, 1],
          ];

          for (const [type, tmdbId, season, episode] of checks) {
            const params = new URLSearchParams({ type, tmdbId: String(tmdbId) });
            if (season != null) params.set("season", String(season));
            if (episode != null) params.set("episode", String(episode));
            const response = await fetch(base + "/api/v1/playback/resolve?" + params, {
              headers: { Accept: "application/json", "User-Agent": "Movyz-AutoSync/1.0" },
              signal: AbortSignal.timeout(45000),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(type + " " + tmdbId + " S" + season + "E" + episode + " -> HTTP " + response.status + " " + body.slice(0, 600));
            const payload = JSON.parse(body);
            const sources = payload?.data?.sources;
            if (!Array.isArray(sources) || !sources.length) throw new Error(type + " " + tmdbId + " returned no OmegaTech sources");
            const external = sources.filter((source) => /^https?:\/\//i.test(String(source?.url || "")));
            if (!external.length || external.some((source) => String(source.url).includes("movyz-api.sameranede.workers.dev"))) throw new Error(type + " " + tmdbId + " returned an invalid/non-external playback URL");
            console.log("PLAYBACK_OK", type, tmdbId, season ?? "", episode ?? "", "sources=" + external.length);
          }
          NODE
      - name: Verify synchronized catalog
        run: npx tsx scripts/verify-tmdb-sync.ts
