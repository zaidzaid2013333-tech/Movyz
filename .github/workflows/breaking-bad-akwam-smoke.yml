name: Breaking Bad Akwam Smoke

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/prepare-breaking-bad-s1-smoke.ts"
      - "server/providers/arprov-akwam.ts"
      - "scripts/validate-prepared-source.ts"
      - ".github/workflows/breaking-bad-akwam-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-breaking-bad-akwam-smoke
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    # [akwam-smoke] retest parser after season matching fix
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Prepare Breaking Bad S01
        run: npx tsx scripts/prepare-breaking-bad-s1-smoke.ts
