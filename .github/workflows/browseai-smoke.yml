name: Browse AI API smoke

# API-backed robot discovery; updating this workflow triggers a fresh sync.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/browseai-smoke.yml"

permissions:
  contents: write

jobs:
  browseai:
    runs-on: ubuntu-latest
    env:
      BROWSEAI_API_KEY: ${{ secrets.BROWSEAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Browse AI API and discover approved robots
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BROWSEAI_API_KEY}" || { echo "::error::Missing BROWSEAI_API_KEY repository secret"; exit 1; }

          status_json="$(curl -fsS --retry 2 --connect-timeout 10 --max-time 30             -H "Authorization: Bearer ${BROWSEAI_API_KEY}"             -H "Accept: application/json"             "https://api.browse.ai/v2/status")"

          echo "Browse AI status:"
          echo "${status_json}" | jq '{statusCode,messageCode,tasksQueueStatus}'

          robots_json="$(curl -fsS --retry 2 --connect-timeout 10 --max-time 30             -H "Authorization: Bearer ${BROWSEAI_API_KEY}"             -H "Accept: application/json"             "https://api.browse.ai/v2/robots")"

          echo "Approved robots:"
          echo "${robots_json}" | jq '
            .robots.items // [] |
            map({
              id,
              name,
              inputParameters: ([.inputParameters[]? | {name,type,required}] // [])
            })
          ' | tee /tmp/browseai-robots.json

          mkdir -p .github/browseai
          jq '{
            syncedAt: (now | todateiso8601),
            totalCount: (.robots.totalCount // 0),
            robots: (
              .robots.items // [] |
              map({
                id,
                name,
                createdAt,
                inputParameters: ([.inputParameters[]? | {name,type,required}] // [])
              })
            )
          }' <<< "${robots_json}" > .github/browseai/robots.json

          # Capture configuration and the latest task metadata for every approved robot.
          echo '[]' > /tmp/browseai-robot-state.json
          while IFS= read -r robot_id; do
            [ -n "${robot_id}" ] || continue
            detail_json="$(curl -fsS --retry 2 --connect-timeout 10 --max-time 30               -H "Authorization: Bearer ${BROWSEAI_API_KEY}"               -H "Accept: application/json"               "https://api.browse.ai/v2/robots/${robot_id}")"
            tasks_json="$(curl -fsS --retry 2 --connect-timeout 10 --max-time 30               -H "Authorization: Bearer ${BROWSEAI_API_KEY}"               -H "Accept: application/json"               "https://api.browse.ai/v2/robots/${robot_id}/tasks?page=1&pageSize=10")"
            jq --argjson detail "${detail_json}"                --argjson tasks "${tasks_json}"                --arg rid "${robot_id}"                '. + [{
                 robotId: $rid,
                 detail: $detail.result,
                 recentTasks: ($tasks.result.robotTasks.items // [])
               }]' /tmp/browseai-robot-state.json > /tmp/browseai-robot-state.next.json
            mv /tmp/browseai-robot-state.next.json /tmp/browseai-robot-state.json
          done < <(jq -r '.robots.items[]?.id // empty' <<< "${robots_json}")

          jq '{
            syncedAt: (now | todateiso8601),
            robots: .
          }' /tmp/browseai-robot-state.json > .github/browseai/robot-state.json


      - name: Commit discovered robot metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/browseai/robots.json .github/browseai/robot-state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync Browse AI robot metadata"
          git push
