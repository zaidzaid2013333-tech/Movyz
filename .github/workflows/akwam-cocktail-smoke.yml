name: Akwam Cocktail Smoke

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/akwam-cocktail-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Reset Cocktail test job
        run: |
          set -euo pipefail
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X PATCH \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            -H 'Prefer: return=minimal' \
            --data "{\"status\":\"pending\",\"priority\":999,\"attempts\":0,\"source_count\":0,\"locked_at\":null,\"locked_by\":null,\"last_error\":null,\"available_at\":\"$now\",\"updated_at\":\"$now\"}" \
            "$SUPABASE_URL/rest/v1/playback_source_jobs?id=eq.fd75cc02-9e43-4b9a-aa2e-45514a135daa"

      - name: Run deterministic Cocktail job
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --max-time 180             -X POST             -H "x-movyz-prefill-key: $SUPABASE_SERVICE_ROLE_KEY"             -H "x-movyz-prefill-mode: cocktail-smoke"             https://movyz-akwam-prefill.sameranede.workers.dev/)
          echo "$response"
          node -e '
            const x=JSON.parse(process.argv[1]);
            if (!x.ok || Number(x.processed || 0) !== 1) process.exit(1);
            if (Number(x.saved || 0) < 1) process.exit(2);
          ' "$response"
