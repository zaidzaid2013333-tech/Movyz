name: Akwam Cocktail Smoke

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/akwam-cocktail-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Run deterministic Cocktail job
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --max-time 180             -X POST             -H "x-movyz-prefill-key: $SUPABASE_SERVICE_ROLE_KEY"             -H "x-movyz-prefill-mode: cocktail-smoke"             https://movyz-akwam-prefill.sameranede.workers.dev/)
          echo "$response"
          node -e '
            const x=JSON.parse(process.argv[1]);
            if (!x.ok || Number(x.processed || 0) !== 1) process.exit(1);
            if (Number(x.saved || 0) < 1) process.exit(2);
          ' "$response"
