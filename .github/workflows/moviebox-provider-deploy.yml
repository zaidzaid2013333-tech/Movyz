name: Movyz MovieBox Provider Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "moviebox-worker/**"
      - ".github/workflows/moviebox-provider-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-moviebox-provider
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate MovieBox provider
        run: npx wrangler deploy --config moviebox-worker/wrangler.toml --dry-run

      - name: Deploy MovieBox provider
        run: npx wrangler deploy --config moviebox-worker/wrangler.toml
