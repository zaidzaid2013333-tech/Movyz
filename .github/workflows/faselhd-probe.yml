name: FaselHD Direct Probe

on:
  push:
    paths:
      - ".github/workflows/faselhd-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe FaselHD API
        run: |
          set -eux
          START=$(date +%s)
          curl -v --retry 1 --connect-timeout 10 --max-time 35             "https://faselhdapi.onrender.com/discover/movies?page=1&pageSize=1"             -o fasel.json
          END=$(date +%s)
          echo "ELAPSED_SECONDS=$((END-START))"
          python - <<'PY'
          import json
          d=json.load(open("fasel.json"))
          print("RESPONSE_TYPE=", type(d).__name__)
          print("RESPONSE_HEAD=", str(d)[:1500])
          PY
