name: Deploy Movyz API Worker

# Deployment trigger kept explicit so broker changes can be released from main.

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - "worker.ts"
      - "wrangler.jsonc"
      - "src/**"
      - "workers/**"
      - "index.html"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: movyz-api-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine application build identity
        id: app_version
        shell: bash
        run: |
          APP_SHA="$(git log -1 --format=%H -- server worker.ts workers src index.html package.json vite.config.ts)"
          test -n "$APP_SHA"
          echo "sha=$APP_SHA" >> "$GITHUB_OUTPUT"
          echo "Application build SHA: $APP_SHA"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Build frontend assets
        env:
          MOVYZ_BUILD_ID: ${{ steps.app_version.outputs.sha }}
        run: npm run build

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --var MOVYZ_BUILD_ID:${{ steps.app_version.outputs.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live Playback Broker and Akwam resolution
        env:
          EXPECTED_BUILD_ID: ${{ steps.app_version.outputs.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          base = "https://movyz-api.sameranede.workers.dev/api/v1"
          expected_build = os.environ["EXPECTED_BUILD_ID"]

          def get_json(path, label):
              separator = "&" if "?" in path else "?"
              cache_busted_path = f"{path}{separator}__movyz_ci={expected_build}"
              req = urllib.request.Request(
                  base + cache_busted_path,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "Movyz-CI-Playback/4.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=90) as response:
                  payload = json.load(response)
                  headers = {
                      "build": response.headers.get("x-movyz-build-id", ""),
                      "contract": response.headers.get("x-movyz-playback-contract", ""),
                  }
              if payload.get("success") is not True:
                  raise SystemExit(f"{label}: API response was not successful")
              return payload, headers

          def verify_broker(content_type, content_id, label, season=None, episode=None):
              query = {
                  "type": content_type,
                  "contentId": content_id,
              }
              if season is not None:
                  query["season"] = str(season)
              if episode is not None:
                  query["episode"] = str(episode)

              path = "/playback/prepare?" + urllib.parse.urlencode(query)
              payload, _ = get_json(path, label)
              data = payload.get("data", {})
              sources = data.get("sources", [])

              if payload.get("data", {}).get("ready") is not True:
                  raise SystemExit(f"{label}: broker is not ready: {json.dumps(data)[:1200]}")
              if not isinstance(sources, list) or not sources:
                  raise SystemExit(f"{label}: expected at least one live source")

              for source in sources:
                  if not isinstance(source, dict):
                      raise SystemExit(f"{label}: invalid source object")
                  url = str(source.get("url") or "")
                  source_type = str(source.get("type") or "").lower()
                  quality = str(source.get("quality") or "")
                  provider = str(source.get("providerKey") or "").lower()

                  if not url.startswith("https://"):
                      raise SystemExit(f"{label}: non-HTTPS source")
                  if source_type not in {"mp4", "hls", "dash", "webm", "direct", "embed"}:
                      raise SystemExit(f"{label}: invalid source type {source_type!r}")
                  if quality and quality.lower() != "auto" and not re.fullmatch(r"\d{3,4}p", quality, re.I):
                      raise SystemExit(f"{label}: non-normalized quality {quality!r}")
                  if provider != "akwam":
                      raise SystemExit(f"{label}: unexpected provider {provider!r}")

              mode = str(data.get("mode") or "")
              print(
                  f"broker_ok label={label!r} mode={mode!r} "
                  f"sources={len(sources)}"
              )

          checks = [
              ("/movies/tmdb/157336", "Interstellar", "movie"),
              ("/movies/tmdb/278", "The Shawshank Redemption", "movie"),
              ("/series/tmdb/456/watch/21/1", "The Simpsons S21E01", "episode"),
          ]

          for path, label, kind in checks:
              payload, headers = get_json(path, label)
              contract = headers["contract"]
              if contract != "broker-v1":
                  raise SystemExit(f"{label}: unexpected playback contract: {contract!r}")

              if kind == "movie":
                  content = payload.get("data", {}).get("movie", {})
                  content_id = content.get("id")
                  if not content_id:
                      raise SystemExit(f"{label}: missing movie UUID")
                  verify_broker("movie", content_id, label)
              else:
                  series = payload.get("data", {}).get("series", {})
                  seasons = series.get("seasons") or []
                  episodes = seasons[0].get("episodes") if seasons else []
                  episodes = episodes or []
                  episode = episodes[0] if episodes else {}
                  content_id = episode.get("id")
                  season = episode.get("seasonNumber")
                  ep = episode.get("episodeNumber")
                  if not content_id or season is None or ep is None:
                      raise SystemExit(f"{label}: missing episode identity")
                  verify_broker("episode", content_id, label, season, ep)

          print("Movyz live Playback Broker verification: ALL OK")
          PY
