name: Validate Movyz

# Production deployments are handled by Cloudflare Workers Builds.
# GitHub Actions is intentionally validation-only to avoid a second competing deploy pipeline.

on:
  pull_request:
    paths:
      - "server/**"
      - "worker.ts"
      - "wrangler.jsonc"
      - "src/**"
      - "workers/**"
      - "index.html"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: movyz-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Build frontend assets
        run: npm run build
