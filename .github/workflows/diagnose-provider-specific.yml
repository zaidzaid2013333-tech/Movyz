name: Movyz provider-specific diagnostic

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-provider-specific.ts"
      - "server/providers/re3arabi.ts"
      - ".github/workflows/diagnose-provider-specific.yml"

concurrency:
  group: movyz-provider-diagnostic-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      RE3ARABI_TIMEOUT_MS: "15000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx tsx scripts/diagnose-provider-specific.ts
