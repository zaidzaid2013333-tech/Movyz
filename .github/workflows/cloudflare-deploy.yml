name: Movyza Cloudflare Deploy
# Production locale/SEO verification pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyza-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_MOVYZ_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Validate TypeScript
        run: npm run lint
      - name: Smoke test
        run: npm test
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_VIDSRC_BASE_URL: ${{ secrets.VITE_VIDSRC_BASE_URL }}
        run: npm run build
      - name: Validate Cloudflare
        run: npx wrangler deploy --dry-run
      - name: Set TMDB Worker secret
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          test -n "$TMDB_API_READ_ACCESS_TOKEN"
          printf '%s' "$TMDB_API_READ_ACCESS_TOKEN" | npx wrangler secret put TMDB_API_READ_ACCESS_TOKEN

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var MOVYZ_BUILD_ID:${{ github.sha }}
      - name: Live health check
        run: |
          set -euo pipefail
          base="https://movyz-api.sameranede.workers.dev"

          echo "CHECK 1/10: localized home"
          html="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/")"
          printf '%s' "$html" | grep -q 'name="movyz-player" content="vidsrc"'
          printf '%s' "$html" | grep -q 'name="movyz-subtitles" content="vidsrc-locale-subtitles-v1"'

          echo "CHECK 2/10: Arabic movies"
          ar_html="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/ar/movies")"
          printf '%s' "$ar_html" | grep -q '<html lang="ar" dir="rtl"'
          printf '%s' "$ar_html" | grep -q 'hreflang="en-us"'

          echo "CHECK 3/10: English movies"
          en_html="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/en/movies")"
          printf '%s' "$en_html" | grep -q '<html lang="en" dir="ltr"'
          printf '%s' "$en_html" | grep -q 'hreflang="ar-sa"'

          echo "CHECK 4/10: root sitemap index"
          sitemap_headers="$(curl --fail --silent --show-error --location -D - -o /tmp/sitemap.xml -H 'Cache-Control: no-cache' "$base/sitemap.xml")"
          printf '%s' "$sitemap_headers" | grep -Eiq '^content-type: *application/xml'
          sitemap="$(cat /tmp/sitemap.xml)"
          printf '%s' "$sitemap" | grep -q '^<?xml version="1.0" encoding="UTF-8"?>'
          printf '%s' "$sitemap" | grep -q '<sitemapindex'
          printf '%s' "$sitemap" | grep -q 'https://movyza.sbs/sitemap/ar/movies/1.xml'
          printf '%s' "$sitemap" | python -c 'import sys,xml.etree.ElementTree as ET; ET.fromstring(sys.stdin.read())'

          echo "CHECK 5/10: worker sitemap index"
          worker_sitemap="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "https://movyza.sbs/sitemap.xml")"
          printf '%s' "$worker_sitemap" | grep -q '<sitemapindex'
          printf '%s' "$worker_sitemap" | grep -q 'https://movyz-api.sameranede.workers.dev/sitemap/ar/movies/1.xml'
          printf '%s' "$worker_sitemap" | python -c 'import sys,xml.etree.ElementTree as ET; ET.fromstring(sys.stdin.read())'

          echo "CHECK 5A/10: worker sitemap segment publishes Movyza URLs"
          worker_segment="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "https://movyz-api.sameranede.workers.dev/sitemap/ar/movies/1.xml")"
          printf '%s' "$worker_segment" | grep -q '<urlset'
          printf '%s' "$worker_segment" | grep -q 'https://movyza.sbs/ar/movies/'
          printf '%s' "$worker_segment" | python -c 'import sys,xml.etree.ElementTree as ET; ET.fromstring(sys.stdin.read())'

          echo "CHECK 5B/10: public Googlebot sitemap access"
          googlebot_status="$(curl --silent --show-error --location -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' -o /tmp/googlebot-public-sitemap.xml -w '%{http_code}' "https://movyza.sbs/sitemap.xml")"
          test "$googlebot_status" = "200"
          googlebot_public_sitemap="$(cat /tmp/googlebot-public-sitemap.xml)"
          printf '%s' "$googlebot_public_sitemap" | grep -q '<sitemapindex'
          printf '%s' "$googlebot_public_sitemap" | grep -q 'https://movyza.sbs/sitemap/ar/movies/1.xml'
          printf '%s' "$googlebot_public_sitemap" | python -c 'import sys,xml.etree.ElementTree as ET; ET.fromstring(sys.stdin.read())'

          echo "CHECK 5C/10: public robots points to same-origin sitemap"
          public_robots="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "https://movyza.sbs/robots.txt")"
          printf '%s' "$public_robots" | grep -q 'Sitemap: https://movyza.sbs/sitemap.xml'

          echo "CHECK 6/10: sitemap segment"
          sitemap_segment="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/sitemap/ar/movies/1.xml")"
          printf '%s' "$sitemap_segment" | grep -q '<urlset'
          printf '%s' "$sitemap_segment" | grep -q '/ar/movies/'

          echo "CHECK 7/10: static assets"
          assets="$(printf '%s' "$html" | grep -oE '/assets/[^"]+\.js' | sort -u)"
          test -n "$assets"
          printf '%s' "$html" | grep -q 'Movyza'

          echo "CHECK 8/10: TMDB proxy"
          body="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$base/tmdb/movie/550?language=en-US")"
          printf '%s' "$body" | grep -q '"id":550'

          echo "CHECK 9/10: movie deep link"
          fight_club="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/ar/movies/550")"
          printf '%s' "$fight_club" | grep -q 'Fight Club'
          printf '%s' "$fight_club" | grep -q 'name="robots" content="index,follow,max-image-preview:large"'
          printf '%s' "$fight_club" | grep -q 'rel="canonical"'
          printf '%s' "$fight_club" | grep -q '"@type":"Movie"'

          echo "CHECK 10/10: watch deep link"
          watch_html="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/ar/watch/movie/550")"
          printf '%s' "$watch_html" | grep -q 'Fight Club'

          echo "CHECK 11/11: robots"
          robots="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/robots.txt")"
          printf '%s' "$robots" | grep -q 'Sitemap:'

          echo "ALL PRODUCTION HEALTH CHECKS PASSED"

          # Production custom domains can be protected by Cloudflare Bot Fight Mode.
          # The worker-origin checks above validate the application contract; public-domain
          # crawling is validated separately with Google Search Console URL Inspection.
