name: Movyz Cloudflare Deploy
# Browser Run verification trigger: 2026-10-01
# Runtime playback uses on-demand Akwam resolution with edge caching and the Movyz playback proxy
# CI trigger: production deploys run from a real main-branch push.
# Runtime verification checks the on-demand proxy path without exposing raw provider URLs.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/tmdb-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ contains(github.event.head_commit.message, 'emergency playback deploy') && format('movyz-cloudflare-emergency-{0}', github.sha) || 'movyz-cloudflare-production' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[episode-fill-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      DOODSTREAM_API_KEY: ${{ secrets.DOODSTREAM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        env:
          MOVYZ_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Validate Cloudflare configuration
        run: |
          npx wrangler deploy --dry-run

      - name: Prepare deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          printf 'DOODSTREAM_API_KEY=%s\n' "$DOODSTREAM_API_KEY"
          } > .env.production

      - name: Deploy Movyz
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .env.production --var MOVYZ_BUILD_ID:${{ github.sha }}

      - name: Smoke test DoodStream account library
        continue-on-error: true
        env:
          DOODSTREAM_API_KEY: ${{ secrets.DOODSTREAM_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          key = os.environ.get("DOODSTREAM_API_KEY", "").strip()
          if not key:
              print("DoodStream WARN: API key missing")
              raise SystemExit(0)

          def get(path, **params):
              query = urllib.parse.urlencode({"key": key, **params})
              request = urllib.request.Request(
                  f"https://doodapi.co/api/{path}?{query}",
                  headers={"Accept": "application/json", "User-Agent": "Movyz-CI/1.0"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          try:
              account = get("account/info")
              print(f"DoodStream account API: status={account.get('status')} msg={account.get('msg')}")
              listing = get("file/list", page=1, per_page=1)
              result = listing.get("result") or {}
              print(
                  "DoodStream library: "
                  f"status={listing.get('status')} total_pages={result.get('total_pages')} "
                  f"results_total={result.get('results_total')} files_on_page={len(result.get('files') or [])}"
              )
          except Exception as exc:
              print(f"DoodStream WARN: {exc!r}")
          PY

      - name: Smoke test production watch paths
        continue-on-error: true
        run: |
          set -u
          export API_BASE="https://movyz-api.sameranede.workers.dev"

          python - <<'PY'
          import json
          import os
          import urllib.request
          from urllib.error import HTTPError

          api_base = os.environ["API_BASE"]
          api_checks = [
              (f"{api_base}/api/v1/movies/tmdb/1477712", "movie", 1477712),
              (f"{api_base}/api/v1/series/tmdb/65733", "series", 65733),
          ]

          for url, expected_type, expected_tmdb in api_checks:
              with urllib.request.urlopen(url, timeout=20) as response:
                  payload = json.load(response)
              if payload.get("success") is not True:
                  raise SystemExit(f"{url}: API success=false")
              key = "movie" if expected_type == "movie" else "series"
              item = payload.get("data", {}).get(key)
              actual = int(item.get("tmdbId", 0)) if item else 0
              if actual != expected_tmdb:
                  raise SystemExit(f"{url}: expected TMDB {expected_tmdb}, got {actual}")
              print(f"API OK: {expected_type} TMDB {actual}")

          watch_url = f"{api_base}/api/v1/series/tmdb/1396/watch/1/1"
          with urllib.request.urlopen(watch_url, timeout=20) as response:
              watch_payload = json.load(response)
          watch_series = watch_payload.get("data", {}).get("series")
          if watch_payload.get("success") is not True:
              raise SystemExit(f"{watch_url}: API success=false")
          if not watch_series or int(watch_series.get("tmdbId", 0)) != 1396:
              raise SystemExit(f"{watch_url}: lightweight series watch payload is invalid")
          season = (watch_series.get("seasons") or [None])[0]
          episodes = season.get("episodes") if isinstance(season, dict) else []
          if not any(int(item.get("episodeNumber", 0)) == 1 for item in episodes if isinstance(item, dict)):
              raise SystemExit(f"{watch_url}: S01E01 missing from lightweight watch payload")
          print("Series watch API OK: Breaking Bad S01E01")

          print("Playback provider checks skipped: production player is now resolved from Movyz API playback sources.")

      - name: Smoke test production on-demand Akwam playback
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from urllib.error import HTTPError

          api = "https://movyz-api.sameranede.workers.dev/api/v1/playback/on-demand"
          checks = [
              ("movie", "81723a1b-a9c5-46bb-bec6-f16664895d3e", "Inception"),
              ("movie", "ef350c7c-dbf6-44bb-80dc-3bc61890a166", "Fight Club"),
              ("episode", "cfec368f-138e-405d-a98b-bb6734f5bbf5", "Breaking Bad S01E01"),
          ]

          for content_type, content_id, label in checks:
              url = api + "?" + urllib.parse.urlencode({
                  "type": content_type,
                  "id": content_id,
              })

              request = urllib.request.Request(
                  url,
                  method="GET",
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "Movyz-CI/1.0",
                  },
              )

              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      payload = json.load(response)
              except HTTPError as exc:
                  print(f"On-demand WARN: {label} HTTP {exc.code}")
                  continue
              except Exception as exc:
                  print(f"On-demand WARN: {label} {exc!r}")
                  continue

              if payload.get("success") is not True:
                  print(f"On-demand WARN: {label} success=false")
                  continue

              sources = payload.get("data") if isinstance(payload.get("data"), list) else []
              if not sources:
                  print(f"On-demand WARN: {label} returned no playable sources")
                  continue

              for source in sources[:4]:
                  provider = str(source.get("providerKey") or "").lower()
                  quality = str(source.get("quality") or "").lower()
                  source_type = str(source.get("type") or "").lower()
                  stream_url = str(source.get("url") or "")

                  if provider != "akwam":
                      raise SystemExit(f"{label}: unexpected provider {provider!r}")
                  if source_type not in {"hls", "mp4", "dash", "webm", "direct"}:
                      raise SystemExit(f"{label}: invalid source type {source_type!r}")
                  if quality in {"", "auto", "source"}:
                      raise SystemExit(f"{label}: invalid quality {quality!r}")
                  if not stream_url.startswith("https://"):
                      raise SystemExit(f"{label}: non-HTTPS source")
                  if "movyz-api.sameranede.workers.dev/api/v1/playback/stream?token=" not in stream_url:
                      raise SystemExit(f"{label}: Akwam raw URL was not hidden behind Movyz proxy")

              print(f"On-demand playback OK: {label} sources={len(sources)}")

          print("On-demand Akwam smoke test complete.")
          PY

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production
