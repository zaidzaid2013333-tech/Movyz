name: Movyz Cloudflare Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/tmdb-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        run: npm run build

      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run

      - name: Prepare deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          } > .env.production

      - name: Deploy Movyz
        run: npx wrangler deploy --secrets-file .env.production

      - name: Verify deployed playback resolver
        run: |
          node <<'NODE'
          const base = 'https://movyz-api.sameranede.workers.dev';
          const headers = { Accept: 'application/json' };
          const getJson = async (path, timeout = 30000) => {
            const response = await fetch(base + path, { headers, redirect: 'follow', signal: AbortSignal.timeout(timeout) });
            const body = await response.text();
            console.log(path, 'HTTP', response.status, body.slice(0, 1800));
            if (!response.ok) throw new Error(path + ' -> HTTP ' + response.status + ' ' + body.slice(0, 900));
            return JSON.parse(body);
          };
          const health = await getJson('/health', 15000);
          if (!health?.success || health?.data?.status !== 'ok') throw new Error('Worker health check failed');
          const catalog = await getJson('/api/v1/movies?page=1&limit=1', 20000);
          const items = Array.isArray(catalog?.data) ? catalog.data : catalog?.data?.items ?? catalog?.data?.movies ?? [];
          if (!Array.isArray(items) || !items.length) throw new Error('Published movie catalog is empty');
          const movie = items[0];
          const contentId = String(movie?.id || '');
          const tmdbId = Number(movie?.tmdbId || movie?.tmdb_id || 0);
          if (!contentId || !/^[0-9a-f-]{36}$/i.test(contentId)) throw new Error('First published movie has no valid UUID: ' + JSON.stringify(movie).slice(0, 1200));
          if (!Number.isInteger(tmdbId) || tmdbId <= 0) throw new Error('First published movie has no valid TMDB id: ' + JSON.stringify(movie).slice(0, 1200));
          const playback = await getJson('/api/v1/playback/sources?contentType=movie&contentId=' + encodeURIComponent(contentId), 30000);
          const sources = Array.isArray(playback?.data) ? playback.data : [];
          if (!sources.length) throw new Error('Playback resolver returned no playable source for movie ' + contentId);
          const source = sources[0];
          const validDirect = /^https:\/\//i.test(String(source?.url || ''));
          const validProxy = /^\/api\/v1\/playback\/proxy\?url=/.test(String(source?.url || ''));
          if (!source?.url || (!validDirect && !validProxy)) throw new Error('Playback resolver returned an invalid direct source: ' + JSON.stringify(source).slice(0, 1600));
          if (!['hls','mp4','dash'].includes(String(source.type))) throw new Error('Playback resolver returned unsupported direct type: ' + String(source.type));
          if (String(source.type) === 'hls' && !validProxy && !/\.m3u8(?:$|[?#])/i.test(String(source.url))) throw new Error('HLS source does not point to an m3u8 URL');
          const host = validDirect ? new URL(source.url).host : 'movyz-proxy';
          console.log('LIVE_PLAYBACK_TARGET=PASS');
          console.log(JSON.stringify({ contentId, tmdbId, provider: source.provider, type: source.type, host }));
          NODE

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production
