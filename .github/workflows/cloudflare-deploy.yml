name: Movyz Cloudflare Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/**"
      - "workers/akwam-queue-job/**"
      - "workers/akwam-queue-consumer/**"
      - "workers/akwam-queue-dispatcher/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[episode-fill-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        env:
          MOVYZ_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run

      - name: Validate TMDB read token
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          test -n "${TMDB_API_READ_ACCESS_TOKEN:-}" || (echo "Missing TMDB_API_READ_ACCESS_TOKEN"; exit 1)
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ["TMDB_API_READ_ACCESS_TOKEN"]
          req = urllib.request.Request(
              "https://api.themoviedb.org/3/movie/157336",
              headers={"Authorization": "Bearer " + token, "Accept": "application/json", "User-Agent": "Movyz-CI/1.0"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
              print("TMDB direct status =", response.status, "title =", payload.get("title"))
          PY

      - name: Prepare Movyz deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          } > .env.production

      - name: Deploy Movyz
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .env.production --var MOVYZ_BUILD_ID:${{ github.sha }}

      - name: DB-only playback smoke
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.request
          api = "https://movyz-api.sameranede.workers.dev"
          checks = [
              ("movie", "6591564a-13a9-4892-a166-247d1ff9158b", "Interstellar"),
          ]
          for content_type, content_id, label in checks:
              req = urllib.request.Request(
                  api + "/api/v1/watch/" + content_id + "?type=" + content_type,
                  headers={"Accept": "application/json", "User-Agent": "Movyz-CI-DBOnly/2.0"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  raise SystemExit(f"{label}: watch API HTTP {error.code}: {body[:700]}")
              if payload.get("success") is not True:
                  raise SystemExit(f"{label}: watch API failed")
              content = payload.get("data", {}).get("content", {})
              sources = content.get("sources") if isinstance(content, dict) else []
              if not isinstance(sources, list) or not sources:
                  raise SystemExit(f"{label}: DB-only API returned no persisted sources")
              for source in sources:
                  if not isinstance(source, dict) or not str(source.get("url") or "").startswith("https://"):
                      raise SystemExit(f"{label}: invalid persisted source")
                  quality = str(source.get("quality") or "")
                  if quality and quality.lower() != "auto" and not quality.endswith("p"):
                      raise SystemExit(f"{label}: non-normalized playback quality: {quality}")
              print(f"DB-only playback OK: {label} sources={len(sources)}")
          print("Movyz DB-only playback smoke: ALL OK")
          PY

      - name: Deployment marker
        run: echo "DEPLOY_CURRENT_COMMIT=${{ github.sha }}"

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production
