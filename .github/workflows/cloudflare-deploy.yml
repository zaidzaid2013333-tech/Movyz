name: Movyza Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyza-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_MOVYZ_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Validate TypeScript
        run: npm run lint
      - name: Smoke test
        run: npm test
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Validate Cloudflare
        run: npx wrangler deploy --dry-run
      - name: Set TMDB Worker secret
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          test -n "$TMDB_API_READ_ACCESS_TOKEN"
          printf '%s' "$TMDB_API_READ_ACCESS_TOKEN" | npx wrangler secret put TMDB_API_READ_ACCESS_TOKEN

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var MOVYZ_BUILD_ID:${{ github.sha }}
      - name: Live health check
        run: |
          set -euo pipefail
          base="https://movyz.sameranede.workers.dev"
          echo "Live response headers:"
          curl --fail --silent --show-error -I -H 'Cache-Control: no-cache' "$base/"
          html="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$base/")"
          echo "Live HTML (first 5000 bytes):"
          printf '%s' "$html" | head -c 5000
          printf '\n--- END LIVE HTML ---\n'
          marker="$(printf '%s' "$html" | sed -n 's/.*name="movyz-build" content="\([^"]*\)".*/\1/p')"
          echo "Live Movyz build marker: $marker"
          assets="$(printf '%s' "$html" | grep -oE '/assets/[^"]+\.js' | sort -u || true)"
          echo "Live JS assets:"
          printf '%s\n' "$assets"
          if [ -z "$assets" ]; then
            echo "ERROR: live HTML contains no built JS asset."
            exit 1
          fi
          found_old=0
          found_catalog=0
          for asset in $assets; do
            js="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$base$asset")"
            if printf '%s' "$js" | grep -Fq 'Supabase is not configured'; then
              echo "ERROR: stale Supabase error found in live JS: $asset"
              found_old=1
            fi
            if printf '%s' "$js" | grep -Fq 'catalog-only mode'; then
              found_catalog=1
            fi
          done
          test "$found_old" -eq 0
          test "$found_catalog" -eq 1
          printf '%s' "$html" | grep -q 'Movyza'
          body="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$base/tmdb/movie/550?language=en-US")"
          printf '%s' "$body" | grep -q '"id":550'
