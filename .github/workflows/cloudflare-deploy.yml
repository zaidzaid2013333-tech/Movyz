name: Movyz Cloudflare Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/**"
      - ".github/workflows/tmdb-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-production
  cancel-in-progress: true

jobs:
  deploy:
    if: \${{ !contains(github.event.head_commit.message, '[episode-fill-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: \${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: \${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      TMDB_API_KEY: \${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        env:
          MOVYZ_BUILD_ID: \${{ github.sha }}
        run: npm run build

      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run

      - name: Deploy MediaMash playback core
        run: |
          npx wrangler deploy --config integrations/mediamash/wrangler.json
          printf '%s' "$TMDB_API_READ_ACCESS_TOKEN" | npx wrangler secret put TMDB_API_READ_ACCESS_TOKEN --config integrations/mediamash/wrangler.json

      - name: Smoke test MediaMash playback core
        run: |
          python - <<'PY'
          import json, urllib.request
          base = "https://movyz-media-core.sameranede.workers.dev"
          for path in ["/v1/health", "/v1/movies/157336", "/v1/tv/1399/seasons/1/episodes/1"]:
              with urllib.request.urlopen(base + path, timeout=45) as response:
                  payload = json.load(response)
              print(path, "sources=", len(payload.get("sources", [])) if isinstance(payload, dict) else -1)
              if path != "/v1/health" and not payload.get("sources"):
                  raise SystemExit(f"MediaMash core returned no sources for {path}")
          print("MediaMash core source smoke: OK")
          PY

      - name: Prepare Movyz deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          } > .env.production

      - name: Deploy Movyz
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .env.production --var MOVYZ_BUILD_ID:\${{ github.sha }} --var PLAYBACK_CORE_BASE_URL:https://movyz-media-core.sameranede.workers.dev

      - name: End-to-end playback smoke
        run: |
          python - <<'PY'
          import json, urllib.request
          from urllib.parse import urljoin, urlparse

          api = "https://movyz-api.sameranede.workers.dev"
          checks = [
              ("movie", "6591564a-13a9-4892-a166-247d1ff9158b", "Interstellar"),
              ("movie", "81723a1b-a9c5-46bb-bec6-f16664895d3e", "Inception"),
              ("movie", "ef350c7c-dbf6-44bb-80dc-3bc61890a166", "Fight Club"),
              ("movie", "a5c2bdf2-66f5-404a-a5dd-348cde1a32a6", "The Shawshank Redemption"),
              ("episode", "cfec368f-138e-405d-a98b-bb6734f5bbf5", "Breaking Bad S01E01"),
          ]

          opener = urllib.request.build_opener()
          opener.addheaders = [("User-Agent", "Movyz-CI/1.0")]

          def fetch_json(req):
              with opener.open(req, timeout=45) as response:
                  return response.status, json.load(response)

          def fetch_text(url):
              req = urllib.request.Request(url, headers={"Accept":"application/vnd.apple.mpegurl"})
              with opener.open(req, timeout=45) as response:
                  return response.status, response.headers.get("content-type",""), response.read(20000).decode("utf-8","replace")

          def probe_media(url, depth=0):
              if depth > 4:
                  return False
              status, ctype, body = fetch_text(url)
              if status not in (200, 206):
                  return False
              if "#EXTM3U" not in body:
                  return len(body) > 32

              for line in body.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  nested = urljoin(url, line)
                  parsed = urlparse(nested)

                  if parsed.path.lower().endswith(".m3u8") or "m3u8" in nested.lower():
                      try:
                          if probe_media(nested, depth + 1):
                              return True
                      except Exception:
                          continue
                  else:
                      try:
                          with opener.open(
                              urllib.request.Request(nested, headers={"Range":"bytes=0-2047"}),
                              timeout=45,
                          ) as response:
                              sample = response.read(4096)
                              if response.status in (200, 206) and len(sample) > 32:
                                  return True
                      except Exception:
                          continue
              return False

          for content_type, content_id, label in checks:
              payload = json.dumps({"contentType": content_type, "contentId": content_id}).encode()
              req = urllib.request.Request(
                  api + "/api/v1/playback/prepared",
                  method="POST",
                  data=payload,
                  headers={"Accept":"application/json","Content-Type":"application/json","User-Agent":"Movyz-CI/1.0"},
              )
              status, response = fetch_json(req)
              if status != 200 or response.get("success") is not True:
                  raise SystemExit(f"{label}: prepared endpoint failed")

              sources = response.get("data") if isinstance(response.get("data"), list) else []
              if not sources:
                  raise SystemExit(f"{label}: no playback sources")
              if not all(str(s.get("providerReference") or "") == "mediamash" for s in sources):
                  raise SystemExit(f"{label}: legacy provider leaked into playback")

              working = False
              for source in sources[:6]:
                  source_url = str(source.get("url") or "")
                  if not source_url.startswith("http"):
                      continue
                  try:
                      if probe_media(source_url):
                          working = True
                          print(f"PLAYBACK_OK {label}: provider={source.get('provider')} url={source_url[:180]}")
                          break
                  except Exception as exc:
                      print(f"PROBE_FAIL {label}: {exc}")
              if not working:
                  raise SystemExit(f"{label}: no playable HLS/source survived end-to-end probe")

          print("Movyz end-to-end playback smoke: ALL OK")
          PY

      - name: Deployment marker
        run: echo "DEPLOY_CURRENT_COMMIT=\${{ github.sha }}"

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production
