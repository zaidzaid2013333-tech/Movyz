name: Movyz Cloudflare Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/tmdb-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ contains(github.event.head_commit.message, 'emergency playback deploy') && format('movyz-cloudflare-emergency-{0}', github.sha) || 'movyz-cloudflare-production' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        run: npm run build

      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run

      - name: Prepare deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          } > .env.production

      - name: Deploy Movyz
        run: npx wrangler deploy --secrets-file .env.production

      # Watch API contract verification intentionally allows an empty source table during rollout.
      - name: Verify deployed Watch API contract
        run: |
          node <<'NODE'
          const base = 'https://movyz-api.sameranede.workers.dev';
          const get = async (path, timeout = 30000) => {
            const response = await fetch(base + path, {
              headers: { Accept: 'application/json' },
              redirect: 'follow',
              signal: AbortSignal.timeout(timeout),
            });
            const body = await response.text();
            console.log(path, 'HTTP', response.status, body.slice(0, 1800));
            let json = null;
            try { json = JSON.parse(body); } catch {}
            return { response, json };
          };

          const health = await get('/health', 15000);
          if (!health.response.ok || !health.json?.success || health.json?.data?.status !== 'ok') {
            throw new Error('Worker health check failed');
          }

          const catalog = await get('/api/v1/movies?page=1&limit=1', 20000);
          const items = Array.isArray(catalog.json?.data)
            ? catalog.json.data
            : catalog.json?.data?.items ?? catalog.json?.data?.movies ?? [];
          if (!Array.isArray(items) || !items.length) throw new Error('Published movie catalog is empty');

          const movie = items[0];
          const tmdbId = Number(movie?.tmdbId || movie?.tmdb_id || 0);
          if (!Number.isInteger(tmdbId) || tmdbId <= 0) {
            throw new Error('First published movie has no valid TMDB id: ' + JSON.stringify(movie).slice(0, 1200));
          }

          const watch = await get('/api/v1/watch/movie/' + encodeURIComponent(String(tmdbId)), 20000);
          if (watch.response.status === 404 && watch.json?.error?.code === 'WATCH_SOURCES_NOT_FOUND') {
            console.log('WATCH_API=PASS (contract verified; no source is configured for the first movie)');
            process.exit(0);
          }

          if (!watch.response.ok) {
            throw new Error('Watch API failed: HTTP ' + watch.response.status + ' ' + JSON.stringify(watch.json).slice(0, 1200));
          }

          const sources = Array.isArray(watch.json?.data) ? watch.json.data : [];
          if (!sources.length) throw new Error('Watch API returned success without sources');

          const source = sources[0];
          if (!/^https:\/\//i.test(String(source?.url || ''))) {
            throw new Error('Watch API returned a non-HTTPS source');
          }
          if (!['hls', 'mp4', 'dash'].includes(String(source?.type || ''))) {
            throw new Error('Watch API returned an unsupported direct type: ' + String(source?.type));
          }

          console.log('WATCH_API=PASS');
          console.log(JSON.stringify({
            tmdbId,
            provider: source.provider,
            type: source.type,
            host: new URL(source.url).host,
          }));
          NODE

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production
