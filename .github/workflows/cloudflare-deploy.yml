name: Movyz Cloudflare Deploy
# Browser Run verification trigger: 2026-10-01
# Selected playback sites: Aflam + Anime3rb/Anime4Up
# CI trigger: production deploys run from a real main-branch push.
# Emergency playback verification: selected providers must return native playable media.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/tmdb-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ contains(github.event.head_commit.message, 'emergency playback deploy') && format('movyz-cloudflare-emergency-{0}', github.sha) || 'movyz-cloudflare-production' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        env:
          MOVYZ_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Validate Cloudflare configuration
        run: |
          npx wrangler deploy --dry-run

      - name: Prepare deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          } > .env.production

      - name: Deploy Movyz
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .env.production --var MOVYZ_BUILD_ID:${{ github.sha }}

      - name: Smoke test production watch paths
        continue-on-error: true
        run: |
          set -u
          export API_BASE="https://movyz-api.sameranede.workers.dev"

          python - <<'PY'
          import json
          import os
          import urllib.request
          from urllib.error import HTTPError

          api_base = os.environ["API_BASE"]
          api_checks = [
              (f"{api_base}/api/v1/movies/tmdb/1477712", "movie", 1477712),
              (f"{api_base}/api/v1/series/tmdb/65733", "series", 65733),
          ]

          for url, expected_type, expected_tmdb in api_checks:
              with urllib.request.urlopen(url, timeout=20) as response:
                  payload = json.load(response)
              if payload.get("success") is not True:
                  raise SystemExit(f"{url}: API success=false")
              key = "movie" if expected_type == "movie" else "series"
              item = payload.get("data", {}).get(key)
              actual = int(item.get("tmdbId", 0)) if item else 0
              if actual != expected_tmdb:
                  raise SystemExit(f"{url}: expected TMDB {expected_tmdb}, got {actual}")
              print(f"API OK: {expected_type} TMDB {actual}")

          watch_url = f"{api_base}/api/v1/series/tmdb/1396/watch/1/1"
          with urllib.request.urlopen(watch_url, timeout=20) as response:
              watch_payload = json.load(response)
          watch_series = watch_payload.get("data", {}).get("series")
          if watch_payload.get("success") is not True:
              raise SystemExit(f"{watch_url}: API success=false")
          if not watch_series or int(watch_series.get("tmdbId", 0)) != 1396:
              raise SystemExit(f"{watch_url}: lightweight series watch payload is invalid")
          season = (watch_series.get("seasons") or [None])[0]
          episodes = season.get("episodes") if isinstance(season, dict) else []
          if not any(int(item.get("episodeNumber", 0)) == 1 for item in episodes if isinstance(item, dict)):
              raise SystemExit(f"{watch_url}: S01E01 missing from lightweight watch payload")
          print("Series watch API OK: Breaking Bad S01E01")

          print("Playback provider checks skipped: production player is now resolved from Movyz API playback sources.")

      # Verify the complete path: Movyz resolver -> re-3arabi -> external playback URL.
      # The selected provider is allowed to return multiple qualities, but all returned
      # sources for a title must belong to the same provider group.
      - name: Smoke test production selected playback sites
        run: |
          python - <<'PY'
          import json
          import re
          import socket
          import urllib.parse
          import urllib.request
          from urllib.error import HTTPError, URLError

          base = "https://movyz-api.sameranede.workers.dev/api/v1/playback/resolve"
          checks = [
              ("movie", 27205, None, None, "general"),  # Inception -> Aflam
              ("series", 1396, 1, 1, "general"),        # Breaking Bad S01E01
              ("series", 1396, 5, 1, "general"),        # Breaking Bad S05E01 season-binding guard
              ("series", 37854, 1, 1, "anime"),         # One Piece S01E01 -> Anime3rb/Anime4Up
          ]

          passed = 0
          warned = 0

          def check_payload(media_type, tmdb_id, season, episode, expected_kind, payload):
              sources = payload.get("data", {}).get("sources")
              if not isinstance(sources, list) or not sources:
                  return False, "no sources"

              providers = {
                  str(item.get("providerKey")).lower()
                  for item in sources
                  if isinstance(item, dict)
              }
              allowed_providers = (
                  {"aflaam"}
                  if expected_kind == "general"
                  else {"anime3rb", "anime4up"}
              )
              if not providers or not providers.issubset(allowed_providers):
                  return False, f"unexpected providers={sorted(providers)}"

              qualities = {
                  str(item.get("quality"))
                  for item in sources
                  if isinstance(item, dict) and item.get("quality")
              }
              source_types = {
                  str(item.get("type")).lower()
                  for item in sources
                  if isinstance(item, dict)
              }
              playable_types = {"hls", "mp4", "dash", "webm", "direct"}
              if not source_types.issubset(playable_types):
                  return False, f"non-native types={sorted(source_types)}"
              if "auto" in {q.lower() for q in qualities} or "source" in {q.lower() for q in qualities}:
                  return False, f"placeholder qualities={sorted(qualities)}"

              fixed_qualities = {
                  q for q in qualities
                  if re.match(r"^(2160|1440|1080|720|576|480|360|240)p$", q, re.I)
              }
              if not fixed_qualities and "adaptive" not in {q.lower() for q in qualities}:
                  return False, f"no real quality={sorted(qualities)}"

              urls = [
                  item.get("url")
                  for item in sources
                  if isinstance(item, dict)
                  and isinstance(item.get("url"), str)
                  and item.get("url", "").startswith(("https://", "http://"))
              ]
              if not urls:
                  return False, "no external URL"
              if any("movyz-api.sameranede.workers.dev" in value for value in urls):
                  return False, "Movyz is proxying playback"

              if season is not None and episode is not None:
                  expected_tag = f"S{season:02d}E{episode:02d}"
                  for value in urls:
                      tagged = re.search(r"S\d{2}E\d{2}", value, re.IGNORECASE)
                      if tagged and tagged.group(0).upper() != expected_tag:
                          return False, f"URL identity {tagged.group(0)} != {expected_tag}"

              return True, (
                  f"sources={len(urls)} qualities={sorted(qualities)} "
                  f"providers={sorted(providers)}"
              )

          for media_type, tmdb_id, season, episode, expected_kind in checks:
              params = {"type": media_type, "tmdbId": str(tmdb_id)}
              if season is not None:
                  params["season"] = str(season)
              if episode is not None:
                  params["episode"] = str(episode)

              url = base + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Movyz-CI/1.0", "Accept": "application/json"},
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except (TimeoutError, socket.timeout):
                  warned += 1
                  print(
                      "Playback WARN: timed out",
                      media_type,
                      tmdb_id,
                      f"S{season or 0:02d}E{episode or 0:02d}",
                  )
                  continue
              except URLError as exc:
                  warned += 1
                  print(
                      "Playback WARN: network error",
                      media_type,
                      tmdb_id,
                      repr(exc),
                  )
                  continue
              except HTTPError as exc:
                  warned += 1
                  body = exc.read().decode("utf-8", "replace")
                  print(f"Playback WARN: HTTP {exc.code} for {url}")
                  print(body[:4000])
                  continue

              if payload.get("success") is not True:
                  warned += 1
                  print(
                      "Playback WARN: success=false",
                      media_type,
                      tmdb_id,
                      payload.get("error") or payload.get("message") or "",
                  )
                  continue

              ok, detail = check_payload(
                  media_type,
                  tmdb_id,
                  season,
                  episode,
                  expected_kind,
                  payload,
              )
              if not ok:
                  warned += 1
                  print(
                      "Playback WARN:",
                      media_type,
                      tmdb_id,
                      f"S{season or 0:02d}E{episode or 0:02d}",
                      detail,
                  )
                  continue

              passed += 1
              print(
                  "Playback OK:",
                  media_type,
                  tmdb_id,
                  f"S{season or 0:02d}E{episode or 0:02d}",
                  detail,
              )

          print("Playback smoke summary:", {"passed": passed, "warnings": warned})
          if passed == 0:
              raise SystemExit("All production playback smoke checks failed.")

          diagnostic_url = "https://movyz-api.sameranede.workers.dev/api/v1/diagnostics/playback"
          request = urllib.request.Request(
              diagnostic_url,
              headers={"User-Agent": "Movyz-CI/1.0", "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  diagnostic = json.load(response)
              if diagnostic.get("success") is True and diagnostic.get("data", {}).get("resolver") in {"selected-sites", "re3arabi"}:
                  print("Diagnostic OK: selected playback sites resolver is active.")
              else:
                  print("Diagnostic WARN:", diagnostic)
          except Exception as exc:
              print("Diagnostic WARN:", repr(exc))
          PY

      # Probe one selected external source for native HTTP range support without storing
      # or proxying any video bytes through Movyz.
      - name: Probe re-3arabi media range support
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          resolver = "https://movyz-api.sameranede.workers.dev/api/v1/playback/resolve?type=movie&tmdbId=27205"
          request = urllib.request.Request(
              resolver,
              headers={"User-Agent": "Movyz-CI/1.0", "Accept": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=75) as response:
              payload = json.load(response)

          sources = payload.get("data", {}).get("sources", [])
          source = sources[0] if sources else None
          media_url = source.get("url") if isinstance(source, dict) else None
          if not isinstance(media_url, str):
              raise SystemExit("No media URL available for range probe")

          probe = urllib.request.Request(
              media_url,
              headers={
                  "User-Agent": "Movyz-CI/1.0",
                  "Range": "bytes=0-1023",
              },
          )
          with urllib.request.urlopen(probe, timeout=30) as response:
              response.read(1024)
              print(
                  "Range probe:",
                  "status=", response.status,
                  "content-type=", response.headers.get("Content-Type"),
                  "accept-ranges=", response.headers.get("Accept-Ranges"),
                  "content-range=", response.headers.get("Content-Range"),
              )
          PY

      # Warm only a small set of common titles/episodes after deployment.
      # No bulk episode crawl is performed.
      - name: Warm selected playback-sites cache
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://movyz-api.sameranede.workers.dev/api/v1/playback/resolve"
          checks = [
              ("movie", 27205, None, None, "general"),
              ("movie", 278, None, None, "general"),
              ("movie", 550, None, None, "general"),
              ("movie", 155, None, None, "general"),
              ("series", 1396, 1, 1, "general"),
              ("series", 5920, 1, 1, "anime"),
          ]

          for media_type, tmdb_id, season, episode, kind in checks:
              params = {"type": media_type, "tmdbId": str(tmdb_id)}
              if season is not None:
                  params["season"] = str(season)
              if episode is not None:
                  params["episode"] = str(episode)
              url = base + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Movyz-Warmup/1.0", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=75) as response:
                      payload = json.load(response)
                      sources = payload.get("data", {}).get("sources")
                      ok = (
                          response.status == 200
                          and isinstance(sources, list)
                          and len(sources) > 0
                          and all(
                              isinstance(item, dict)
                              and (
                                  item.get("providerKey") == "aflaam"
                                  if kind == "general"
                                  else item.get("providerKey") in {"anime3rb", "anime4up"}
                              )
                              for item in sources
                          )
                      )
                      print("WARMUP", media_type, tmdb_id, season or "", episode or "", "OK" if ok else "NO_SOURCE")
              except Exception as error:
                  print("WARMUP", media_type, tmdb_id, season or "", episode or "", "ERROR", error)
          PY

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production
