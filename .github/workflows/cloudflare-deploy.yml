name: Movyz Cloudflare Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/**"
      - ".github/workflows/tmdb-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[episode-fill-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        env:
          MOVYZ_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run

      - name: Validate CinePro TMDB credential
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "${TMDB_API_KEY:-}" ] && [ -z "${TMDB_API_READ_ACCESS_TOKEN:-}" ]; then
            echo "CinePro requires TMDB_API_KEY or TMDB_API_READ_ACCESS_TOKEN."
            exit 1
          fi
          if [ -n "${TMDB_API_KEY:-}" ]; then
            echo "CinePro TMDB credential: TMDB_API_KEY"
          else
            echo "CinePro TMDB credential: TMDB_API_READ_ACCESS_TOKEN"
          fi

      - name: Validate TMDB read token directly
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ.get('TMDB_API_READ_ACCESS_TOKEN', '')
          if not token:
              raise SystemExit('TMDB_API_READ_ACCESS_TOKEN is missing')
          req = urllib.request.Request(
              'https://api.themoviedb.org/3/movie/157336',
              headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json', 'User-Agent': 'Movyz-CI/1.0'},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
              print('TMDB direct status =', response.status, 'title =', payload.get('title'), 'release_date =', payload.get('release_date'), 'status =', payload.get('status'))
          PY

      - name: Deploy CinePro Core (Cloudflare adapter)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/cinepro-org/core.git .cinepro
          cd .cinepro
          npm install --no-audit --no-fund
          cat > cloudflare-entry.ts <<'EOF'
          import { OMSSServer } from '@omss/framework';
          import { knownThirdPartyProxies } from './src/thirdPartyProxies';
          import { streamPatterns } from './src/streamPatterns';
          import { MovieDownloader } from './src/providers/02moviedownloader/02moviedownloader';
          import { AnyEmbed } from './src/providers/anyembed/anyembed';
          import { CineSuProvider } from './src/providers/cinesu/cinesu';
          import { Fmovies4U } from './src/providers/fmovies4u/fmovies4u';
          import { FsharetvProvider } from './src/providers/fshare/fshare';
          import { IcefyProvider } from './src/providers/icefy/icefy';
          import { PeachifyProvider } from './src/providers/peachify/peachify';
          import { PoprProvider } from './src/providers/popr/popr';
          import { StreamMafiaProvider } from './src/providers/streammafia/streammafia';
          import { TulnexProvider } from './src/providers/tulnex/tulnex';
          import { VidApiProvider } from './src/providers/vidapi/vidapi';
          import { VideasyProvider } from './src/providers/videasy/videasy';
          import { VidNestProvider } from './src/providers/vidnest/vidnest';
          import { VidRockProvider } from './src/providers/vidrock/vidrock';
          import { VidSrcProvider } from './src/providers/vidsrc/vidsrc';
          import { VidZeeProvider } from './src/providers/vidzee/vidzee';
          import { VixSrcProvider } from './src/providers/vixsrc/vixsrc';
          
          const PUBLIC_URL = 'https://movyz-cinepro.sameranede.workers.dev';
          const tmdbApiKey = process.env.TMDB_API_KEY || process.env.TMDB_API_READ_ACCESS_TOKEN;
          if (!tmdbApiKey) throw new Error('TMDB_API_KEY is required');
          
          const nativeFetch = globalThis.fetch;
          globalThis.fetch = async (input: RequestInfo | URL, init?: RequestInit) => {
            const requestUrl = new URL(typeof input === 'string' ? input : input instanceof URL ? input.href : input.url);
            if (requestUrl.hostname === 'api.themoviedb.org') {
              requestUrl.searchParams.delete('api_key');
              const headers = new Headers(init?.headers || (input instanceof Request ? input.headers : undefined));
              headers.set('Authorization', `Bearer ${tmdbApiKey}`);
              return nativeFetch(requestUrl, { ...init, headers });
            }
            return nativeFetch(input, init);
          };
          
          const nativeSetInterval = globalThis.setInterval;
          globalThis.setInterval = (() => ({ unref() {} })) as unknown as typeof setInterval;
          
          const tmdbJson = async (path: string) => {
            const response = await nativeFetch('https://api.themoviedb.org/3' + path, {
              headers: {
                Authorization: 'Bearer ' + tmdbApiKey,
                Accept: 'application/json',
                'User-Agent': 'Movyz-CinePro/1.0',
              },
            });
            if (!response.ok) {
              const body = await response.text();
              throw new Error('TMDB request failed (' + response.status + '): ' + body.slice(0, 500));
            }
            return response.json() as Promise<any>;
          };
          
          const cinepro = new OMSSServer({
            name: 'CinePro',
            version: '1.0.0',
            host: '0.0.0.0',
            port: 8787,
            publicUrl: PUBLIC_URL,
            cache: { type: 'memory', ttl: { sources: 60 * 60, subtitles: 60 * 60 * 24 } },
            tmdb: { apiKey: tmdbApiKey, cacheTTL: 24 * 60 * 60 },
            proxyConfig: { knownThirdPartyProxies, streamPatterns },
            cors: {
              origin: '*',
              methods: ['GET', 'OPTIONS', 'HEAD'],
              allowedHeaders: ['Content-Type', 'Authorization', 'Range', 'Accept'],
              exposedHeaders: ['Content-Length', 'Content-Type', 'Content-Range', 'Accept-Ranges', 'ETag'],
              credentials: false,
            },
            stremio: { enableNativeAddon: true, stremioAddons: [] },
            mcp: { enabled: false },
          });
          globalThis.setInterval = nativeSetInterval;
          
          // Compatibility shim: keep CinePro SourceService/providers intact while using
          // TMDB Read Access Token (Bearer auth) instead of TMDB API-key query auth.
          const tmdbService = (cinepro as any).tmdbService as any;
          tmdbService.validateMovie = async (tmdbId: string) => {
            const movie = await tmdbJson('/movie/' + encodeURIComponent(tmdbId));
            const releaseDate = new Date(movie.release_date);
            const released = releaseDate <= new Date() && movie.status === 'Released';
            return { exists: true, released, releaseDate: movie.release_date || '', title: movie.title || '' };
          };
          tmdbService.validateTV = async (tmdbId: string) => {
            const tv = await tmdbJson('/tv/' + encodeURIComponent(tmdbId));
            const firstAirDate = new Date(tv.first_air_date);
            const released = firstAirDate <= new Date();
            return { exists: true, released, releaseDate: tv.first_air_date || '', title: tv.name || '' };
          };
          tmdbService.validateTVEpisode = async (tmdbId: string, season: number, episode: number) => {
            const tv = await tmdbService.validateTV(tmdbId);
            if (!tv.exists || !tv.released) return tv;
            const seasonData = await tmdbJson('/tv/' + encodeURIComponent(tmdbId) + '/season/' + season);
            const episodeData = Array.isArray(seasonData.episodes)
              ? seasonData.episodes.find((entry: any) => Number(entry.episode_number) === episode)
              : undefined;
            if (!episodeData) return { exists: false, released: false, message: 'Episode does not exist' };
            const airDate = episodeData.air_date ? new Date(episodeData.air_date) : null;
            return {
              exists: true,
              released: !!airDate && airDate <= new Date(),
              releaseDate: episodeData.air_date || '',
              title: episodeData.name || '',
            };
          };
          tmdbService.getImdbId = async (tmdbId: string, type: 'movie' | 'tv') => {
            try {
              const endpoint = type === 'movie' ? 'movie' : 'tv';
              const data = await tmdbJson('/' + endpoint + '/' + encodeURIComponent(tmdbId) + '/external_ids');
              return data.imdb_id || undefined;
            } catch {
              return undefined;
            }
          };
          
          const providers = [
            MovieDownloader, AnyEmbed, CineSuProvider, Fmovies4U, FsharetvProvider,
            IcefyProvider, PeachifyProvider, PoprProvider, StreamMafiaProvider, TulnexProvider,
            VidApiProvider, VideasyProvider, VidNestProvider, VidRockProvider, VidSrcProvider,
            VidZeeProvider, VixSrcProvider,
          ];
          const registry = cinepro.getRegistry();
          for (const Provider of providers) registry.register(new Provider());
          
          const sourceService = (cinepro as any).sourceService as {
            getMovieSources(tmdbId: string): Promise<unknown>;
            getTVSources(tmdbId: string, season: number, episode: number): Promise<unknown>;
          };
          const proxyService = (cinepro as any).proxyService as { proxyRequest(encodedData: string): Promise<any> };
          
          const json = (body: unknown, status = 200) => new Response(JSON.stringify(body), {
            status,
            headers: { 'content-type': 'application/json; charset=utf-8', 'access-control-allow-origin': '*', 'cache-control': 'no-store' },
          });
          
          export default {
            async fetch(request: Request) {
              const url = new URL(request.url);
              if (request.method === 'OPTIONS') return new Response(null, {
                status: 204,
                headers: {
                  'access-control-allow-origin': '*',
                  'access-control-allow-methods': 'GET,OPTIONS,HEAD',
                  'access-control-allow-headers': 'Content-Type, Authorization, Range, Accept',
                },
              });
              if (!['GET', 'HEAD'].includes(request.method)) return json({ error: 'METHOD_NOT_ALLOWED' }, 405);
          
              try {
                if (url.pathname === '/' || url.pathname === '/v1' || url.pathname === '/v1/' || url.pathname === '/v1/health') {
                  return json({ name: 'CinePro', version: '1.0.0', status: 'ok', providers: registry.getEnabledProviders().map((p: any) => p.name) });
                }
          
                const movie = url.pathname.match(/^\/v1\/movies\/([^/]+)$/);
                if (movie) return json(await sourceService.getMovieSources(decodeURIComponent(movie[1])));
          
                const episode = url.pathname.match(/^\/v1\/tv\/([^/]+)\/seasons\/(\d+)\/episodes\/(\d+)$/);
                if (episode) return json(await sourceService.getTVSources(
                  decodeURIComponent(episode[1]),
                  Number.parseInt(episode[2], 10),
                  Number.parseInt(episode[3], 10),
                ));
          
                const proxyData = url.pathname === '/v1/proxy' ? url.searchParams.get('data') : null;
                if (proxyData) {
                  let parsed: any;
                  try { parsed = JSON.parse(decodeURIComponent(proxyData)); }
                  catch { return json({ error: 'INVALID_PARAMETER' }, 400); }
                  const range = request.headers.get('range');
                  parsed.headers = { ...(parsed.headers ?? {}), ...(range ? { range } : {}) };
                  const response = await proxyService.proxyRequest(encodeURIComponent(JSON.stringify(parsed)));
                  const headers = new Headers(response.headers ?? {});
                  headers.set('access-control-allow-origin', '*');
                  headers.set('access-control-expose-headers', 'Content-Length, Content-Range, Accept-Ranges, Last-Modified, ETag');
                  headers.set('content-type', response.contentType || 'application/octet-stream');
                  if ('stream' in response) {
                    const { Readable } = await import('node:stream');
                    return new Response(Readable.toWeb(response.stream), { status: response.statusCode, headers });
                  }
                  return new Response(response.data, { status: response.statusCode, headers });
                }
          
                return json({ error: { code: 'ENDPOINT_NOT_FOUND', path: url.pathname } }, 404);
              } catch (error) {
                console.error('[CinePro] request failed', error);
                return json({ error: { code: 'CINEPRO_RUNTIME_ERROR', message: error instanceof Error ? error.message : String(error) } }, 500);
              }
            },
          };
          EOF
          cat > wrangler.json <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "movyz-cinepro",
            "main": "cloudflare-entry.ts",
            "compatibility_date": "2026-10-04",
            "workers_dev": true,
            "observability": { "enabled": true },
            "vars": {
              "PUBLIC_URL": "https://movyz-cinepro.sameranede.workers.dev",
              "NODE_ENV": "production",
              "HOST": "0.0.0.0",
              "PORT": "8787",
              "CACHE_TYPE": "memory",
              "STREMIO_ADDON": "true",
              "CORS_ORIGIN": "*",
              "MCP_ENABLED": "false"
            },
            "compatibility_flags": ["allow_eval_during_startup", "nodejs_compat_populate_process_env"]
          }
          EOF
          CINEPRO_TMDB_TOKEN="${TMDB_API_KEY:-${TMDB_API_READ_ACCESS_TOKEN:-}}"
          if [ -z "$CINEPRO_TMDB_TOKEN" ]; then
            echo "CinePro TMDB credential is missing after fallback resolution."
            exit 1
          fi
          printf 'TMDB_API_KEY=%s\n' "$CINEPRO_TMDB_TOKEN" > .env.cinepro
          npx wrangler deploy --config wrangler.json --secrets-file .env.cinepro
      - name: Smoke test CinePro Core
        run: |
          python - <<'PY'
          import json, urllib.request
          base = "https://movyz-cinepro.sameranede.workers.dev"
          headers = {"Accept":"application/json","User-Agent":"Movyz-CI/1.0"}
          from urllib.error import HTTPError

          for path in ["/v1/health", "/v1/movies/157336", "/v1/tv/1399/1/1"]:
              req = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      payload = json.load(response)
              except HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  print(path, "HTTP", error.code, "body=", body[:6000])
                  raise
              print(path, "sources=", len(payload.get("sources", [])) if isinstance(payload, dict) else -1)
              if path != "/v1/health" and not payload.get("sources"):
                  raise SystemExit(f"CinePro returned no sources for {path}: {json.dumps(payload)[:6000]}")
          print("CinePro Core source smoke: OK")

      - name: Prepare Movyz deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          } > .env.production

      - name: Deploy Movyz
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .env.production --var MOVYZ_BUILD_ID:${{ github.sha }} --var CINEPRO_BASE_URL:https://movyz-cinepro.sameranede.workers.dev

      - name: End-to-end CinePro playback smoke
        run: |
          python - <<'PY'
          import json, urllib.request
          api = "https://movyz-api.sameranede.workers.dev"
          checks = [
              ("movie", "6591564a-13a9-4892-a166-247d1ff9158b", "Interstellar"),
              ("movie", "81723a1b-a9c5-46bb-bec6-f16664895d3e", "Inception"),
              ("movie", "ef350c7c-dbf6-44bb-80dc-3bc61890a166", "Fight Club"),
              ("movie", "a5c2bdf2-66f5-404a-a5dd-348cde1a32a6", "The Shawshank Redemption"),
              ("episode", "cfec368f-138e-405d-a98b-bb6734f5bbf5", "Breaking Bad S01E01"),
          ]
          for content_type, content_id, label in checks:
              body = json.dumps({"contentType": content_type, "contentId": content_id}).encode()
              req = urllib.request.Request(
                  api + "/api/v1/playback/prepared",
                  method="POST",
                  data=body,
                  headers={"Accept":"application/json","Content-Type":"application/json","User-Agent":"Movyz-CI/1.0"},
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  payload = json.load(response)
              if payload.get("success") is not True:
                  raise SystemExit(f"{label}: prepared API failed")
              sources = payload.get("data") if isinstance(payload.get("data"), list) else []
              if not sources:
                  raise SystemExit(f"{label}: CinePro returned no sources")
              if not all(str(x.get("providerReference") or "") == "cinepro" for x in sources):
                  raise SystemExit(f"{label}: non-CinePro provider leaked into playback response")
              print(f"CinePro playback OK: {label} sources={len(sources)}")
          print("Movyz CinePro end-to-end smoke: ALL OK")
          PY

      - name: Deployment marker
        run: echo "DEPLOY_CURRENT_COMMIT=${{ github.sha }}"

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production .cinepro/.env.cinepro
