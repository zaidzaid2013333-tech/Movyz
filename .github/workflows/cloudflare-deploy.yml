name: Movyz Cloudflare Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/tmdb-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ contains(github.event.head_commit.message, 'emergency playback deploy') && format('movyz-cloudflare-emergency-{0}', github.sha) || 'movyz-cloudflare-production' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        run: npm run build

      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run

      - name: Prepare deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          } > .env.production

      - name: Deploy Movyz
        run: npx wrangler deploy --secrets-file .env.production

      - name: Diagnose FaselHD HTTP extraction
        run: |
          node <<'NODE'
          const hosts = [
            'https://web31818x.faselhdx.bid',
            'https://web6712x.faselhdx.bid',
            'https://www.fasel-hd.cam',
          ];
          const ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36';
          const targets = ['Night of the Living Dead', '10331'];
          for (const host of hosts) {
            for (const target of targets) {
              const url = target === '10331' ? host + '/' : host + '/?s=' + encodeURIComponent(target);
              try {
                const res = await fetch(url, {
                  redirect: 'follow',
                  headers: {
                    'User-Agent': ua,
                    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                    'Accept-Language': 'ar,en-US;q=0.9,en;q=0.8',
                  },
                  signal: AbortSignal.timeout(15000),
                });
                const body = await res.text();
                console.log(JSON.stringify({
                  requested: url,
                  status: res.status,
                  finalUrl: res.url,
                  contentType: res.headers.get('content-type'),
                  length: body.length,
                  head: body.slice(0, 1200).replace(/s+/g, ' '),
                  mediaHits: (body.match(/(?:\.m3u8|\.mp4)/gi) || []).slice(0, 10),
                  playerHits: (body.match(/(?:videoplayer|video_player|playertoken|player_token)/gi) || []).slice(0, 20),
                  titleHits: (body.match(/Night of the Living Dead/gi) || []).length,
                }));
              } catch (error) {
                console.log(JSON.stringify({requested:url,error:String(error)}));
              }
            }
          }
          NODE

      - name: Diagnose FaselHD.tech mirror
        run: |
          node <<'NODE'
          (async () => {
            const urls = [
              'https://faselhd.io/',
              'https://www.faselhd.io/',
              'https://faselhd.io/?s=The%20Shawshank%20Redemption',
              'https://faselhd.tech/',
              'https://www.faselhd.tech/',
              'https://faselhd.tech/?s=The%20Shawshank%20Redemption',
              'https://faselhd.tech/?s=%D8%A7%D9%84%D8%AE%D9%84%D8%A7%D8%B5%20%D9%85%D9%86%20%D8%B4%D8%A7%D9%88%D8%B4%D8%A7%D9%86%D9%83',
            ];
            for (const url of urls) {
              try {
                const response = await fetch(url, {
                  redirect: 'follow',
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/128 Mobile Safari/537.36',
                    Accept: 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                    'Accept-Language': 'ar,en-US;q=0.8,en;q=0.6',
                  },
                  signal: AbortSignal.timeout(15000),
                });
                const body = await response.text();
                console.log(JSON.stringify({
                  requested: url,
                  status: response.status,
                  finalUrl: response.url,
                  contentType: response.headers.get('content-type'),
                  length: body.length,
                  title: (body.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] || '').trim(),
                  arabicHits: (body.match(/الخلاص من شاوشانك/gi) || []).length,
                  shawshankHits: (body.match(/Shawshank Redemption/gi) || []).length,
                  playerIframe: (body.match(/iframe[^>]+(?:name=["']player_iframe["']|(?:src|data-src)=["'][^"']*player)/gi) || []).slice(0, 10),
                  mediaCount: (body.match(/\.m3u8|\.mp4/gi) || []).length,
                  playerCount: (body.match(/player_iframe|videoplayer|video_player|quality_change|hd_btn/gi) || []).length,
                  faselMarkers: (body.match(/faselhd|postDiv|blockMovie|seasonList|epAll/gi) || []).slice(0, 20),
                }));
              } catch (error) {
                console.log(JSON.stringify({requested:url,error:String(error)}));
              }
            }
          })();
          NODE

      - name: Inspect FaselHD Express routes
        run: |
          node <<'NODE'
          (async () => {
            const urls = ['https://faselhd.express/','https://www.faselhd.express/'];
            for (const url of urls) {
              try {
                const r = await fetch(url, {
                  redirect: 'follow',
                  headers: { 'User-Agent': 'Mozilla/5.0 (Android 13) AppleWebKit/537.36 Chrome/128 Mobile Safari/537.36' },
                  signal: AbortSignal.timeout(15000),
                });
                const html = await r.text();
                const forms = [...html.matchAll(/<form\b[^>]*>/gi)].map(m => m[0]).slice(0,20);
                const links = [...html.matchAll(/<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>/gi)].map(m => m[1]).filter(Boolean).slice(0,120);
                const scripts = [...html.matchAll(/<script\b[^>]*src\s*=\s*["']([^"']+)["']/gi)].map(m => m[1]).slice(0,30);
                const interesting = links.filter(v => /movie|film|series|search|فيلم|مسلسل|wp-json|api|episode/i.test(v));
                console.log(JSON.stringify({
                  url,
                  status:r.status,
                  forms,
                  interesting,
                  links:links.slice(0,40),
                  scripts,
                  bodyMarkers:{
                    player_iframe: html.includes('player_iframe'),
                    episodes: html.includes('epAll'),
                    postDiv: html.includes('postDiv'),
                    wordpress: /wordpress/i.test(html),
                  }
                }));
              } catch(e) {
                console.log(JSON.stringify({url,error:String(e)}));
              }
            }
          })();
          NODE

      - name: Diagnose Jina Fasel fallback
        run: |
          node <<'NODE'
          (async () => {
            for (const target of [
              'http://www.faselhd.tech/',
              'http://www.faselhd.tech/?s=The%20Shawshank%20Redemption',
              'https://www.fasel-hd.co/?s=Night%20of%20the%20Living%20Dead',
            ]) {
              const url = 'https://r.jina.ai/' + target;
              try {
                const r = await fetch(url, {
                  headers: {
                    Accept: 'text/plain,text/html,*/*;q=0.8',
                    'User-Agent': 'Movyz-Jina-Diagnostic/1.0',
                  },
                  signal: AbortSignal.timeout(20000),
                });
                const body = await r.text();
                console.log(JSON.stringify({
                  target,
                  proxyStatus: r.status,
                  finalUrl: r.url,
                  contentType: r.headers.get('content-type'),
                  length: body.length,
                  title: (body.match(/^Title:\s*(.+)$/mi)?.[1] || '').trim(),
                  shawshank: (body.match(/Shawshank Redemption|الخلاص من شاوشانك/gi) || []).length,
                  iframe: (body.match(/player_iframe|video_player|videoplayer|\.m3u8|\.mp4/gi) || []).length,
                  head: body.slice(0, 1000),
                }));
              } catch (e) {
                console.log(JSON.stringify({target,error:String(e)}));
              }
            }
          })();
          NODE

      - name: Diagnose direct Fasel upstream API
        run: |
          node <<'NODE'
          (async () => {
          const fs = require('fs');
          const code = fs.readFileSync('server/providers/adapters/faselhd.ts', 'utf8');
          const token = code.match(/const FASELHD_UPSTREAM_TOKEN = '([^']+)'/)?.[1];
          if (!token) throw new Error('Fasel upstream token is missing from provider source');

          const headers = {
            Authorization: 'Bearer ' + token,
            Accept: 'application/json',
            'User-Agent': 'Movyza-Upstream-Diagnostic/1.0',
          };

          const postSearch = async (query) => {
            const response = await fetch('https://netcore.faselhd.pro/api/v1.0/Content/ContentSearch', {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                data: { pageNumber: 1, data: { searchText: query }, pageSize: 5 },
              }),
              signal: AbortSignal.timeout(20000),
            });
            const body = await response.text();
            let json = null;
            try { json = JSON.parse(body); } catch {}
            console.log('SEARCH', query, JSON.stringify({
              httpStatus: response.status,
              statusCode: json?.statusCode,
              result: json?.result,
              body: body.slice(0, 1800),
            }));
            return json;
          };

          const getContent = async (id) => {
            const response = await fetch(
              'https://netcore.faselhd.pro/api/v1.0/Content/GetContent?ContentId=' + encodeURIComponent(String(id)),
              { headers, signal: AbortSignal.timeout(20000) },
            );
            const body = await response.text();
            let json = null;
            try { json = JSON.parse(body); } catch {}
            console.log('CONTENT', id, JSON.stringify({
              httpStatus: response.status,
              statusCode: json?.statusCode,
              resultKeys: json?.result && typeof json.result === 'object' ? Object.keys(json.result) : [],
              result: json?.result ? {
                postType: json.result.postType,
                name: json.result.name,
                videoId: json.result.videoId,
                episodesCount: Array.isArray(json.result.episodesVideosIds) ? json.result.episodesVideosIds.length : null,
              } : null,
              body: body.slice(0, 1800),
            }));
            return json;
          };

          const queries = ['Night of the Living Dead', 'Avengers', 'Avatar'];
          const searchResults = [];
          for (const query of queries) {
            try {
              const json = await postSearch(query);
              const result = json?.result;
              if (Array.isArray(result)) searchResults.push(...result);
              else if (Array.isArray(result?.data)) searchResults.push(...result.data);
              else if (Array.isArray(result?.items)) searchResults.push(...result.items);
            } catch (error) {
              console.log('SEARCH_ERROR', query, String(error));
            }
          }

          const candidate = searchResults.find((item) =>
            String(item?.title || item?.name || '').toLowerCase().includes('night')
          ) || searchResults[0];

          if (candidate) {
            console.log('CANDIDATE', JSON.stringify({
              keys: Object.keys(candidate),
              id: candidate.id,
              tmdbId: candidate.tmdbId || candidate.tmdb_id,
              title: candidate.title || candidate.name,
            }));
          }

          for (const id of [10331, candidate?.id, candidate?.tmdbId, candidate?.tmdb_id].filter(Boolean).slice(0, 4)) {
            try { await getContent(id); } catch (error) { console.log('CONTENT_ERROR', id, String(error)); }
          }
          })();
          NODE

      # Watch API must pass against the dedicated public-domain playback fixture.
      - name: Verify deployed Watch API playback
        run: |
          node <<'NODE'
          const base = 'https://movyz-api.sameranede.workers.dev';
          const get = async (path, timeout = 30000) => {
            const response = await fetch(base + path, {
              headers: { Accept: 'application/json' },
              redirect: 'follow',
              signal: AbortSignal.timeout(timeout),
            });
            const body = await response.text();
            console.log(path, 'HTTP', response.status, body.slice(0, 2200));
            let json = null;
            try { json = JSON.parse(body); } catch {}
            return { response, json };
          };

          const health = await get('/health', 15000);
          if (!health.response.ok || !health.json?.success || health.json?.data?.status !== 'ok') {
            throw new Error('Worker health check failed');
          }

          const watch = await get('/api/v1/watch/movie/278?provider=faselhd', 20000);
          if (!watch.response.ok) {
            throw new Error(
              'Dedicated playback fixture failed: HTTP ' +
              watch.response.status +
              ' ' +
              JSON.stringify(watch.json).slice(0, 1600),
            );
          }

          const sources = Array.isArray(watch.json?.data) ? watch.json.data : [];
          if (!sources.length) throw new Error('Dedicated playback fixture returned no sources');

          const source = sources.find((item) => String(item?.providerKey || '').toLowerCase() === 'faselhd' && ['hls', 'mp4', 'dash', 'webm'].includes(String(item?.type || '')));
          if (!source) throw new Error('Dedicated playback fixture returned no supported direct source');

          if (!/^https:\/\//i.test(String(source.url || ''))) {
            throw new Error('Dedicated playback fixture returned a non-HTTPS source');
          }

          if (!['hls', 'mp4', 'dash', 'webm'].includes(String(source.type || ''))) {
            throw new Error('Dedicated playback fixture returned an unsupported direct type: ' + String(source.type));
          }

          const media = await fetch(source.url, {
            method: 'GET',
            headers: {
              Range: 'bytes=0-1023',
              'User-Agent': 'MOVYZA-playback-verifier/1.0',
            },
            redirect: 'follow',
            signal: AbortSignal.timeout(30000),
          });

          const contentType = String(media.headers.get('content-type') || '').toLowerCase();
          if (!(media.status === 200 || media.status === 206)) {
            throw new Error('Direct source health check failed: HTTP ' + media.status);
          }

          if (!contentType.includes('video/') && !contentType.includes('application/octet-stream')) {
            throw new Error('Direct source returned unexpected content-type: ' + contentType);
          }

          console.log('WATCH_PLAYBACK=PASS');
          console.log(JSON.stringify({
            fixtureTmdbId: 278,
            provider: source.provider,
            type: source.type,
            sourceHost: new URL(source.url).host,
            sourceHttpStatus: media.status,
            contentType,
            subtitleLanguage: subtitle.language,
            subtitleUrl,
            subtitleHttpStatus: subtitleResponse.status,
            subtitleContentType: subtitleType,
          }));
          NODE

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production
