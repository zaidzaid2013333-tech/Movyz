name: Movyz Cloudflare Deploy
# Browser Run verification trigger: 2026-10-01
# OmegaTech-only playback resolver deployment
# CI trigger: production deploys run from a real main-branch push.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/tmdb-sync.yml"
      - ".github/workflows/omegatech-cache.yml"
      - "scripts/sync-omegatech-cache.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ contains(github.event.head_commit.message, 'emergency playback deploy') && format('movyz-cloudflare-emergency-{0}', github.sha) || 'movyz-cloudflare-production' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        run: npm run build

      - name: Validate Cloudflare configuration
        run: |
          npx wrangler deploy --dry-run

      - name: Prepare deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          } > .env.production

      - name: Deploy Movyz
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .env.production --var MOVYZ_BUILD_ID:${{ github.sha }}

      - name: Smoke test production watch paths
        continue-on-error: true
        run: |
          set -u
          export API_BASE="https://movyz-api.sameranede.workers.dev"

          python - <<'PY'
          import json
          import os
          import urllib.request

          api_base = os.environ["API_BASE"]
          api_checks = [
              (f"{api_base}/api/v1/movies/tmdb/1477712", "movie", 1477712),
              (f"{api_base}/api/v1/series/tmdb/65733", "series", 65733),
          ]

          for url, expected_type, expected_tmdb in api_checks:
              with urllib.request.urlopen(url, timeout=20) as response:
                  payload = json.load(response)
              if payload.get("success") is not True:
                  raise SystemExit(f"{url}: API success=false")
              key = "movie" if expected_type == "movie" else "series"
              item = payload.get("data", {}).get(key)
              actual = int(item.get("tmdbId", 0)) if item else 0
              if actual != expected_tmdb:
                  raise SystemExit(f"{url}: expected TMDB {expected_tmdb}, got {actual}")
              print(f"API OK: {expected_type} TMDB {actual}")

          print("Playback provider checks skipped: production player is now resolved from Movyz API playback sources.")

      # Probe OmegaTech directly from the same GitHub network used by deployment.
      # This is diagnostic only: it prints the upstream contract so resolver parsing can be corrected
      # from real responses rather than assumptions.
      - name: Probe OmegaTech Akwam contract
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          bases = [
              "https://api.omegatech.app",
              "https://omegatech-api.dixonomega.tech",
          ]

          for base in bases:
              url = base + "/api/movie/Akwam?action=search&query=Inception"
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Movyz-CI/1.0",
                      "Accept": "application/json,text/plain,*/*",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      body = response.read().decode("utf-8", "replace")
                      print(f"OMEGA STATUS {base}: {response.status}")
                      print(body[:12000])
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  print(f"OMEGA HTTP ERROR {base}: {error.code}")
                  print(body[:12000])
              except Exception as error:
                  print(f"OMEGA REQUEST ERROR {base}: {error}")
          PY

      # Temporary upstream markup probe: identify how the current Akwam page exposes its player.
      # It never changes playback resolution; it only prints a few short snippets for debugging.
      - name: Probe Akwam player markup
        continue-on-error: true
        run: |
          python - <<'PY'
          import re
          import urllib.request

          url = "https://akwam.ss/movie/562/inception-1"
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  html = response.read().decode("utf-8", "replace")
                  print(f"AKWAM PAGE STATUS: {response.status}")
                  print(f"AKWAM PAGE TYPE: {response.headers.get('content-type')}")
                  print(f"AKWAM PAGE BYTES: {len(html)}")
          except Exception as error:
              print(f"AKWAM PAGE ERROR: {error}")
              raise SystemExit(0)

          iframe_matches = re.findall(r'''<(?:iframe|embed|frame)[^>]+(?:src|data-src|data-url|data-embed|data-player)=["'][^"']+["']''', html, re.I)
          print("AKWAM IFRAME TAGS:", len(iframe_matches))
          for item in iframe_matches[:10]: print(item[:1000])

          patterns = ["iframe", "player", "jwplayer", "videojs", "video", "source", "m3u8", "mp4", "embed", "stream", "file"]
          for pattern in patterns:
              hits = [m.start() for m in re.finditer(pattern, html, re.I)]
              print(f"AKWAM PATTERN {pattern}: {len(hits)}")
              for pos in hits[:2]:
                  start = max(0, pos - 220); end = min(len(html), pos + 500)
                  snippet = re.sub(r"\\s+", " ", html[start:end])
                  print("  ", snippet[:750])
          PY
      # Verify the complete path: Movyz resolver -> OmegaTech/Akwam -> external playback URL.
      # The returned URL must stay external; Movyz must never proxy video bytes.
      - name: Smoke test production Akwam playback resolver
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://movyz-api.sameranede.workers.dev/api/v1/playback/resolve"
          checks = [
              ("movie", 27205, None, None),  # Inception
              ("series", 1396, 1, 1),       # Breaking Bad S01E01
          ]

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Movyz-CI/1.0", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read().decode("utf-8", "replace")
                      return response.status, body, json.loads(body)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  raise SystemExit(f"HTTP {error.code} from {url}: {body[:12000]}")

          for media_type, tmdb_id, season, episode in checks:
              params = {"type": media_type, "tmdbId": str(tmdb_id)}
              if season is not None:
                  params["season"] = str(season)
              if episode is not None:
                  params["episode"] = str(episode)

              url = base + "?" + urllib.parse.urlencode(params)
              status, body, payload = get_json(url)
              print(f"Resolver HTTP {status}: {body[:12000]}")

              if payload.get("success") is not True:
                  raise SystemExit(f"{media_type} {tmdb_id}: resolver returned success=false")

              sources = payload.get("data", {}).get("sources")
              if not isinstance(sources, list) or not sources:
                  raise SystemExit(f"{media_type} {tmdb_id}: resolver returned no sources")

              external = []
              for source in sources:
                  value = source.get("url") if isinstance(source, dict) else None
                  if isinstance(value, str) and value.startswith(("https://", "http://")):
                      external.append(value)

              if not external:
                  raise SystemExit(f"{media_type} {tmdb_id}: no external playback URL returned")

              if any("movyz-api.sameranede.workers.dev" in value for value in external):
                  raise SystemExit(f"{media_type} {tmdb_id}: Movyz is proxying a playback URL")

              probe = external[0]
              try:
                  range_request = urllib.request.Request(
                      probe,
                      headers={
                          "User-Agent": "Movyz-CI/1.0",
                          "Range": "bytes=0-1023",
                      },
                  )
                  with urllib.request.urlopen(range_request, timeout=20) as probe_response:
                      probe_response.read(1024)
                      print(
                          "Media probe: "
                          f"status={probe_response.status} "
                          f"content-type={probe_response.headers.get('Content-Type')} "
                          f"content-length={probe_response.headers.get('Content-Length')} "
                          f"accept-ranges={probe_response.headers.get('Accept-Ranges')} "
                          f"content-range={probe_response.headers.get('Content-Range')}"
                      )
              except Exception as probe_error:
                  print(f"Media probe warning: {probe_error}")

              print(f"Playback OK: {media_type} TMDB {tmdb_id}; sources={len(external)}")

          diagnostic_url = "https://movyz-api.sameranede.workers.dev/api/v1/diagnostics/playback"
          request = urllib.request.Request(diagnostic_url, headers={"User-Agent": "Movyz-CI/1.0", "Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=60) as response:
              content_type = response.headers.get("content-type", "")
              body = response.read().decode("utf-8", "replace")
          print(f"Diagnostic HTTP {response.status}: {body[:12000]}")
          if "application/json" not in content_type.lower():
              raise SystemExit(f"diagnostic endpoint returned non-JSON content: {content_type}")
          diagnostic = json.loads(body)
          if diagnostic.get("success") is not True:
              raise SystemExit(f"diagnostic endpoint failed: {diagnostic}")
          print(f"Diagnostic OK: build={diagnostic.get('data', {}).get('buildId')}")
          PY

      # Inspect one real 480p MP4 end-to-end for Chromium compatibility.
      # This is diagnostic only and never proxies or stores video bytes in Movyz.
      - name: Diagnose direct MP4 for Chrome
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          resolver = "https://movyz-api.sameranede.workers.dev/api/v1/playback/resolve?type=movie&tmdbId=27205"

          request = urllib.request.Request(
              resolver,
              headers={"User-Agent": "Movyz-CI/1.0", "Accept": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)

          sources = payload.get("data", {}).get("sources", [])
          mp4s = [
              item for item in sources
              if isinstance(item, dict)
              and item.get("type") == "mp4"
              and isinstance(item.get("url"), str)
              and re.search(r"\.mp4(?:$|[?#])", item["url"], re.I)
          ]
          if not mp4s:
              raise SystemExit("No direct MP4 source available for diagnostic")

          source = next((item for item in mp4s if "480p" in str(item.get("quality", ""))), mp4s[0])
          url = source["url"]
          print("DIAG_SOURCE", json.dumps({
              "quality": source.get("quality"),
              "url": url,
              "host": urllib.parse.urlparse(url).hostname,
          }))

          def get_range(start, end, label):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Movyz-CI/1.0",
                      "Range": f"bytes={start}-{end}",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  print(label, json.dumps({
                      "status": response.status,
                      "content_type": response.headers.get("Content-Type"),
                      "content_length": response.headers.get("Content-Length"),
                      "accept_ranges": response.headers.get("Accept-Ranges"),
                      "content_range": response.headers.get("Content-Range"),
                      "bytes_read": len(data),
                      "moov": b"moov" in data,
                      "mdat": b"mdat" in data,
                  }))
                  return response.headers.get("Content-Range", ""), data

          first_range, first = get_range(0, 4 * 1024 * 1024 - 1, "MP4_FIRST_4MB")
          match = re.search(r"/(\d+)$", first_range)
          if match:
              total = int(match.group(1))
              if total > 4 * 1024 * 1024:
                  get_range(max(0, total - 4 * 1024 * 1024), total - 1, "MP4_LAST_4MB")

          ffprobe = subprocess.run(
              [
                  "ffprobe", "-v", "error",
                  "-rw_timeout", "20000000",
                  "-probesize", "4000000",
                  "-analyzeduration", "4000000",
                  "-select_streams", "v:0",
                  "-show_entries", "stream=codec_name,profile,pix_fmt,width,height",
                  "-of", "json",
                  url,
              ],
              capture_output=True,
              text=True,
              timeout=25,
          )
          print("FFPROBE_EXIT", ffprobe.returncode)
          print("FFPROBE_OUT", ffprobe.stdout[:5000])
          print("FFPROBE_ERR", ffprobe.stderr[:2000])
          PY

      # Warm a small sequential set of OmegaTech sources after every production deploy.
      # Successful responses are persisted by the API, so the next user request reuses the external URL.
      - name: Warm OmegaTech playback cache
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import time

          base = "https://movyz-api.sameranede.workers.dev/api/v1/playback/resolve"
          checks = [
              ("movie", 27205, None, None),
              ("movie", 157336, None, None),
              ("movie", 278, None, None),
              ("movie", 550, None, None),
              ("movie", 155, None, None),
              ("series", 1396, 1, 1),
              ("series", 1396, 2, 1),
              ("series", 1396, 5, 1),
              ("series", 60059, 1, 1),
              ("series", 60059, 3, 1),
              ("series", 70523, 1, 1),
              ("series", 2316, 1, 1),
              ("series", 5920, 1, 1),
          ]

          for media_type, tmdb_id, season, episode in checks:
              params = {"type": media_type, "tmdbId": str(tmdb_id)}
              if season is not None:
                  params["season"] = str(season)
              if episode is not None:
                  params["episode"] = str(episode)
              url = base + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={"User-Agent": "Movyz-Warmup/1.0", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read().decode("utf-8", "replace")
                      payload = json.loads(body)
                      sources = payload.get("data", {}).get("sources") if isinstance(payload, dict) else None
                      ok = response.status == 200 and isinstance(sources, list) and len(sources) > 0
                      print("WARMUP", media_type, tmdb_id, season or "", episode or "", "OK" if ok else "NO_SOURCE")
              except Exception as error:
                  print("WARMUP", media_type, tmdb_id, season or "", episode or "", "ERROR", error)
              time.sleep(0.35)
          PY

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production
