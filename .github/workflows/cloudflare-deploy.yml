name: Movyz Cloudflare Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/**"
      - ".github/workflows/tmdb-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[episode-fill-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        env:
          MOVYZ_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run

      - name: Validate CinePro TMDB credential
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "${TMDB_API_KEY:-}" ] && [ -z "${TMDB_API_READ_ACCESS_TOKEN:-}" ]; then
            echo "CinePro requires TMDB_API_KEY or TMDB_API_READ_ACCESS_TOKEN."
            exit 1
          fi
          if [ -n "${TMDB_API_KEY:-}" ]; then
            echo "CinePro TMDB credential: TMDB_API_KEY"
          else
            echo "CinePro TMDB credential: TMDB_API_READ_ACCESS_TOKEN"
          fi

      - name: Validate TMDB read token directly
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_SLUG: zaidzaid2013333-1693
        run: |
          echo "=== Vercel deployment inspect ==="
          npx --yes vercel@62.2.0 inspect dpl_FEM8GX6w39ezpXosEMrAbx9U6TS3 --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG" || true
          echo "=== HTTP probes ==="
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ.get('TMDB_API_READ_ACCESS_TOKEN', '')
          if not token:
              raise SystemExit('TMDB_API_READ_ACCESS_TOKEN is missing')
          req = urllib.request.Request(
              'https://api.themoviedb.org/3/movie/157336',
              headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json', 'User-Agent': 'Movyz-CI/1.0'},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
              print('TMDB direct status =', response.status, 'title =', payload.get('title'), 'release_date =', payload.get('release_date'), 'status =', payload.get('status'))
          PY

      - name: Configure Vercel project routing for CinePro
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_ndHymG2FwQeIeDRv9rqhu8AHEDNl
          VERCEL_TEAM_SLUG: zaidzaid2013333-1693
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ.get('VERCEL_TOKEN', '').strip()
          project_id = os.environ['VERCEL_PROJECT_ID']
          team_slug = os.environ['VERCEL_TEAM_SLUG']
          if not token:
              raise SystemExit('VERCEL_TOKEN GitHub secret is required.')

          base = f'https://api.vercel.com/v1/projects/{project_id}/routes'
          query = urllib.parse.urlencode({'slug': team_slug})
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/json',
              'Content-Type': 'application/json',
              'User-Agent': 'Movyz-CinePro-CI/1.0',
          }

          def request(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, method=method, data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read().decode('utf-8')
                  return response.status, json.loads(raw) if raw else {}

          status, current = request('GET', base + '?' + query)
          routes = current.get('routes', []) if isinstance(current, dict) else []
          target = next(
              (
                  r for r in routes
                  if isinstance(r, dict)
                  and r.get('name') == 'Movyz CinePro catch-all'
                  and isinstance(r.get('route'), dict)
                  and r['route'].get('src') == '/(.*)'
                  and r['route'].get('dest') in ('/api/cinepro', '/api/cinepro/$1')
              ),
              None,
          )

          if target and not target.get('staged'):
              print('Vercel CinePro project route already live:', target.get('id'))
              raise SystemExit(0)

          payload = {
              'route': {
                  'name': 'Movyz CinePro catch-all',
                  'description': 'Route all CinePro paths to the deployed api/cinepro function while preserving the request path.',
                  'enabled': True,
                  'srcSyntax': 'regex',
                  'route': {
                      'src': '/(.*)',
                      'dest': '/api/cinepro/$1',
                  },
              }
          }

          if target and target.get('staged'):
              version = (current.get('version') or {}).get('id')
              if not version:
                  raise SystemExit('A staged CinePro route exists but its version id was not returned.')
              _, promoted = request('POST', base + '/versions?' + query, {'id': version, 'action': 'promote'})
              print('Promoted staged Vercel CinePro route:', promoted.get('version', {}).get('id', version))
              raise SystemExit(0)

          status, added = request('POST', base + '?' + query, payload)
          version = (added.get('version') or {}).get('id')
          if not version:
              raise SystemExit('Vercel route was created without a version id: ' + json.dumps(added)[:2000])
          _, promoted = request('POST', base + '/versions?' + query, {'id': version, 'action': 'promote'})
          print('Created and promoted Vercel CinePro route:', promoted.get('version', {}).get('id', version))
          PY

      - name: Deploy CinePro Core to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_ndHymG2FwQeIeDRv9rqhu8AHEDNl
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN GitHub secret is required to deploy CinePro Core to Vercel."
            exit 1
          fi
          set +e
          OUTPUT="$(npx --yes vercel@62.2.0 deploy --prod --yes --token "$VERCEL_TOKEN" --project "$VERCEL_PROJECT_ID" 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            echo "CinePro production deployment created."
            exit 0
          fi
          if printf '%s' "$OUTPUT" | grep -qi 'api-deployments-free-per-day'; then
            echo "Vercel Hobby daily deployment cap still active; current-source deployment will retry after the quota window."
            exit 0
          fi
          echo "Vercel deployment failed for a reason other than the daily quota."
          exit "$STATUS"
      - name: Verify CinePro Core on Vercel
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = "https://movyz-6dqf.vercel.app"
          token = os.environ.get("TMDB_API_READ_ACCESS_TOKEN", "")
          if not token:
              raise SystemExit("TMDB_API_READ_ACCESS_TOKEN is missing")
          headers = {
              "Accept": "application/json",
              "Authorization": "Bearer " + token,
              "User-Agent": "Movyz-CinePro-Vercel-CI/1.0",
          }
          checks = [
              ("health", "/v1/health"),
              ("movie", "/v1/movies/157336"),
              ("episode", "/v1/tv/1399/seasons/1/episodes/1"),
          ]
          for label, path in checks:
              req = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      payload = json.load(response)
              except Exception as error:
                  print(label, path, "FAILED:", error)
                  raise
              sources = payload.get("sources", []) if isinstance(payload, dict) else []
              print(label, path, "status=OK", "sources=", len(sources))
              if label != "health" and not sources:
                  raise SystemExit(f"Vercel CinePro returned no sources for {path}: {json.dumps(payload)[:6000]}")
          print("Vercel CinePro production smoke: OK")
          PY
      - name: Deploy CinePro Core (legacy Cloudflare adapter) [DISABLED]
        if: false
        run: echo "Legacy Cloudflare CinePro deployment disabled; Vercel is the CinePro server."

      - name: Prepare Movyz deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          } > .env.production

      - name: Deploy Movyz
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .env.production --var MOVYZ_BUILD_ID:${{ github.sha }} --var CINEPRO_BASE_URL:https://movyz-6dqf.vercel.app

      - name: End-to-end CinePro playback smoke
        run: |
          python - <<'PY'
          import json, urllib.request
          api = "https://movyz-api.sameranede.workers.dev"
          checks = [
              ("movie", "6591564a-13a9-4892-a166-247d1ff9158b", "Interstellar"),
              ("movie", "81723a1b-a9c5-46bb-bec6-f16664895d3e", "Inception"),
              ("movie", "ef350c7c-dbf6-44bb-80dc-3bc61890a166", "Fight Club"),
              ("movie", "a5c2bdf2-66f5-404a-a5dd-348cde1a32a6", "The Shawshank Redemption"),
              ("episode", "cfec368f-138e-405d-a98b-bb6734f5bbf5", "Breaking Bad S01E01"),
          ]
          for content_type, content_id, label in checks:
              body = json.dumps({"contentType": content_type, "contentId": content_id}).encode()
              req = urllib.request.Request(
                  api + "/api/v1/playback/prepared",
                  method="POST",
                  data=body,
                  headers={"Accept":"application/json","Content-Type":"application/json","User-Agent":"Movyz-CI/1.0"},
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  payload = json.load(response)
              if payload.get("success") is not True:
                  raise SystemExit(f"{label}: prepared API failed")
              sources = payload.get("data") if isinstance(payload.get("data"), list) else []
              if not sources:
                  raise SystemExit(f"{label}: CinePro returned no sources")
              if not all(str(x.get("providerReference") or "") == "cinepro" for x in sources):
                  raise SystemExit(f"{label}: non-CinePro provider leaked into playback response")
              print(f"CinePro playback OK: {label} sources={len(sources)}")
          print("Movyz CinePro end-to-end smoke: ALL OK")
          PY

      - name: Deployment marker
        run: echo "DEPLOY_CURRENT_COMMIT=${{ github.sha }}"

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production .cinepro/.env.cinepro
