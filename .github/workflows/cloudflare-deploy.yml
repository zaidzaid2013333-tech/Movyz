name: Movyza Cloudflare Deploy
# Production locale/SEO verification pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyza-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_MOVYZ_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Validate TypeScript
        run: npm run lint
      - name: Smoke test
        run: npm test
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_VIDSRC_BASE_URL: ${{ secrets.VITE_VIDSRC_BASE_URL }}
        run: npm run build
      - name: Validate Cloudflare
        run: npx wrangler deploy --dry-run
      - name: Set TMDB Worker secret
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          test -n "$TMDB_API_READ_ACCESS_TOKEN"
          printf '%s' "$TMDB_API_READ_ACCESS_TOKEN" | npx wrangler secret put TMDB_API_READ_ACCESS_TOKEN

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var MOVYZ_BUILD_ID:${{ github.sha }}
      - name: Verify HTTP alternate-port redirects to standard HTTPS
        run: |
          set -euo pipefail

          # Test the real custom domain. Cloudflare may challenge hosted CI
          # runners, so only accept a 403/1020 as inconclusive; do not test
          # the workers.dev hostname because Cloudflare normalizes its scheme
          # and alternate-port behavior differs from a routed custom hostname.
          public_status="$(curl --silent --show-error --max-redirs 0 -o /dev/null -D /tmp/movyza-redirect.headers -w '%{http_code}' 'http://movyza.sbs:2052/')"
          public_location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\r$/, ""); sub(/^[^:]*:[[:space:]]*/, ""); print }' /tmp/movyza-redirect.headers | tail -n 1)"
          echo "Public-domain HTTP status: $public_status"
          echo "Public-domain Location: $public_location"
          if [ "$public_status" = "403" ] || [ "$public_status" = "1020" ]; then
            echo "::warning::Cloudflare security challenged this hosted runner on movyza.sbs; redirect behavior must be verified in a normal browser."
          else
            test "$public_status" = "301"
            test "$public_location" = "https://movyza.sbs/"
          fi
      - name: Live health check
        run: |
          set -euo pipefail
          base="https://movyz-api.sameranede.workers.dev"

          # The Cloudflare Workers Free plan hard-stops requests with HTTP 429 after
          # the daily quota is exhausted. A deployment can still be valid in that
          # state, so do one preflight request and distinguish quota exhaustion from
          # a real application failure. This also prevents the health check itself
          # from generating a burst of failing requests.
          preflight_status="$(curl --silent --show-error --location -o /tmp/preflight.html -w '%{http_code}' "$base/")"
          if [ "$preflight_status" = "429" ]; then
            echo "Cloudflare Workers daily request quota is exhausted (HTTP 429)."
            echo "Deployment completed, but live HTTP checks are blocked until the quota resets."
            exit 0
          fi
          if [ "$preflight_status" != "200" ]; then
            echo "Unexpected production HTTP status: $preflight_status"
            cat /tmp/preflight.html || true
            exit 1
          fi

          echo "CHECK 1/10: localized home"
          html="$(cat /tmp/preflight.html)"
          printf '%s' "$html" | grep -q 'name="movyz-player" content="vidsrc"'
          printf '%s' "$html" | grep -q 'name="movyz-subtitles" content="vidsrc-locale-subtitles-v1"'

          echo "CHECK 2/10: Arabic movies"
          ar_html="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/ar/movies")"
          printf '%s' "$ar_html" | grep -q '<html lang="ar" dir="rtl"'

          echo "CHECK 3/10: English movies"
          en_html="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/en/movies")"
          printf '%s' "$en_html" | grep -q '<html lang="en" dir="ltr"'

          echo "CHECK 3A/11: localized homepage hreflang"
          ar_home="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/ar/")"
          en_home="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/en/")"
          printf '%s' "$ar_home" | grep -q 'hreflang="en-us"'
          printf '%s' "$en_home" | grep -q 'hreflang="ar-sa"'

          echo "CHECK 4/11: root sitemap indexes public information pages only"
          sitemap_headers="$(curl --fail --silent --show-error --location -D - -o /tmp/sitemap.xml -H 'Cache-Control: no-cache' "$base/sitemap.xml")"
          echo "SITEMAP RESPONSE HEADERS:"
          printf '%s\n' "$sitemap_headers"
          echo "SITEMAP RESPONSE BODY PREVIEW:"
          head -c 400 /tmp/sitemap.xml || true
          echo
          echo "SITEMAP RESPONSE SIZE: $(wc -c < /tmp/sitemap.xml) bytes"
          printf '%s' "$sitemap_headers" | grep -Eiq '^content-type: *application/xml'
          echo "SITEMAP CHECK 1/8: XML content type passed"
          sitemap="$(cat /tmp/sitemap.xml)"
          printf '%s' "$sitemap" | grep -q '^<?xml version="1.0" encoding="UTF-8"?>'
          echo "SITEMAP CHECK 2/8: XML declaration passed"
          printf '%s' "$sitemap" | grep -q '<sitemapindex'
          echo "SITEMAP CHECK 3/8: sitemap index passed"
          printf '%s' "$sitemap" | grep -q 'https://movyza.sbs/sitemap/en/movies/1.xml'
          echo "SITEMAP CHECK 4/8: movie segment passed"
          printf '%s' "$sitemap" | grep -q 'https://movyza.sbs/sitemap/en/series/1.xml'
          echo "SITEMAP CHECK 5/8: series segment passed"
          printf '%s' "$sitemap" | grep -q 'https://movyza.sbs/sitemap/en/episodes/1.xml'
          printf '%s' "$sitemap" | grep -q 'https://movyza.sbs/sitemap/en/movies/500.xml'
          printf '%s' "$sitemap" | grep -q 'https://movyza.sbs/sitemap/en/series/500.xml'
          printf '%s' "$sitemap" | grep -q 'https://movyza.sbs/sitemap/en/episodes/100.xml'
          echo "SITEMAP CHECK 6/8: episode-information segment passed"
          if printf '%s' "$sitemap" | grep -q '/watch/'; then
            echo "Playback routes must never appear in a sitemap"
            exit 1
          fi
          echo "SITEMAP CHECK 7/8: no playback URLs passed"
          printf '%s' "$sitemap" | python -c 'import sys,xml.etree.ElementTree as ET; ET.fromstring(sys.stdin.read())'
          echo "SITEMAP CHECK 8/8: XML parsing passed"

          echo "CHECK 4A/10: Cloudflare bot configuration diagnostics"
          zone_json="$(curl --silent --show-error --location --fail -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=movyza.sbs&status=active" || true)"
          zone_id="$(printf '%s' "$zone_json" | python -c 'import json,sys; d=json.load(sys.stdin) if sys.stdin.readable() else {}; print((d.get("result") or [{}])[0].get("id",""))' 2>/dev/null || true)"
          if [ -n "$zone_id" ]; then
            bot_json="$(curl --silent --show-error --location --fail -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$zone_id/bot_management" || true)"
            printf '%s' "$bot_json" | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; print("fight_mode="+str(r.get("fight_mode"))); print("sbfm_verified_bots="+str(r.get("sbfm_verified_bots"))); print("sbfm_definitely_automated="+str(r.get("sbfm_definitely_automated"))); print("sbfm_likely_automated="+str(r.get("sbfm_likely_automated")))' 2>/dev/null || echo "Bot Management read unavailable"
          else
            echo "Zone lookup unavailable with current API token"
          fi

          echo "CHECK 5/10: public Googlebot sitemap access"
          googlebot_status="$(curl --silent --show-error --location -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' -D /tmp/googlebot-public-sitemap.headers -o /tmp/googlebot-public-sitemap.xml -w '%{http_code}' "https://movyza.sbs/sitemap.xml")"
          echo "Googlebot HTTP status: $googlebot_status"
          echo "Googlebot response headers:"
          cat /tmp/googlebot-public-sitemap.headers
          echo "Googlebot response body (first 500 chars):"
          head -c 500 /tmp/googlebot-public-sitemap.xml || true
          echo
          if [ "$googlebot_status" = "200" ]; then
            googlebot_public_sitemap="$(cat /tmp/googlebot-public-sitemap.xml)"
            printf '%s' "$googlebot_public_sitemap" | grep -q '<sitemapindex'
            printf '%s' "$googlebot_public_sitemap" | grep -q 'https://movyza.sbs/sitemap/en/movies/1.xml'
            printf '%s' "$googlebot_public_sitemap" | python -c 'import sys,xml.etree.ElementTree as ET; ET.fromstring(sys.stdin.read())'
          else
            echo "WARNING: Public domain challenged the synthetic Googlebot user-agent (HTTP $googlebot_status). This does not validate real Googlebot access; check Cloudflare Security Events / Search Console separately."
          fi

          echo "CHECK 5B/10: public Google Search Console sitemap"
          gsc_status="$(curl --silent --show-error --location -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' -D /tmp/googlebot-gsc-sitemap.headers -o /tmp/googlebot-gsc-sitemap.xml -w '%{http_code}' "https://movyza.sbs/sitemap-gsc.xml")"
          echo "Googlebot GSC sitemap HTTP status: $gsc_status"
          cat /tmp/googlebot-gsc-sitemap.headers
          if [ "$gsc_status" = "200" ]; then
            gsc_sitemap="$(cat /tmp/googlebot-gsc-sitemap.xml)"
            printf '%s' "$gsc_sitemap" | grep -q '<urlset'
            printf '%s' "$gsc_sitemap" | grep -q 'https://movyza.sbs/ar/'
            printf '%s' "$gsc_sitemap" | python -c 'import sys,xml.etree.ElementTree as ET; ET.fromstring(sys.stdin.read())'
          else
            echo "WARNING: Public GSC sitemap request was challenged (HTTP $gsc_status); worker-origin and normal-browser checks remain authoritative for this deployment."
          fi

          echo "CHECK 5B/10: public robots points to same-origin sitemap"
          public_robots="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "https://movyza.sbs/robots.txt")"
          printf '%s' "$public_robots" | grep -q 'Sitemap: https://movyza.sbs/sitemap.xml'

          echo "CHECK 6/10: sitemap segment"
          sitemap_segment="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/sitemap/en/movies/1.xml")"
          printf '%s' "$sitemap_segment" | grep -q '<urlset'
          printf '%s' "$sitemap_segment" | grep -q '/en/movies/'

          echo "CHECK 7/10: static assets"
          assets="$(printf '%s' "$html" | grep -oE '/assets/[^"]+\.js' | sort -u)"
          test -n "$assets"
          printf '%s' "$html" | grep -q 'Movyza'

          echo "CHECK 8/10: TMDB proxy"
          body="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$base/tmdb/movie/550?language=en-US")"
          printf '%s' "$body" | grep -q '"id":550'

          echo "CHECK 9/10: movie deep link"
          fight_club="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/ar/movies/550")"
          printf '%s' "$fight_club" | grep -q 'Fight Club'
          # Public movie information pages are indexable; actual playback pages stay noindex.
          printf '%s' "$fight_club" | grep -q 'name="robots" content="index,follow,max-image-preview:large"'
          printf '%s' "$fight_club" | grep -q 'rel="canonical"'
          printf '%s' "$fight_club" | grep -q '"@type":"Movie"'

          echo "CHECK 10/11: episode information deep link"
          episode_html="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/ar/episodes/1396/1/1")"
          printf '%s' "$episode_html" | grep -q '"@type":"TVEpisode"'
          printf '%s' "$episode_html" | grep -q 'name="robots" content="index,follow,max-image-preview:large"'

          echo "CHECK 11/11: watch deep link stays private to playback"
          watch_html="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/ar/watch/movie/550")"
          printf '%s' "$watch_html" | grep -q 'Fight Club'
          printf '%s' "$watch_html" | grep -q 'name="robots" content="noindex,follow"'

          echo "CHECK 11/11: robots"
          robots="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/robots.txt")"
          printf '%s' "$robots" | grep -q 'Sitemap:'

          echo "ALL PRODUCTION HEALTH CHECKS PASSED"

          # Production custom domains can be protected by Cloudflare Bot Fight Mode.
          # The worker-origin checks above validate the application contract; public-domain
          # crawling is validated separately with Google Search Console URL Inspection.
