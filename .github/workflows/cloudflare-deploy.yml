name: Movyz Cloudflare Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/tmdb-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ contains(github.event.head_commit.message, 'emergency playback deploy') && format('movyz-cloudflare-emergency-{0}', github.sha) || 'movyz-cloudflare-production' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      FASELHD_API_BASE_URL: https://faselhdapi.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        run: npm run build

      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run

      - name: Prepare deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
            printf 'FASELHD_API_BASE_URL=%s\n' "$FASELHD_API_BASE_URL"
          } > .env.production

      - name: Deploy Movyz
        run: npx wrangler deploy --secrets-file .env.production

      - name: Verify FaselHD provider integration
        run: |
          node <<'NODE'
          const base = process.env.FASELHD_API_BASE_URL;
          const supabaseUrl = process.env.SUPABASE_URL;
          const serviceRoleKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const worker = 'https://movyz-api.sameranede.workers.dev';
          const fixtureTmdbId = 335984;

          if (!base || !supabaseUrl || !serviceRoleKey) {
            throw new Error('Missing FaselHD/Supabase verification configuration');
          }

          const headers = {
            apikey: serviceRoleKey,
            Authorization: 'Bearer ' + serviceRoleKey,
            'Content-Type': 'application/json',
          };

          const patchProvider = async (key, enabled) => {
            const response = await fetch(
              supabaseUrl + '/rest/v1/providers?key=eq.' + encodeURIComponent(key),
              {
                method: 'PATCH',
                headers: { ...headers, Prefer: 'return=minimal' },
                body: JSON.stringify({ enabled }),
                signal: AbortSignal.timeout(15000),
              },
            );
            if (!response.ok) {
              throw new Error('Unable to update provider ' + key + ': HTTP ' + response.status + ' ' + (await response.text()).slice(0, 1000));
            }
          };

          const getJson = async (url, timeout = 45000) => {
            const response = await fetch(url, {
              headers: { Accept: 'application/json' },
              redirect: 'follow',
              signal: AbortSignal.timeout(timeout),
            });
            const body = await response.text();
            let json = null;
            try { json = JSON.parse(body); } catch {}
            return { response, body, json };
          };

          const fasel = await getJson(base.replace(/\/$/, '') + '/movie/' + fixtureTmdbId, 60000);
          console.log('FASEL_DIRECT_HTTP=' + fasel.response.status);
          console.log('FASEL_DIRECT_BODY=' + fasel.body.slice(0, 1800));
          if (!fasel.response.ok) throw new Error('FaselHD movie endpoint failed: HTTP ' + fasel.response.status);

          const links = Array.isArray(fasel.json?.links) ? fasel.json.links : [];
          const direct = links.find((item) => /^https:\/\//i.test(String(item?.url || '')));
          if (!direct) throw new Error('FaselHD movie endpoint returned no direct HTTPS links');

          let restoredMovieBox = false;
          try {
            await patchProvider('moviebox-api', false);

            const watch = await getJson(worker + '/api/v1/watch/movie/' + fixtureTmdbId, 60000);
            console.log('MOVYZA_FASEL_WATCH_HTTP=' + watch.response.status);
            console.log('MOVYZA_FASEL_WATCH_BODY=' + watch.body.slice(0, 3000));

            if (!watch.response.ok) throw new Error('Movyz Watch endpoint failed during Fasel verification: HTTP ' + watch.response.status);

            const sources = Array.isArray(watch.json?.data) ? watch.json.data : [];
            const faselSource = sources.find((item) => String(item?.providerKey || '').toLowerCase() === 'faselhd');
            if (!faselSource) throw new Error('Movyz Watch endpoint did not return a FaselHD source');
            if (!/^https:\/\//i.test(String(faselSource.url || ''))) throw new Error('FaselHD source returned a non-HTTPS URL');
            if (!['hls', 'mp4', 'dash', 'webm'].includes(String(faselSource.type || '').toLowerCase())) {
              throw new Error('FaselHD source returned unsupported type: ' + String(faselSource.type));
            }

            console.log('MOVYZA_FASEL_INTEGRATION=PASS');
            console.log(JSON.stringify({
              fixtureTmdbId,
              faselDirectLabel: direct.label || null,
              faselDirectType: direct.type || 'hls',
              movyzaProviderKey: faselSource.providerKey,
              movyzaType: faselSource.type,
              sourceHost: new URL(faselSource.url).host,
            }));
          } finally {
            await patchProvider('moviebox-api', true);
            restoredMovieBox = true;
          }

          if (!restoredMovieBox) throw new Error('MovieBox provider was not restored');
          NODE

      # Watch API must pass against the dedicated public-domain playback fixture.
      - name: Verify deployed Watch API playback
        run: |
          node <<'NODE'
          const base = 'https://movyz-api.sameranede.workers.dev';
          const get = async (path, timeout = 30000) => {
            const response = await fetch(base + path, {
              headers: { Accept: 'application/json' },
              redirect: 'follow',
              signal: AbortSignal.timeout(timeout),
            });
            const body = await response.text();
            console.log(path, 'HTTP', response.status, body.slice(0, 2200));
            let json = null;
            try { json = JSON.parse(body); } catch {}
            return { response, json };
          };

          const health = await get('/health', 15000);
          if (!health.response.ok || !health.json?.success || health.json?.data?.status !== 'ok') {
            throw new Error('Worker health check failed');
          }

          const watch = await get('/api/v1/watch/movie/10331', 20000);
          if (!watch.response.ok) {
            throw new Error(
              'Dedicated playback fixture failed: HTTP ' +
              watch.response.status +
              ' ' +
              JSON.stringify(watch.json).slice(0, 1600),
            );
          }

          const sources = Array.isArray(watch.json?.data) ? watch.json.data : [];
          if (!sources.length) throw new Error('Dedicated playback fixture returned no sources');

          const source = sources.find((item) => ['hls', 'mp4', 'dash', 'webm'].includes(String(item?.type || '')));
          if (!source) throw new Error('Dedicated playback fixture returned no supported direct source');

          if (!/^https:\/\//i.test(String(source.url || ''))) {
            throw new Error('Dedicated playback fixture returned a non-HTTPS source');
          }

          if (!['hls', 'mp4', 'dash', 'webm'].includes(String(source.type || ''))) {
            throw new Error('Dedicated playback fixture returned an unsupported direct type: ' + String(source.type));
          }

          const media = await fetch(source.url, {
            method: 'GET',
            headers: {
              Range: 'bytes=0-1023',
              'User-Agent': 'MOVYZA-playback-verifier/1.0',
            },
            redirect: 'follow',
            signal: AbortSignal.timeout(30000),
          });

          const contentType = String(media.headers.get('content-type') || '').toLowerCase();
          if (!(media.status === 200 || media.status === 206)) {
            throw new Error('Direct source health check failed: HTTP ' + media.status);
          }

          if (!contentType.includes('video/') && !contentType.includes('application/octet-stream')) {
            throw new Error('Direct source returned unexpected content-type: ' + contentType);
          }

          const subtitleTracks = Array.isArray(source.subtitleTracks) ? source.subtitleTracks : [];
          const subtitle = subtitleTracks.find((track) => String(track?.language || '').toLowerCase().startsWith('ar'));
          if (!subtitle?.url) {
            throw new Error('Dedicated playback fixture returned no Arabic subtitle track');
          }

          const subtitleUrl = new URL(String(subtitle.url), base).toString();
          const subtitleResponse = await fetch(subtitleUrl, {
            headers: { Accept: 'text/vtt, text/plain;q=0.9, */*;q=0.8' },
            redirect: 'follow',
            signal: AbortSignal.timeout(20000),
          });
          const subtitleBody = await subtitleResponse.text();
          const subtitleType = String(subtitleResponse.headers.get('content-type') || '').toLowerCase();
          if (!subtitleResponse.ok) {
            console.log('SUBTITLE_PROXY_BODY=' + subtitleBody.slice(0, 1800));
            throw new Error('Subtitle proxy check failed: HTTP ' + subtitleResponse.status);
          }
          if (!subtitleType.includes('text/vtt')) {
            throw new Error('Subtitle proxy returned unexpected content-type: ' + subtitleType);
          }
          if (!/^WEBVTT(?:\s|$)/i.test(subtitleBody.trim())) {
            throw new Error('Subtitle proxy did not return WebVTT');
          }
          if (!/[\u0600-\u06FF]/.test(subtitleBody)) {
            throw new Error('Arabic subtitle track contains no Arabic text');
          }

          console.log('WATCH_PLAYBACK=PASS');
          console.log('WATCH_SUBTITLES=PASS');
          console.log(JSON.stringify({
            fixtureTmdbId: 10331,
            provider: source.provider,
            type: source.type,
            sourceHost: new URL(source.url).host,
            sourceHttpStatus: media.status,
            contentType,
            subtitleLanguage: subtitle.language,
            subtitleUrl,
            subtitleHttpStatus: subtitleResponse.status,
            subtitleContentType: subtitleType,
          }));
          NODE

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production
