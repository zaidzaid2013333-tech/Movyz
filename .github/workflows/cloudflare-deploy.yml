name: Movyz Cloudflare Deploy
# Browser Run verification trigger: 2026-10-01
# Selected playback sites: Aflam + Anime3rb/Anime4Up
# CI trigger: production deploys run from a real main-branch push.
# Emergency playback verification: selected providers must return native playable media.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/tmdb-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ contains(github.event.head_commit.message, 'emergency playback deploy') && format('movyz-cloudflare-emergency-{0}', github.sha) || 'movyz-cloudflare-production' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        env:
          MOVYZ_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Validate Cloudflare configuration
        run: |
          npx wrangler deploy --dry-run

      - name: Prepare deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          } > .env.production

      - name: Deploy Movyz
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .env.production --var MOVYZ_BUILD_ID:${{ github.sha }}

      - name: Smoke test production watch paths
        continue-on-error: true
        run: |
          set -u
          export API_BASE="https://movyz-api.sameranede.workers.dev"

          python - <<'PY'
          import json
          import os
          import urllib.request
          from urllib.error import HTTPError

          api_base = os.environ["API_BASE"]
          api_checks = [
              (f"{api_base}/api/v1/movies/tmdb/1477712", "movie", 1477712),
              (f"{api_base}/api/v1/series/tmdb/65733", "series", 65733),
          ]

          for url, expected_type, expected_tmdb in api_checks:
              with urllib.request.urlopen(url, timeout=20) as response:
                  payload = json.load(response)
              if payload.get("success") is not True:
                  raise SystemExit(f"{url}: API success=false")
              key = "movie" if expected_type == "movie" else "series"
              item = payload.get("data", {}).get(key)
              actual = int(item.get("tmdbId", 0)) if item else 0
              if actual != expected_tmdb:
                  raise SystemExit(f"{url}: expected TMDB {expected_tmdb}, got {actual}")
              print(f"API OK: {expected_type} TMDB {actual}")

          watch_url = f"{api_base}/api/v1/series/tmdb/1396/watch/1/1"
          with urllib.request.urlopen(watch_url, timeout=20) as response:
              watch_payload = json.load(response)
          watch_series = watch_payload.get("data", {}).get("series")
          if watch_payload.get("success") is not True:
              raise SystemExit(f"{watch_url}: API success=false")
          if not watch_series or int(watch_series.get("tmdbId", 0)) != 1396:
              raise SystemExit(f"{watch_url}: lightweight series watch payload is invalid")
          season = (watch_series.get("seasons") or [None])[0]
          episodes = season.get("episodes") if isinstance(season, dict) else []
          if not any(int(item.get("episodeNumber", 0)) == 1 for item in episodes if isinstance(item, dict)):
              raise SystemExit(f"{watch_url}: S01E01 missing from lightweight watch payload")
          print("Series watch API OK: Breaking Bad S01E01")

          print("Playback provider checks skipped: production player is now resolved from Movyz API playback sources.")

      # Verify the complete path: production watch API -> fresh cached playback sources.
      # Runtime playback must consume stored native media URLs only.
      - name: Smoke test production cached playback sources
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from urllib.error import HTTPError

          api = "https://movyz-api.sameranede.workers.dev/api/v1"
          checks = [
              ("movie", "/watch/ef350c7c-dbf6-44bb-80dc-3bc61890a166?type=movie", "Fight Club"),
              ("movie", "/watch/81723a1b-a9c5-46bb-bec6-f16664895d3e?type=movie", "Inception"),
              ("episode", "/watch/cfec368f-138e-405d-a98b-bb6734f5bbf5?type=episode", "Breaking Bad S01E01"),
          ]

          allowed_providers = {"aflaam", "anime3rb", "anime4up"}
          allowed_types = {"hls", "mp4", "dash", "webm", "direct"}
          warnings = 0

          for kind, path, label in checks:
              request = urllib.request.Request(
                  api + path,
                  headers={"User-Agent": "Movyz-CI/1.0", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except HTTPError as exc:
                  warnings += 1
                  print(f"Playback cache WARN: {label} HTTP {exc.code}")
                  continue
              except Exception as exc:
                  warnings += 1
                  print(f"Playback cache WARN: {label} {exc!r}")
                  continue

              if payload.get("success") is not True:
                  warnings += 1
                  print(f"Playback cache WARN: {label} success=false")
                  continue

              content = (payload.get("data") or {}).get("content") or {}
              sources = content.get("sources") or []
              if not sources:
                  warnings += 1
                  print(f"Playback cache WARN: {label} has no ready sources")
                  continue

              for source in sources:
                  if str(source.get("providerKey") or "").lower() not in allowed_providers:
                      raise SystemExit(f"{label}: unexpected provider")
                  if str(source.get("type") or "").lower() not in allowed_types:
                      raise SystemExit(f"{label}: non-native source type")
                  quality = str(source.get("quality") or "").lower()
                  if quality in {"auto", "source", ""}:
                      raise SystemExit(f"{label}: invalid quality {quality!r}")
                  url = str(source.get("url") or "")
                  if not url.startswith("https://"):
                      raise SystemExit(f"{label}: non-HTTPS source")
                  if "movyz-api.sameranede.workers.dev" in url:
                      raise SystemExit(f"{label}: Movyz is proxying playback")

              print(f"Playback cache OK: {label} sources={len(sources)}")

          print("Playback cache smoke warnings:", warnings)
          PY

      # Probe one selected external source for native HTTP range support without storing
      # or proxying any video bytes through Movyz.
      - name: Probe re-3arabi media range support
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          resolver = "https://movyz-api.sameranede.workers.dev/api/v1/playback/resolve?type=movie&tmdbId=27205"
          request = urllib.request.Request(
              resolver,
              headers={"User-Agent": "Movyz-CI/1.0", "Accept": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=75) as response:
              payload = json.load(response)

          sources = payload.get("data", {}).get("sources", [])
          source = sources[0] if sources else None
          media_url = source.get("url") if isinstance(source, dict) else None
          if not isinstance(media_url, str):
              raise SystemExit("No media URL available for range probe")

          probe = urllib.request.Request(
              media_url,
              headers={
                  "User-Agent": "Movyz-CI/1.0",
                  "Range": "bytes=0-1023",
              },
          )
          with urllib.request.urlopen(probe, timeout=30) as response:
              response.read(1024)
              print(
                  "Range probe:",
                  "status=", response.status,
                  "content-type=", response.headers.get("Content-Type"),
                  "accept-ranges=", response.headers.get("Accept-Ranges"),
                  "content-range=", response.headers.get("Content-Range"),
              )
          PY

      # Warm only a small set of common titles/episodes after deployment.
      # No bulk episode crawl is performed.
      - name: Warm selected playback-sites cache
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://movyz-api.sameranede.workers.dev/api/v1/playback/resolve"
          checks = [
              ("movie", 27205, None, None, "general"),
              ("movie", 278, None, None, "general"),
              ("movie", 550, None, None, "general"),
              ("movie", 155, None, None, "general"),
              ("series", 1396, 1, 1, "general"),
              ("series", 5920, 1, 1, "anime"),
          ]

          for media_type, tmdb_id, season, episode, kind in checks:
              params = {"type": media_type, "tmdbId": str(tmdb_id)}
              if season is not None:
                  params["season"] = str(season)
              if episode is not None:
                  params["episode"] = str(episode)
              url = base + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Movyz-Warmup/1.0", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=75) as response:
                      payload = json.load(response)
                      sources = payload.get("data", {}).get("sources")
                      ok = (
                          response.status == 200
                          and isinstance(sources, list)
                          and len(sources) > 0
                          and all(
                              isinstance(item, dict)
                              and (
                                  item.get("providerKey") == "aflaam"
                                  if kind == "general"
                                  else item.get("providerKey") in {"anime3rb", "anime4up"}
                              )
                              for item in sources
                          )
                      )
                      print("WARMUP", media_type, tmdb_id, season or "", episode or "", "OK" if ok else "NO_SOURCE")
              except Exception as error:
                  print("WARMUP", media_type, tmdb_id, season or "", episode or "", "ERROR", error)
          PY

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production
