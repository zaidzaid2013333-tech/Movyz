name: Movyz Cloudflare Deploy
# Playback backend: CinePro Core only. Movyz keeps Supabase/TMDB/catalog logic; CinePro resolves playback sources.
# CI trigger: production deploys run from a real main-branch push.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/**"
      - ".github/workflows/tmdb-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep exactly one production verification/deploy active.
  group: movyz-production
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[episode-fill-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        env:
          MOVYZ_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Validate Cloudflare configuration
        run: |
          npx wrangler deploy --dry-run

      - name: Prepare deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          } > .env.production

      - name: Deploy CinePro Core (upstream source + Movyz Cloudflare adapter)
        run: |
          git clone --depth 1 https://github.com/cinepro-org/core.git .cinepro
          cp integrations/cinepro/cloudflare-entry.ts .cinepro/cloudflare-entry.ts
          cp integrations/cinepro/wrangler.json .cinepro/wrangler.json
          cd .cinepro
          npm install --no-audit --no-fund

          # Cloudflare Workers does not provide Node's nextTick scheduling semantics
          # inside request execution reliably enough for Avvio's plugin lifecycle.
          # Patch only the temporary build tree; upstream CinePro source in GitHub is untouched.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, readdirSync, statSync } from 'node:fs'
          import { dirname, join } from 'node:path'
          import { createRequire } from 'node:module'
          const require = createRequire(import.meta.url)
          const avvioEntry = require.resolve('avvio')
          const avvioRoot = dirname(avvioEntry)
          const targets = [avvioEntry]
          const libDir = join(avvioRoot, 'lib')
          for (const name of readdirSync(libDir)) {
            const full = join(libDir, name)
            if (statSync(full).isFile() && full.endsWith('.js')) targets.push(full)
          }
          for (const file of targets) {
            const source = readFileSync(file, 'utf8')
            const patched = source.replaceAll('process.nextTick', 'queueMicrotask')
            if (patched !== source) writeFileSync(file, patched)
          }
          console.log('Patched Avvio nextTick compatibility:', targets.length, 'files')
          NODE

          # Disable Avvio's 10s plugin watchdog in the temporary installed framework.
          # This is a Workers compatibility setting, not a CinePro provider change.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, readdirSync, statSync } from 'node:fs'
          import { dirname, join } from 'node:path'
          import { createRequire } from 'node:module'
          const require = createRequire(import.meta.url)
          const entry = require.resolve('@omss/framework')
          const root = dirname(entry)
          const queue = [root]
          let patched = false
          while (queue.length) {
            const dir = queue.pop()
            for (const name of readdirSync(dir)) {
              const full = join(dir, name)
              const stat = statSync(full)
              if (stat.isDirectory()) {
                queue.push(full)
                continue
              }
              if (!full.endsWith('.js') && !full.endsWith('.mjs')) continue
              const source = readFileSync(full, 'utf8')
              const marker = "logger: false,"
              if (source.includes("this.app = Fastify({") && source.includes(marker) && !source.includes("pluginTimeout: 0,")) {
                writeFileSync(full, source.replace(marker, "pluginTimeout: 0,\n        logger: false,"))
                console.log('Patched OMSS Fastify pluginTimeout=0:', full)
                patched = true
              }
            }
          }
          if (!patched) throw new Error('Could not locate @omss/framework Fastify constructor')
          NODE

          npm run build
          test -n "$TMDB_API_KEY" || { echo "TMDB API credential is missing"; exit 1; }
          printf '%s' "$TMDB_API_KEY" | npx wrangler secret put TMDB_API_KEY
          npx wrangler deploy

      - name: Smoke test CinePro Core
        run: |
          set +e
          rm -f /tmp/cinepro-tail.log
          (npx wrangler tail movyz-cinepro --format json --status error --sampling-rate 0.25 > /tmp/cinepro-tail.log 2>&1) &
          TAIL_PID=$!
          sleep 4
          python - <<'PY'
          import json
          import urllib.request
          health_url = "https://movyz-cinepro.sameranede.workers.dev/v1/health"
          health_req = urllib.request.Request(health_url, headers={"Accept":"application/json","User-Agent":"Movyz-CI/1.0"})
          with urllib.request.urlopen(health_req, timeout=30) as health_response:
              health_raw = health_response.read().decode("utf-8", errors="replace")
              print("CinePro health HTTP", health_response.status)
              print(health_raw[:4000])

          url = "https://movyz-cinepro.sameranede.workers.dev/v1/movies/157336"
          req = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"Movyz-CI/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read().decode("utf-8", errors="replace")
                  payload = json.loads(raw)
                  print("CinePro HTTP", response.status)
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print("CinePro HTTP", error.code)
              print(body)
              raise
          sources = payload.get("sources") if isinstance(payload, dict) else None
          if not isinstance(sources, list) or not sources:
              print("CinePro payload:", json.dumps(payload, ensure_ascii=False)[:12000])
              raise SystemExit("CinePro returned no playable sources for Interstellar")
          print("CinePro Core OK: Interstellar sources=", len(sources))
          PY
          REQUEST_EXIT=$?
          sleep 5
          kill "$TAIL_PID" 2>/dev/null || true
          echo "===== CinePro Worker tail ====="
          cat /tmp/cinepro-tail.log || true
          echo "===== End CinePro Worker tail ====="
          exit "$REQUEST_EXIT"

      - name: Deploy Movyz
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .env.production --var MOVYZ_BUILD_ID:${{ github.sha }} --var CINEPRO_BASE_URL:https://movyz-cinepro.sameranede.workers.dev

      - name: Smoke test CinePro playback
        run: |
          python - <<'PY'
          import json
          import urllib.request

          api = "https://movyz-api.sameranede.workers.dev"
          checks = [
              ("movie", "6591564a-13a9-4892-a166-247d1ff9158b", "Interstellar"),
              ("movie", "81723a1b-a9c5-46bb-bec6-f16664895d3e", "Inception"),
              ("movie", "ef350c7c-dbf6-44bb-80dc-3bc61890a166", "Fight Club"),
              ("movie", "a5c2bdf2-66f5-404a-a5dd-348cde1a32a6", "The Shawshank Redemption"),
              ("episode", "cfec368f-138e-405d-a98b-bb6734f5bbf5", "Breaking Bad S01E01"),
          ]

          for content_type, content_id, label in checks:
              body = json.dumps({"contentType": content_type, "contentId": content_id}).encode()
              req = urllib.request.Request(
                  api + "/api/v1/playback/prepared",
                  method="POST",
                  data=body,
                  headers={"Accept":"application/json","Content-Type":"application/json","User-Agent":"Movyz-CI/1.0"},
              )
              with urllib.request.urlopen(req, timeout=35) as response:
                  payload = json.load(response)
              if payload.get("success") is not True:
                  raise SystemExit(f"{label}: prepared API failed")
              sources = payload.get("data") if isinstance(payload.get("data"), list) else []
              if not sources:
                  raise SystemExit(f"{label}: CinePro returned no sources")
              if not all(str(x.get("providerReference") or "") == "cinepro" for x in sources):
                  raise SystemExit(f"{label}: legacy provider leaked into playback response")
              print(f"CinePro playback OK: {label} sources={len(sources)}")
          PY

      - name: Deployment marker
        run: echo "DEPLOY_CURRENT_COMMIT=${{ github.sha }}"

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production .cinepro/.env.cinepro
