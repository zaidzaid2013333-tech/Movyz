name: Movyza Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyza-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_MOVYZ_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
      - name: Validate TypeScript
        run: npm run lint
      - name: Smoke test
        run: npm test
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Validate Cloudflare
        run: npx wrangler deploy --dry-run
      - name: Set TMDB Worker secret
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          test -n "$TMDB_API_READ_ACCESS_TOKEN"
          printf '%s' "$TMDB_API_READ_ACCESS_TOKEN" | npx wrangler secret put TMDB_API_READ_ACCESS_TOKEN

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var MOVYZ_BUILD_ID:${{ github.sha }}
      - name: Live health check
        run: |
          set -euo pipefail
          base="https://movyz-api.sameranede.workers.dev"
          html="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$base/")"
          assets="$(printf '%s' "$html" | grep -oE '/assets/[^"]+\.js' | sort -u)"
          echo "Live JS assets:"
          printf '%s\n' "$assets"
          test -n "$assets"
          for asset in $assets; do
            js="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$base$asset")"
            if printf '%s' "$js" | grep -Fq 'Supabase is not configured'; then
              echo "ERROR: legacy Supabase error text is still live: $asset"
              exit 1
            fi
            printf '%s' "$js" | grep -Fq 'vidsrc.sh'
          done
          printf '%s' "$html" | grep -q 'Movyza'
          body="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$base/tmdb/movie/550?language=en-US")"
          printf '%s' "$body" | grep -q '"id":550'
