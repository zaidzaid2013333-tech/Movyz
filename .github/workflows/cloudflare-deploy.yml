name: Movyz Cloudflare Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/**"
      - ".github/workflows/tmdb-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[episode-fill-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      CINEPRO_BASE_URL: https://cinepro-core-production-8b58.up.railway.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Validate code
        run: |
          npm run lint
          npm test

      - name: Build frontend
        env:
          MOVYZ_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run

      - name: Validate CinePro TMDB credential
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "${TMDB_API_KEY:-}" ] && [ -z "${TMDB_API_READ_ACCESS_TOKEN:-}" ]; then
            echo "CinePro requires TMDB_API_KEY or TMDB_API_READ_ACCESS_TOKEN."
            exit 1
          fi
          if [ -n "${TMDB_API_KEY:-}" ]; then
            echo "CinePro TMDB credential: TMDB_API_KEY"
          else
            echo "CinePro TMDB credential: TMDB_API_READ_ACCESS_TOKEN"
          fi

      - name: Validate TMDB read token directly
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ.get('TMDB_API_READ_ACCESS_TOKEN', '')
          if not token:
              raise SystemExit('TMDB_API_READ_ACCESS_TOKEN is missing')
          req = urllib.request.Request(
              'https://api.themoviedb.org/3/movie/157336',
              headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json', 'User-Agent': 'Movyz-CI/1.0'},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
              print('TMDB direct status =', response.status, 'title =', payload.get('title'))

      - name: Prepare Movyz deployment secrets
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TMDB_API_READ_ACCESS_TOKEN=%s\n' "$TMDB_API_READ_ACCESS_TOKEN"
          } > .env.production

      - name: Deploy Movyz
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .env.production --var MOVYZ_BUILD_ID:${{ github.sha }} --var CINEPRO_BASE_URL:${{ env.CINEPRO_BASE_URL }}

      - name: End-to-end CinePro playback smoke
        env:
          CINEPRO_BASE_URL: https://cinepro-core-production-8b58.up.railway.app
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.request
          api = "https://movyz-api.sameranede.workers.dev"
          core = "https://cinepro-core-production-8b58.up.railway.app"
          try:
              with urllib.request.urlopen(core + "/", timeout=30) as response:
                  print("CinePro health:", response.status)
          except Exception as error:
              print("CinePro Core not live yet; skipping playback smoke:", error)
              raise SystemExit(0)

          checks = [
              ("movie", "6591564a-13a9-4892-a166-247d1ff9158b", "Interstellar"),
              ("movie", "81723a1b-a9c5-46bb-bec6-f16664895d3e", "Inception"),
              ("movie", "ef350c7c-dbf6-44bb-80dc-3bc61890a166", "Fight Club"),
              ("movie", "a5c2bdf2-66f5-404a-a5dd-348cde1a32a6", "The Shawshank Redemption"),
              ("episode", "cfec368f-138e-405d-a98b-bb6734f5bbf5", "Breaking Bad S01E01"),
          ]
          for content_type, content_id, label in checks:
              query = "?type=" + content_type
              req = urllib.request.Request(
                  api + "/api/v1/watch/" + content_id + query,
                  method="GET",
                  headers={"Accept":"application/json","User-Agent":"Movyz-CI/1.0"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  raise SystemExit(f"{label}: watch API HTTP {error.code}: {body[:500]}")
              if payload.get("success") is not True:
                  raise SystemExit(f"{label}: watch API failed")
              content = payload.get("data", {}).get("content", {})
              sources = content.get("sources") if isinstance(content, dict) else []
              if not isinstance(sources, list) or not sources:
                  raise SystemExit(f"{label}: CinePro returned no sources")
              valid = [x for x in sources if str(x.get("providerReference") or "") == "cinepro" and str(x.get("url") or "").startswith("https://")]
              if len(valid) != len(sources):
                  raise SystemExit(f"{label}: invalid or non-CinePro source returned")
              print(f"CinePro playback OK: {label} sources={len(sources)}")
          print("Movyz CinePro end-to-end smoke: ALL OK")

      - name: Deployment marker
        run: echo "DEPLOY_CURRENT_COMMIT=${{ github.sha }}"

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .env.production .cinepro/.env.cinepro
