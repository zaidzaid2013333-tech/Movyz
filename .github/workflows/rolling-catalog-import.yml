name: Movyz rolling catalog + selected playback sync

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/rebind-selected-playback.ts"
      - "scripts/auto-catalog-import.ts"
      - ".github/workflows/rolling-catalog-import.yml"
  schedule:
    - cron: "30 3,15 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "TMDB pages to scan this run (1-6)"
        required: true
        default: "3"
        type: choice
        options: ["1","2","3","4","5","6"]
      episode_limit:
        description: "Episode playback rebind batch size"
        required: true
        default: "1000"
        type: choice
        options: ["250","500","1000","2000"]

permissions:
  contents: read

concurrency:
  group: movyz-tmdb-and-playback-sync
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      CATALOG_PAGES_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.pages || '3' }}
      MOVIE_DAILY_CAP: "240"
      SERIES_DAILY_CAP: "20"
      TMDB_REQUEST_TIMEOUT_MS: "15000"
      MOVYZA_PROVIDER_TIMEOUT_MS: "10000"
      REBIND_CONCURRENCY: "8"
      REBIND_EPISODE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.episode_limit || '1000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm resilience
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate code
        run: npm run lint

      - name: Import new TMDB catalog items
        run: npx tsx scripts/auto-catalog-import.ts

      - name: Repair and complete episode metadata
        run: npx tsx scripts/run-tmdb-sync.ts episodes 10000

      # Playback-source discovery is handled by the dedicated primary/secondary
      # prewarm workflows so catalog sync never competes with source rebuilds.

      - name: Verify catalog integrity
        run: npx tsx scripts/verify-tmdb-sync.ts
