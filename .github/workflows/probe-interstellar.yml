name: Interstellar OmegaTech probe

on:
  pull_request:
    branches: ["main"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Interstellar through OmegaTech
        run: node scripts/probe-interstellar-omegatech.mjs
