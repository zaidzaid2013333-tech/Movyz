name: Live Worker playback smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed API and current playback resolver
        run: |
          node <<'NODE'
          const base = 'https://movyz-api.sameranede.workers.dev';
          const getJson = async (path, timeout = 30000) => {
            const response = await fetch(base + path, { headers: { Accept: 'application/json' }, redirect: 'follow', signal: AbortSignal.timeout(timeout) });
            const body = await response.text();
            console.log(path, 'HTTP', response.status, body.slice(0, 1800));
            if (!response.ok) throw new Error(path + ' -> HTTP ' + response.status + ' ' + body.slice(0, 900));
            return JSON.parse(body);
          };
          const health = await getJson('/health', 15000);
          if (!health?.success || health?.data?.status !== 'ok') throw new Error('Worker health check failed');
          const catalog = await getJson('/api/v1/movies?page=1&limit=1', 20000);
          const items = Array.isArray(catalog?.data) ? catalog.data : catalog?.data?.items ?? catalog?.data?.movies ?? [];
          if (!Array.isArray(items) || !items.length) throw new Error('Published movie catalog is empty');
          const movie = items[0];
          const contentId = String(movie?.id || '');
          const playback = await getJson('/api/v1/playback/sources?contentType=movie&contentId=' + encodeURIComponent(contentId), 30000);
          const sources = Array.isArray(playback?.data) ? playback.data : [];
          if (!sources.length) throw new Error('No playable sources returned for ' + contentId);
          const source = sources[0];
          if (!source?.url || !/^https:\/\//i.test(String(source.url))) throw new Error('Invalid playback source');
          console.log('LIVE_PLAYBACK_TARGET=PASS');
          console.log(JSON.stringify({ contentId, tmdbId: movie?.tmdbId || movie?.tmdb_id, provider: source.provider, type: source.type, host: new URL(source.url).host }));
          NODE