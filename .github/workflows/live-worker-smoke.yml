name: Live Worker playback smoke

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed API and current on-demand playback resolver
        run: |
          node <<'NODE'
          const base = 'https://movyz-api.sameranede.workers.dev';

          const getJson = async (path, timeout = 30000) => {
            const response = await fetch(base + path, {
              headers: { Accept: 'application/json' },
              redirect: 'follow',
              signal: AbortSignal.timeout(timeout),
            });
            const body = await response.text();
            console.log(path, 'HTTP', response.status, body.slice(0, 1800));
            if (!response.ok) throw new Error(path + ' -> HTTP ' + response.status + ' ' + body.slice(0, 900));
            return JSON.parse(body);
          };

          const postJson = async (path, payload, timeout = 45000) => {
            const response = await fetch(base + path, {
              method: 'POST',
              headers: {
                Accept: 'application/json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(payload),
              redirect: 'manual',
              signal: AbortSignal.timeout(timeout),
            });
            const body = await response.text();
            console.log(path, 'HTTP', response.status, body.slice(0, 1800));
            if (!response.ok) throw new Error(path + ' -> HTTP ' + response.status + ' ' + body.slice(0, 900));
            return JSON.parse(body);
          };

          const health = await getJson('/health', 15000);
          if (!health?.success || health?.data?.status !== 'ok') throw new Error('Worker health check failed');

          const catalog = await getJson('/api/v1/movies?page=1&limit=1', 20000);
          const items = Array.isArray(catalog?.data) ? catalog.data : catalog?.data?.items ?? catalog?.data?.movies ?? [];
          if (!Array.isArray(items) || !items.length) throw new Error('Published movie catalog is empty');

          const checks = [
            ['movie', '81723a1b-a9c5-46bb-bec6-f16664895d3e', 'Inception'],
            ['episode', 'cfec368f-138e-405d-a98b-bb6734f5bbf5', 'Breaking Bad S01E01'],
          ];

          for (const [contentType, contentId, label] of checks) {
            const payload = await postJson('/api/v1/playback/prepared', { contentType, contentId });
            const sources = Array.isArray(payload?.data) ? payload.data : [];
            if (!payload?.success || !sources.length) throw new Error(label + ': no on-demand source returned');

            const source = sources[0];
            const url = String(source?.url || '');
            if (!/^https:\/\//i.test(url)) throw new Error(label + ': invalid playback URL');
            if (url.toLowerCase().includes('akwam.ss')) throw new Error(label + ': raw Akwam URL leaked');
            if (!/^https:\/\/[^/]+\/api\/v1\/playback\/stream\?token=/i.test(url)) {
              throw new Error(label + ': expected signed Movyz redirect URL');
            }

            const media = await fetch(url, {
              headers: { Range: 'bytes=0-1', Accept: '*/*' },
              redirect: 'follow',
              signal: AbortSignal.timeout(45000),
            });
            const contentTypeHeader = String(media.headers.get('content-type') || '').toLowerCase();
            if (!media.ok) throw new Error(label + ': redirected media HTTP ' + media.status);
            if (/text\/html|application\/json|text\/json/i.test(contentTypeHeader)) {
              throw new Error(label + ': redirected target is not media: ' + contentTypeHeader);
            }

            console.log('ON_DEMAND_PLAYBACK_PASS', JSON.stringify({
              label,
              quality: source.quality,
              type: source.type,
              finalUrl: media.url.replace(/\/[^/]+$/, '/…'),
              contentType: contentTypeHeader,
            }));
          }

          console.log('LIVE_ON_DEMAND_PLAYBACK=PASS');
          NODE
