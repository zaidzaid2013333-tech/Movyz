name: Live Worker playback smoke

on:
  workflow_run:
    workflows: ["Movyz Cloudflare Deploy"]
    types: [completed]
  workflow_dispatch:

jobs:
  live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed API and VidRift playback target
        run: |
          node <<'NODE'
          const base = 'https://movyz-api.sameranede.workers.dev';
          const headers = {'Accept':'application/json'};

          const getJson = async (path, timeout = 20000) => {
            const r = await fetch(base + path, {
              headers,
              redirect: 'follow',
              signal: AbortSignal.timeout(timeout),
            });
            const body = await r.text();
            console.log(path, 'HTTP', r.status, body.slice(0, 1200));
            if (!r.ok) {
              throw new Error(path + ' -> HTTP ' + r.status + ' ' + body.slice(0, 600));
            }
            return JSON.parse(body);
          };

          const health = await getJson('/health', 15000);
          if (!health?.success) throw new Error('Worker health check failed');

          const catalog = await getJson('/api/v1/movies?search=Interstellar&page=1&limit=5');
          const items = Array.isArray(catalog?.data)
            ? catalog.data
            : catalog?.data?.items ?? catalog?.data?.movies ?? catalog?.movies ?? [];
          if (!Array.isArray(items) || !items.length) {
            throw new Error('Catalog returned no Interstellar result');
          }

          const movie = items.find((item) =>
            /interstellar/i.test(String(item?.titleEn || item?.title || ''))
          ) || items[0];

          const tmdbId = Number(movie?.tmdbId || movie?.tmdb_id || 0);
          if (!Number.isInteger(tmdbId) || tmdbId <= 0) {
            throw new Error('Catalog movie has no valid TMDB id: ' + JSON.stringify(movie).slice(0, 900));
          }

          const embedUrl =
            'https://embed.vidrift.net/embed/movie/' +
            encodeURIComponent(String(tmdbId)) +
            '?title=' + encodeURIComponent(String(movie?.titleEn || 'Interstellar')) +
            '&brand=Movyza';

          // VidRift explicitly serves /embed/* to framed browsers and may return
          // 403 to plain programmatic fetches. Simulate an iframe navigation.
          const embed = await fetch(embedUrl, {
            method: 'GET',
            headers: {
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Referer': base + '/',
              'Sec-Fetch-Dest': 'iframe',
              'Sec-Fetch-Mode': 'navigate',
              'Sec-Fetch-Site': 'cross-site',
            },
            redirect: 'follow',
            signal: AbortSignal.timeout(20000),
          });

          const embedBody = await embed.text();
          console.log('VIDRIFT', JSON.stringify({
            tmdbId,
            status: embed.status,
            finalUrl: embed.url,
            type: embed.headers.get('content-type'),
            sample: embedBody.slice(0, 500),
          }));

          if (!embed.ok || !(embed.headers.get('content-type') || '').includes('text/html')) {
            throw new Error('VidRift embed is not reachable as an iframe target: HTTP ' + embed.status);
          }

          if (!/VidRift|vidrift/i.test(embedBody)) {
            throw new Error('VidRift embed HTML did not contain the player shell');
          }

          console.log('LIVE_PLAYBACK_TARGET=PASS');
          console.log('PASSED_MOVIE', JSON.stringify({
            id: movie?.id,
            title: movie?.titleEn || movie?.title,
            tmdbId,
            embedUrl,
          }).slice(0, 2500));
          NODE
