name: Live Worker playback smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed API and current playback resolver
        run: |
          node <<'NODE'
          const base = 'https://movyz-api.sameranede.workers.dev';
          const getJson = async (path, timeout = 30000) => {
            const response = await fetch(base + path, { headers: { Accept: 'application/json' }, redirect: 'follow', signal: AbortSignal.timeout(timeout) });
            const body = await response.text();
            console.log(path, 'HTTP', response.status, body.slice(0, 1800));
            if (!response.ok) throw new Error(path + ' -> HTTP ' + response.status + ' ' + body.slice(0, 900));
            return JSON.parse(body);
          };
          const health = await getJson('/health', 15000);
          if (!health?.success || health?.data?.status !== 'ok') throw new Error('Worker health check failed');
          const exactContentId = 'ede72834-fcbb-4172-8a16-224b8dd96cb7';
          const watch = await getJson('/api/v1/watch/movie/278', 45000);
          const sources = Array.isArray(watch?.data) ? watch.data : [];
          if (!sources.length) throw new Error('Shawshank /api/v1/watch/movie/278 returned no sources: ' + JSON.stringify(watch));
          for (const source of sources) {
            if (!source?.url || !/^https:\/\//i.test(String(source.url))) throw new Error('Invalid Shawshank source: ' + JSON.stringify(source));
            if (!['mp4','hls','dash','webm'].includes(String(source.type||'').toLowerCase())) throw new Error('Invalid Shawshank type: ' + JSON.stringify(source));
          }
          const legacy = await getJson('/watch/' + exactContentId, 20000);
          if (legacy?.data?.id !== exactContentId) throw new Error('UUID watch route mismatch');
          console.log('SHAWSHANK_PLAYBACK_TARGET=PASS');
          console.log(JSON.stringify(sources));
          NODE