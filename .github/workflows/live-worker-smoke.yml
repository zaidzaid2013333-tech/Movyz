name: Live Worker playback smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Worker API and playback resolver
        run: |
          node <<'NODE'
          const base = 'https://movyz-api.sameranede.workers.dev';
          const headers = {'Accept':'application/json'};

          const getJson = async (path, timeout = 20000) => {
            const r = await fetch(base + path, {
              headers, redirect:'follow', signal:AbortSignal.timeout(timeout)
            });
            const body = await r.text();
            console.log(path, 'HTTP', r.status, body.slice(0,900));
            if (!r.ok) throw new Error(path + ' -> HTTP ' + r.status + ' ' + body.slice(0,500));
            return JSON.parse(body);
          };

          let health;
          for (let i = 1; i <= 24; i++) {
            try {
              health = await getJson('/health', 15000);
              if (health?.success) break;
            } catch (e) { console.log('HEALTH_RETRY', i, String(e)); }
            await new Promise(r => setTimeout(r, 15000));
          }
          if (!health?.success) throw new Error('Worker health did not become ready');

          const movies = await getJson('/api/v1/movies?search=Interstellar&page=1&limit=5');
          const items = movies?.data?.items ?? movies?.data?.movies ?? movies?.data ?? [];
          if (!Array.isArray(items) || !items.length) throw new Error('Interstellar is not present in the catalog');

          const movie = items[0];
          const watch = await getJson('/api/v1/watch/' + encodeURIComponent(movie.id), 20000);
          const sources = watch?.data?.sources ?? [];
          console.log('MOVIE_RESULT', JSON.stringify({
            id: movie.id, title: movie.title, titleEn: movie.titleEn, sourceCount: sources.length,
            providers: sources.map(s => s.provider)
          }));
          const vidzee = sources.find(s => String(s?.provider || '').toLowerCase() === 'vidzee');
          if (!vidzee?.url || !/^https?:\/\//i.test(vidzee.url)) {
            throw new Error('Interstellar returned no valid VidZee source through the live Worker');
          }

          const stream = await fetch(vidzee.url, {
            headers:{Range:'bytes=0-1023'}, redirect:'follow', signal:AbortSignal.timeout(20000)
          });
          const type = (stream.headers.get('content-type') || '').toLowerCase();
          console.log('STREAM', stream.status, stream.url, type);
          const playable = type.includes('mpegurl') || type.includes('video/') ||
            /\.m3u8(?:$|\?)/i.test(stream.url) || stream.status === 206 || stream.status === 416;
          if (!playable) throw new Error('Interstellar VidZee source is not playable');

          console.log('LIVE_WORKER_PLAYBACK=PASS');
          console.log('PASSED_MOVIE', JSON.stringify({movie, vidzee, stream:{status:stream.status,type,url:stream.url}}).slice(0,3000));
          NODE
