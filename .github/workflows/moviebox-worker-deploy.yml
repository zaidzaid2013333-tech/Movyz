name: MovieBox Worker Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "moviebox-worker/**"
      - ".github/workflows/moviebox-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movyz-moviebox-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker package
        run: npx wrangler deploy --config moviebox-worker/wrangler.toml --dry-run

      - name: Deploy MovieBox Worker
        run: npx wrangler deploy --config moviebox-worker/wrangler.toml

      - name: Verify MovieBox Worker playback API
        run: |
          node <<'NODE'
          const base = 'https://movyz-moviebox.sameranede.workers.dev';
          const getJson = async (path, timeout = 30000) => {
            const response = await fetch(base + path, {
              headers: { Accept: 'application/json' },
              redirect: 'follow',
              signal: AbortSignal.timeout(timeout),
            });
            const body = await response.text();
            console.log(path, 'HTTP', response.status, body.slice(0, 1600));
            if (!response.ok) throw new Error(path + ' -> HTTP ' + response.status + ' ' + body.slice(0, 700));
            return JSON.parse(body);
          };

          const search = await getJson('/search?q=Interstellar', 30000);
          const items = search?.movies ?? search?.results ?? search?.items ?? [];
          if (!Array.isArray(items) || !items.length) throw new Error('MovieBox search returned no Interstellar result');

          const first = items[0];
          const slug = String(first?.slug ?? first?.detailPath ?? '').trim();
          if (!slug) throw new Error('MovieBox search result has no slug');

          const detail = await getJson('/detail/' + encodeURIComponent(slug), 30000);
          const subjectId = detail?.metadata?.id ?? detail?.subjectId ?? detail?.id ?? detail?.data?.subjectId ?? detail?.data?.id;
          if (!subjectId) throw new Error('MovieBox detail returned no subject id');

          const stream = await getJson(
            '/api/stream/' + encodeURIComponent(String(subjectId)) +
            '?detail_path=' + encodeURIComponent(slug) + '&se=0&ep=0',
            30000
          );
          const sources = stream?.sources ?? stream?.streams ?? stream?.data?.sources ?? stream?.data?.streams ?? [];
          if (!Array.isArray(sources) || !sources.length) throw new Error('MovieBox stream returned no sources');

          const candidate = sources.find((s) => /^https:\/\//i.test(String(s?.url ?? s?.playUrl ?? s?.resourceUrl ?? ''))) || sources[0];
          const url = String(candidate?.url ?? candidate?.playUrl ?? candidate?.resourceUrl ?? '');
          if (!/^https:\/\//i.test(url)) throw new Error('MovieBox source is not HTTPS');

          const media = await fetch(url, {
            headers: { Range: 'bytes=0-1023' },
            redirect: 'follow',
            signal: AbortSignal.timeout(30000),
          });
          const type = (media.headers.get('content-type') || '').toLowerCase();
          const finalUrl = media.url;
          const isHls = /\.m3u8(?:$|[?#])/i.test(finalUrl) || type.includes('mpegurl');
          const isDash = /\.mpd(?:$|[?#])/i.test(finalUrl) || type.includes('dash+xml');
          const isVideo = type.includes('video/');
          if (![200, 206, 416].includes(media.status) || (!isHls && !isDash && !isVideo)) {
            throw new Error('MovieBox source is not playable media: HTTP ' + media.status + ' ' + type + ' ' + finalUrl);
          }

          console.log('MOVIEBOX_WORKER_PLAYBACK=PASS');
          console.log(JSON.stringify({
            slug,
            subjectId: String(subjectId),
            sourceCount: sources.length,
            type: isHls ? 'hls' : isDash ? 'dash' : 'video',
            contentType: type,
            host: new URL(finalUrl).host,
          }));
          NODE
