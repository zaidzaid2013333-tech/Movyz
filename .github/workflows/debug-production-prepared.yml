name: Movyz production prepared playback diagnostic

on:
  push:
    paths:
      - ".github/workflows/debug-production-prepared.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production prepared playback
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          api = "https://movyz-api.sameranede.workers.dev"
          body = json.dumps({
            "contentType": "movie",
            "contentId": "6591564a-13a9-4892-a166-247d1ff9158b"
          }).encode()
          req = urllib.request.Request(
            api + "/api/v1/playback/prepared",
            method="POST",
            data=body,
            headers={
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "Movyz-Diagnostics/1.0",
            },
          )
          try:
            with urllib.request.urlopen(req, timeout=45) as resp:
              payload = json.load(resp)
              print(json.dumps(payload, indent=2))
          except urllib.error.HTTPError as exc:
            print("HTTP", exc.code)
            print(exc.read().decode(errors="replace"))
            raise
          PY
