name: Movyza Native Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Validate configuration
        run: |
          test -n "$TMDB_API_READ_ACCESS_TOKEN"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Stage APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk movyza-native-debug.apk
          ls -lh movyza-native-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movyza-native-debug
          path: android/movyza-native-debug.apk
          if-no-files-found: error
          retention-days: 14