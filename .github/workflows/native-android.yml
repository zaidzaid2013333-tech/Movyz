name: Movyza Native Android APK

on:
  push:
    branches: [main, ramus-preview-2]
    paths:
      - "android/**"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: movyza-native-android
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PLAYBACK_API_BASE: https://movyz-36.sameranede.deno.net
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | head -80

      - name: Validate configuration
        run: |
          test -n "$TMDB_API_READ_ACCESS_TOKEN"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$PLAYBACK_API_BASE"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Stage APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk movyza-native-debug.apk
          ls -lh movyza-native-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movyza-native-debug
          path: android/movyza-native-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable Ramus APK
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/ramus-preview-2' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release view ramus-prebuilt --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create ramus-prebuilt               --repo "$GITHUB_REPOSITORY"               --title "Ramus prebuilt APK"               --notes "Stable debug APK used by the Ramus PR preview."               --target "$GITHUB_SHA"
          gh release upload ramus-prebuilt movyza-native-debug.apk             --repo "$GITHUB_REPOSITORY"             --clobber

      - name: Store verified APK in Ramus preview branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'ramus-preview-2' }}
        run: |
          set -eux
          cp android/movyza-native-debug.apk /tmp/ramus-native-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ramus-preview-2
          git checkout -B ramus-preview-2 origin/ramus-preview-2
          mkdir -p .ramus
          cp /tmp/ramus-native-debug.apk .ramus/movyza-native-debug.apk
          git add .ramus/movyza-native-debug.apk
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ramus): refresh verified preview APK"
          git push origin HEAD:ramus-preview-2
