name: Movyz full movie secondary source prewarm

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/full-movie-secondary-source-prewarm.yml"
  workflow_dispatch:

permissions:
  contents: read

# Retired legacy workflow. Keep the concurrency group so a stale pending run
# from the old workflow can be superseded and removed from the Actions queue.
concurrency:
  group: movyz-full-movie-secondary-prewarm
  cancel-in-progress: true

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-slim
    steps:
      - run: echo "Legacy secondary source prewarm retired; no runner work required."
