name: Movyz curated mismatch repair

on:
  push:
    branches: ["ui/watch-player-responsive-20261005"]
    paths:
      - "scripts/repair-curated-mismatches.ts"
      - ".github/workflows/curated-mismatch-repair.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: movyz-curated-mismatch-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      TMDB_REQUEST_TIMEOUT_MS: "15000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure npm resilience
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set audit false
          npm config set fund false
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate Movyz TypeScript
        run: npx tsc --noEmit
      - name: Repair curated mappings
        run: npx tsx scripts/repair-curated-mismatches.ts
